    async function loadBackupStatus() {
      try {
        const api = getApiEndpoint();
        const res = await fetch(api + (api.includes('?') ? '&' : '?') + 'action=backupStatus&session=' + encodeURIComponent(auth.session), { cache: 'no-store' }).then(r => r.json());
        if (!res || !res.ok) throw new Error((res && res.error) || '불러오지 못했습니다.');
        renderBackupBox(res);
      } catch (err) {
        const box = document.getElementById('backup-box');
        if (box) box.innerHTML = `<span class="text-rose-600">${escapeHtml(err.message)}</span>`;
      }
    }
    async function backupAction(opts) {
      const box = document.getElementById('backup-box');
      if (box && opts.now) box.insertAdjacentHTML('afterbegin', '<p class="text-indigo-700 font-semibold mb-1">백업하는 중... (몇 초 걸립니다)</p>');
      try {
        const res = await postAuth({ action: 'backup', session: auth.session, ...opts });
        if (!res || !res.ok) {
          if (res && handleAuthError(res)) return;
          throw new Error((res && res.error) || '실패했습니다.');
        }
        renderBackupBox(res);
        showToast(opts.now ? `백업했습니다: ${res.last.name}` : res.enabled ? '자동 백업을 켰습니다. 매일 새벽 3시에 백업합니다.' : '자동 백업을 껐습니다.', 'success');
      } catch (err) {
        showToast('백업 실패: ' + err.message, 'error');
        loadBackupStatus();
      }
    }

    function copyTextToClipboard(text, successMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(successMsg, 'success');
        }).catch(() => fallbackCopy(text, successMsg));
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(successMsg, 'success');
      } catch (e) {
        showToast('복사에 실패했습니다.', 'error');
      }
      document.body.removeChild(ta);
    }

    function exportJsonFile() {
      const blob = new Blob([JSON.stringify(pickData(state), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `teamhub_backup_${TODAY}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('JSON 백업 파일이 다운로드되었습니다.', 'success');
    }

    function importJsonFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => importJsonText(String(ev.target.result || ''), `"${file.name}" 파일`, true);
      reader.onerror = () => showToast('파일을 읽지 못했습니다. 회사 보안 프로그램이 막았다면 [붙여넣기로 가져오기]를 써 주세요.', 'error');
      reader.readAsText(file);
    }

    // 파일 또는 붙여 넣은 글자에서 가져오기 (회사 보안으로 파일이 암호화되면 붙여넣기를 씀)
    function importJsonText(text, sourceLabel, fromFile) {
      {
        let parsed;
        try {
          parsed = JSON.parse(String(text || '').replace(/^﻿/, '').trim());
        } catch (err) {
          showToast(fromFile ? 'JSON 파일을 읽지 못했습니다. 회사 보안 프로그램이 파일을 암호화했을 수 있습니다. [붙여넣기로 가져오기]를 써 주세요.' : '붙여 넣은 내용이 올바른 JSON이 아닙니다. 처음 { 부터 마지막 } 까지 모두 복사했는지 확인하세요.', 'error');
          return;
        }
        if (!parsed || !Array.isArray(parsed.projects)) {
          showToast('올바른 TeamHub JSON 파일이 아닙니다.', 'error');
          return;
        }
        const data = sanitizeData(parsed);
        askConfirm({
          title: 'JSON 가져오기',
          message: `${sourceLabel}(으)로 ${getApiEndpoint() ? '서버의 모든 데이터(팀원 전체 공유)' : '이 브라우저의 데이터'}를 바꿉니다.\n프로젝트 ${data.projects.length}건, 팀원 ${data.members.length}명, 일간보고 ${data.dailyReports.length}건\n\n현재 데이터는 사라집니다. 먼저 JSON 내보내기로 백업했는지 확인하세요.`,
          confirmLabel: '가져오기',
          onConfirm: () => {
            if (!commit([{ op: 'replaceAll', data }])) return;
            renderAll();
            showToast('데이터를 성공적으로 불러왔습니다.', 'success');
          }
        });
      }
    }

    function resetToDefaultState() {
      const shared = !!getApiEndpoint();
      askConfirm({
        title: '초기 샘플 데이터로 되돌리기',
        message: shared
          ? '서버에 저장된 팀 전체 데이터가 샘플 데이터로 바뀝니다.\n모든 팀원의 보고서·프로젝트·일정이 사라지며 되돌릴 수 없습니다.'
          : '이 브라우저에 저장된 데이터가 샘플 데이터로 바뀝니다.',
        confirmLabel: '샘플로 되돌리기',
        requireText: shared ? '초기화' : '',
        onConfirm: () => {
          if (!commit([{ op: 'replaceAll', data: clone(SAMPLE_DATA) }])) return;
          renderAll();
          showToast('초기 샘플 데이터로 복원되었습니다.', 'info');
        }
      });
    }

    function copyWeeklyMarkdown() {
      const reports = state.weeklyReports.filter(w => state.weeklyFilterWeek === '전체' || w.week === state.weeklyFilterWeek);
      const md = reports.map(r => {
        const author = getMember(r.authorId);
        return `### [${r.weekLabel}] ${author.name}\n- 금주 완료/진행:\n${r.completed}\n- 차주 계획:\n${r.nextPlan}\n- 이슈/요청: ${r.blockers || '없음'}`;
      }).join('\n\n');
      copyTextToClipboard(plainText(md) || '등록된 주간보고가 없습니다.', '주간보고 요약이 클립보드에 복사되었습니다.');
    }

    function copyDailyMarkdown() {
      const reports = state.dailyReports.filter(d => !state.dailyFilterDate || d.date === state.dailyFilterDate);
      const md = reports.map(d => {
        const author = getMember(d.authorId);
        if (isLegacyDaily(d)) return `### [${d.date}] ${author.name} (${d.condition})\n- 어제: ${d.yesterday.replace(/\n/g, ' ')}\n- 오늘: ${d.today.replace(/\n/g, ' ')}\n- 블로커: ${d.blockers}`;
        return `### [${d.date}] ${author.name} (${d.condition}${d.workplace ? ' · ' + dailyWorkplaceLabel(d) : ''})\n- 오전: ${(d.morning || '-').replace(/\n/g, ' ')}\n- 오후: ${(d.afternoon || '-').replace(/\n/g, ' ')}\n- 내일: ${(d.tomorrow || '-').replace(/\n/g, ' ')}\n- 블로커: ${d.blockers}`;
      }).join('\n\n');
      copyTextToClipboard(plainText(md) || '등록된 일간보고가 없습니다.', '일간보고 요약이 클립보드에 복사되었습니다.');
    }

    // =========================================================================
    // 12. GLOBAL SEARCH & TOASTS
    // =========================================================================
    function handleGlobalSearch(query) {
      const q = query.trim().toLowerCase();
      const panel = document.getElementById('global-search-panel');
      const resultsEl = document.getElementById('global-search-results');
      const summaryEl = document.getElementById('global-search-summary');

      if (!q) {
        panel.classList.add('hidden');
        return;
      }

      const hits = [];
      state.projects.forEach(p => {
        if (p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q)) {
          hits.push({ type: '프로젝트', title: p.title, action: `setActiveTab('projects'); openProjectModal('${p.id}')` });
        }
      });
      state.members.forEach(m => {
        if (m.name.toLowerCase().includes(q) || m.role.toLowerCase().includes(q) || m.part.toLowerCase().includes(q)) {
          hits.push({ type: '인원', title: `${m.name} (${m.role})`, action: `setActiveTab('members'); openMemberModal('${m.id}')` });
        }
      });
      state.knowledgePool.forEach(k => {
        if (k.title.toLowerCase().includes(q) || k.content.toLowerCase().includes(q) || (k.tags || []).some(t => t.toLowerCase().includes(q))) {
          hits.push({ type: '업무 Pool', title: k.title, action: `setActiveTab('pool'); openPoolDetailModal('${k.id}')` });
        }
      });
      state.parts.forEach(pt => {
        if ([pt.name, pt.maker, pt.serial, pt.vendor, pt.note].join(' ').toLowerCase().includes(q)) {
          hits.push({ type: 'Parts', title: `${pt.name}${pt.serial ? ' · ' + pt.serial : ''}`, action: `setActiveTab('parts'); openPartModal('${pt.id}')` });
        }
      });
      state.meetings.forEach(mt => {
        if ([mt.title, mt.agenda, mt.notes, mt.decisions, ...mt.actions.map(a => a.text)].join(' ').toLowerCase().includes(q)) {
          hits.push({ type: '회의록', title: `${mt.date} · ${mt.title}`, action: `setActiveTab('meetings'); openMeetingModal('${mt.id}')` });
        }
      });
      state.issues.forEach(i => {
        if ([i.title, i.content, i.equipment, i.cause, i.action].join(' ').toLowerCase().includes(q)) {
          hits.push({ type: '이슈', title: `[${issueSiteName(i.siteId)}] ${i.title}`, action: `setActiveTab('issues'); openIssueModal('${i.id}')` });
        }
      });
      state.notices.forEach(n => {
        if (n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q)) {
          hits.push({ type: '공지·News', title: n.title, action: `setActiveTab('notices'); openNoticeModal('${n.id}')` });
        }
      });
      state.schedules.forEach(s => {
        if (s.title.toLowerCase().includes(q) || s.description.toLowerCase().includes(q)) {
          hits.push({ type: '일정', title: `${s.date} · ${s.title}`, action: `setActiveTab('schedule'); selectCalendarDate('${s.date}')` });
        }
      });

      panel.classList.remove('hidden');
      summaryEl.textContent = `"${query}" 검색 결과 (${hits.length}건)`;
      resultsEl.innerHTML = hits.length ? hits.slice(0, 9).map(h => `
        <button type="button" onclick="${h.action}" class="text-left p-2.5 rounded-xl bg-white border border-indigo-100 hover:border-indigo-300 transition flex items-center justify-between gap-2">
          <span class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(h.title)}</span>
          <span class="px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 text-[10px] font-bold shrink-0">${h.type}</span>
        </button>
      `).join('') : '<p class="text-xs text-indigo-700 col-span-full">일치하는 항목이 없습니다.</p>';
    }

    function clearGlobalSearch() {
      document.getElementById('global-search').value = '';
      document.getElementById('global-search-panel').classList.add('hidden');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const colors = {
        success: 'bg-slate-900 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-700',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg border-l-4 text-xs font-medium transition transform translate-y-0 ${colors[type] || colors.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('opacity-0');
        setTimeout(() => el.remove(), 250);
      }, type === 'error' ? 5000 : 2800);
    }

    // Close modal on backdrop click
    // - 글 선택 중 마우스를 바깥에서 떼는 경우는 닫지 않음 (누른 곳과 뗀 곳이 모두 바깥일 때만)
    // - 입력 칸이 있는 창(작성·수정 창)은 바깥 클릭으로 닫지 않음 (X 또는 취소로만 닫힘)
    let modalPressOnBackdrop = false;
    document.getElementById('modal-root').addEventListener('mousedown', function(e) {
      modalPressOnBackdrop = e.target === this;
    });
    document.getElementById('modal-body').addEventListener('input', () => { modalDirty = true; });
    document.getElementById('modal-body').addEventListener('change', () => { modalDirty = true; });
    document.getElementById('modal-root').addEventListener('click', function(e) {
      const pressed = modalPressOnBackdrop;
      modalPressOnBackdrop = false;
      if (e.target !== this || !pressed) return;
      if (modalDirty || document.querySelector('#modal-body input:not([type=hidden]), #modal-body textarea, #modal-body select')) {
        const box = document.getElementById('modal-box');
        if (box.animate) box.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 220 });
        document.getElementById('modal-hint').classList.remove('hidden');
        return;
      }
      closeModal();
    });

    // Boot
    window.addEventListener('DOMContentLoaded', () => {
      if (authOn() && !auth.session) {
        // 로그인 전에는 데이터를 그리지 않음
        try { localStorage.removeItem(DATA_STORAGE_KEY); } catch (e) {}
        updateBadge();
        showLoginScreen();
        lucide.createIcons();
        return;
      }
      renderAll();
      updateBadge();
      syncFromApi(true);
    });
  </script>
</body>
</html>
