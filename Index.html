      },
      parts: t => {
        const pick = (v, list, fb) => (list.includes(str(v)) ? str(v) : fb);
        return {
          id: t.id, name: str(t.name).slice(0, 100), category: pick(t.category, PART_CATEGORIES, '기타'), maker: str(t.maker).slice(0, 100), serial: str(t.serial).slice(0, 80),
          qty: clampNum(t.qty, 1, 9999, 1), location: str(t.location).slice(0, 80), ownership: pick(t.ownership, PART_OWNERSHIP, '보유'),
          vendor: str(t.vendor).slice(0, 80), rentStart: dateOr(t.rentStart), rentEnd: dateOr(t.rentEnd), returnedAt: dateOr(t.returnedAt),
          status: pick(t.status, PART_STATUSES, '보관 중'), siteId: idOr(t.siteId), holderId: idOr(t.holderId), outDate: dateOr(t.outDate), backDate: dateOr(t.backDate),
          note: str(t.note), authorId: idOr(t.authorId), createdAt: dateOr(t.createdAt), updatedAt: dateOr(t.updatedAt),
          logs: (Array.isArray(t.logs) ? t.logs : []).filter(l => l && typeof l === 'object' && ID_RE.test(str(l.id))).slice(-300)
            .map(l => ({ id: str(l.id), at: str(l.at).slice(0, 30), authorId: idOr(l.authorId), type: 'status', text: str(l.text).slice(0, 1000) }))
        };
      },
      meetings: t => ({
        id: t.id, title: str(t.title).slice(0, 150), date: dateOr(t.date), time: str(t.time).slice(0, 20),
        type: MEETING_TYPES.includes(str(t.type)) ? str(t.type) : '기타', siteId: idOr(t.siteId), attendeeIds: idList(t.attendeeIds),
        externalAttendees: str(t.externalAttendees).slice(0, 200), agenda: str(t.agenda), notes: str(t.notes), decisions: str(t.decisions),
        actions: (Array.isArray(t.actions) ? t.actions : []).filter(a => a && typeof a === 'object' && ID_RE.test(str(a.id))).slice(0, 100)
          .map(a => ({ id: str(a.id), text: str(a.text).slice(0, 300), assigneeId: idOr(a.assigneeId), dueDate: dateOr(a.dueDate), done: a.done === true, issueId: idOr(a.issueId) })),
        attachments: attachList(t.attachments), authorId: idOr(t.authorId), createdAt: dateOr(t.createdAt), updatedAt: dateOr(t.updatedAt)
      }),
      tripSites: t => ({
        id: t.id, name: str(t.name).trim().slice(0, 40) || '이름 없음',
        color: Object.prototype.hasOwnProperty.call(TRIP_COLORS, str(t.color)) ? str(t.color) : 'gray', order: clampNum(t.order, 0, 9999, 0),
        timeZone: TIME_ZONES.some(z => z.tz && z.tz === str(t.timeZone)) ? str(t.timeZone) : ''
      }),
      tripPlans: t => {
        const start = dateOr(t.start), end = dateOr(t.end, start);
        return {
          id: t.id, memberId: idOr(t.memberId), person: str(t.person).trim().slice(0, 30), siteId: idOr(t.siteId),
          start, end: end && start && end < start ? start : end, note: str(t.note).slice(0, 300)
        };
      },
      tripStaffing: t => {
        const rows = {};
        TRIP_STAFF_ROWS.forEach(r => {
          const src = t.rows && Array.isArray(t.rows[r.key]) ? t.rows[r.key] : [];
          rows[r.key] = MONTHS.map((mo, i) => (src[i] === null || src[i] === undefined || src[i] === '' || !Number.isFinite(Number(src[i])) ? null : clampNum(src[i], 0, 9999, 0)));
        });
        return { id: t.id, year: clampNum(t.year, 2000, 2100, 0), rows };
      }
    };

    function sanitizeData(raw) {
      const src = raw && typeof raw === 'object' ? raw : {};
      const out = { teamName: str(src.teamName) };
      COLLECTIONS.forEach(c => {
        const list = Array.isArray(src[c]) ? src[c] : [];
        out[c] = list
          .filter(item => item && typeof item === 'object' && ID_RE.test(str(item.id)))
          .map(item => ITEM_SANITIZERS[c]({ ...item, id: str(item.id) }));
      });
      return out;
    }

    function pickData(s) {
      const d = {};
      DATA_KEYS.forEach(k => { d[k] = s[k]; });
      return d;
    }

    function loadInitialState() {
      const s = { ...DEFAULT_UI, ...sessionDefaults() };
      try {
        const ui = JSON.parse(localStorage.getItem(UI_STORAGE_KEY) || 'null');
        if (ui && typeof ui === 'object') {
          UI_PERSIST_KEYS.forEach(k => { if (typeof ui[k] === 'string') s[k] = ui[k]; });
        }
      } catch (e) {}

      let data = null;
      try { data = JSON.parse(localStorage.getItem(DATA_STORAGE_KEY) || 'null'); } catch (e) {}
      if (!data) {
        // 예전 버전(v1)이 브라우저에 남긴 데이터가 있으면 이어서 사용
        try {
          const legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY) || 'null');
          if (legacy && Array.isArray(legacy.projects)) data = legacy;
        } catch (e) {}
      }
      Object.assign(s, sanitizeData(data && Array.isArray(data.projects) ? data : clone(SAMPLE_DATA)));
      return s;
    }

    function saveLocalData() {
      try { localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(pickData(state))); } catch (e) {}
    }

    function saveUi() {
      try {
        const ui = {};
        UI_PERSIST_KEYS.forEach(k => { ui[k] = state[k]; });
        localStorage.setItem(UI_STORAGE_KEY, JSON.stringify(ui));
      } catch (e) {}
    }

    function clone(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function uid(prefix) {
      return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ---- 간단 서식: **굵게**  !!빨강!!  ==형광펜==  (한 줄 안에서만)
    const RICH_RULES = [
      [/\*\*([^\n]+?)\*\*/g, '<strong class="font-bold text-slate-900">$1</strong>'],
      [/!!([^\n]+?)!!/g, '<span class="font-semibold text-rose-600">$1</span>'],
      [/==([^\n]+?)==/g, '<mark class="bg-yellow-200 text-inherit rounded-sm px-0.5">$1</mark>']
    ];
    function richText(str) {
      let h = escapeHtml(str);
      RICH_RULES.forEach(([re, rep]) => { h = h.replace(re, rep); });
      return h;
    }
    function plainText(str) { // 엑셀·복사용: 서식 기호 빼기
      return String(str == null ? '' : str).replace(/\*\*([^\n]+?)\*\*/g, '$1').replace(/!!([^\n]+?)!!/g, '$1').replace(/==([^\n]+?)==/g, '$1');
    }

    function getMember(id) {
      return state.members.find(m => m.id === id) || { id: '', name: '미배정', initials: '?', color: 'bg-slate-400', role: '' };
    }

    function getProject(id) {
      return state.projects.find(p => p.id === id) || null;
    }

    readUrlConfig();
    let state = loadInitialState();
    let chartInstances = {};

    // =========================================================================
    // 1-1. SERVER SYNC (변경 1건씩 서버로 보내고, 서버가 최신 데이터에 합침)
    // =========================================================================
    const sync = {
      ready: !getApiEndpoint(), // 서버 연결 시 첫 데이터를 받기 전에는 편집 잠금
      loading: false,
      inflight: false,
      failed: false,
      pending: [],
      version: -1,
      lastSyncAt: 0
    };

    function apiUrlWithSession(api) {
      return api + (api.includes('?') ? '&' : '?') + 'session=' + encodeURIComponent(auth.session || '');
    }

    function applyOpLocal(target, op) {
      if (op.op === 'replaceAll') {
        const next = sanitizeData(op.data);
        DATA_KEYS.forEach(k => { target[k] = next[k]; });
        return;
      }
      const list = target[op.collection];
      if (!Array.isArray(list)) return;
      if (op.op === 'upsert') {
        const idx = list.findIndex(x => x.id === op.item.id);
        if (idx !== -1) list[idx] = clone(op.item);
        else if (op.position === 'end') list.push(clone(op.item));
        else list.unshift(clone(op.item));
      } else if (op.op === 'delete') {
        target[op.collection] = list.filter(x => x.id !== op.id);
      }
    }

    // 서버 데이터로 교체 + 아직 못 보낸 내 변경을 그 위에 다시 적용. 바뀐 게 있으면 true
    function applyServerData(data, version) {
      const before = JSON.stringify(pickData(state));
      sync.version = version;
      const clean = sanitizeData(data);
      DATA_KEYS.forEach(k => { state[k] = clean[k]; });
      sync.pending.forEach(op => applyOpLocal(state, op));
      saveLocalData();
      return JSON.stringify(pickData(state)) !== before;
    }

    function updateBadge() {
      if (!getApiEndpoint()) return setSaveBadge('로컬 저장됨 (서버 미연결)', 'bg-slate-400');
      if (sync.inflight) return setSaveBadge('저장 중...', 'bg-amber-500');
      if (sync.failed && sync.pending.length) return setSaveBadge(`저장 대기 ${sync.pending.length}건`, 'bg-rose-500');
      if (!sync.ready) return setSaveBadge(sync.loading ? '불러오는 중...' : '연결 오류 · 편집 잠금', sync.loading ? 'bg-sky-500' : 'bg-rose-500');
      return setSaveBadge('Sheets 동기화됨', 'bg-emerald-500');
    }

    function canEdit() {
      if (sync.ready) return true;
      showToast(sync.loading
        ? '서버 데이터를 불러오는 중입니다. 잠시 후 다시 저장하세요.'
        : '저장할 수 없습니다: ' + (sync.lastError || '서버에 연결되지 않았습니다.') + ' (왼쪽 아래 새로고침 버튼으로 다시 연결)', 'error');
      return false;
    }

    /** 데이터 변경의 유일한 입구: 화면에 바로 반영하고 서버로 전송 */
    function commit(ops) {
      if (!canEdit()) return false;
      ops.forEach(op => applyOpLocal(state, op));
      saveLocalData();
      if (getApiEndpoint()) {
        sync.pending.push(...ops);
        flushPending();
      } else {
        updateBadge();
      }
      return true;
    }

    function flushPending() {
      const api = getApiEndpoint();
      if (!api || sync.inflight || !sync.pending.length) return;
      const batch = sync.pending.splice(0, sync.pending.length);
      sync.inflight = true;
      updateBadge();
      fetch(api, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ session: auth.session, ops: batch })
      })
        .then(r => r.json())
        .then(res => {
          if (!res || !res.ok) {
            const err = new Error((res && res.error) || '저장 실패');
            err.server = true;
            err.res = res;
            throw err;
          }
          sync.inflight = false;
          sync.failed = false;
          captureServerMeta(res);
          if (applyServerData(res.data, res.version)) renderAll();
        })
        .catch(err => {
          sync.inflight = false;
          if (err.res && handleAuthError(err.res)) return;
          const keep = !err.server || /busy/i.test(err.message);
          if (keep) {
            sync.pending.unshift(...batch);
            sync.failed = true;
            showToast('저장하지 못했습니다: ' + err.message + ' (새로고침 버튼으로 다시 시도)', 'error');
          } else {
            // 서버가 거부한 변경은 버리고 서버 데이터로 되돌림
            showToast('서버가 변경을 거부했습니다: ' + err.message, 'error');
            sync.failed = false;
            syncFromApi(true);
          }
        })
        .finally(() => {
          updateBadge();
          if (!sync.failed && sync.pending.length) flushPending();
        });
    }

    function syncFromApi(silent = false) {
      const api = getApiEndpoint();
      if (!api) {
        sync.ready = true;
        updateBadge();
        if (!silent) showToast('공유 설정에서 Apps Script API URL을 먼저 연결해 주세요.', 'info');
        return;
      }
      if (!auth.session) {
        sync.ready = false;
        updateBadge();
        showLoginScreen();
        return;
      }
      if (sync.inflight || sync.loading) return;
      sync.loading = true;
      updateBadge();
      fetch(apiUrlWithSession(api), { cache: 'no-store' })
        .then(r => r.json())
        .then(res => {
          if (res && !res.ok && handleAuthError(res)) return;
          if (!res || !res.ok) throw new Error((res && res.error) || '응답 오류');
          if (typeof res.version !== 'number') {
            // 예전 Code.gs는 받은 내용으로 전체를 덮어쓰므로 저장하면 팀 데이터가 지워짐 → 편집 잠금
            sync.ready = false;
            throw new Error('서버(Code.gs)가 예전 버전입니다. 관리자가 새 Code.gs를 배포해야 저장할 수 있습니다.');
          }
          if (sync.inflight) return; // 저장 응답이 곧 최신 데이터를 가져옴
          captureServerMeta(res);
          const firstLoad = !sync.ready;
          sync.ready = true;
          sync.lastError = '';
          if (res.data === null) {
            sync.version = res.version || 0;
            if (firstLoad && isAdmin()) askSeedEmptyServer();
            return;
          }
          const changed = applyServerData(res.data, res.version);
          if (changed || firstLoad) renderAll();
          if (sync.pending.length) {
            sync.failed = false;
            flushPending();
          }
          if (!silent) showToast('Google Sheets에서 최신 데이터를 불러왔습니다.', 'success');
        })
        .catch(err => {
          sync.lastError = err.message;
          if (!silent || !sync.ready) {
            showToast('서버에서 데이터를 불러오지 못했습니다: ' + err.message, 'error');
          }
        })
        .finally(() => {
          sync.loading = false;
          sync.lastSyncAt = Date.now();
          updateBadge();
        });
    }

    function askSeedEmptyServer() {
      askConfirm({
        title: '서버에 데이터가 없습니다',
        message: '연결한 Google Sheets에 저장된 데이터가 없습니다.\n지금 화면에 있는 데이터(샘플 포함)를 서버에 올릴까요?\n\n"빈 상태로 시작"을 누르면 데이터 없이 시작합니다.',
        confirmLabel: '현재 데이터 올리기',
        cancelLabel: '빈 상태로 시작',
        danger: false,
        onConfirm: () => {
          commit([{ op: 'replaceAll', data: pickData(state) }]);
          renderAll();
        },
        onCancel: () => {
          commit([{ op: 'replaceAll', data: sanitizeData({ teamName: state.teamName }) }]);
          renderAll();
        }
      });
    }

    // =========================================================================
    // 1-2. LOGIN (Google 계정) & 권한
    //    - 서버에 연결된 경우에만 로그인 필요 (서버 없이 쓰는 로컬 모드는 로그인 없음)
    //    - 실제 권한 검사는 서버(Code.gs)가 함. 화면은 버튼을 숨겨 헷갈리지 않게 할 뿐
    // =========================================================================
    const SESSION_STORAGE_KEY = 'teamhub_session_v1';
    const auth = { session: '', user: null, clientId: '', gisLoaded: false, joinRequests: [], pendingIdToken: '' };
    try {
      const saved = JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || 'null');
      if (saved && typeof saved.session === 'string') {
        auth.session = saved.session;
        auth.user = saved.user || null;
      }
    } catch (e) {}

    function authOn() { return !!getApiEndpoint(); }
    function isAdmin() { return !authOn() || !!(auth.user && auth.user.isAdmin); }
    function myMemberId() { return (auth.user && auth.user.memberId) || ''; }
    function canEditReport(r) { return isAdmin() || (!!r && !!myMemberId() && r.authorId === myMemberId()); }
    function canManageMembers() { return isAdmin(); }

    function saveSession() {
      try {
        if (auth.session) localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({ session: auth.session, user: auth.user }));
        else localStorage.removeItem(SESSION_STORAGE_KEY);
      } catch (e) {}
    }

    // 서버 응답에 들어 있는 내 정보와 (관리자라면) 가입 요청 목록 반영
    function captureServerMeta(res) {
      if (!res) return;
      setAuthUser(res.user);
      const next = Array.isArray(res.joinRequests) ? res.joinRequests : [];
      if (JSON.stringify(next) !== JSON.stringify(auth.joinRequests)) {
        auth.joinRequests = next;
        if (document.getElementById('sidebar-nav')) renderAll();
      }
    }

    function setAuthUser(user) {
      if (!user) return;
      const changed = JSON.stringify(user) !== JSON.stringify(auth.user);
      auth.user = user;
      saveSession();
      if (changed) renderUserChip();
    }

    // 서버가 "로그인 필요/팀원 아님"이라고 하면 세션을 지우고 로그인 화면으로
    function handleAuthError(res) {
      const code = res && res.code;
      if (code !== 'AUTH_REQUIRED' && code !== 'NOT_MEMBER') return false;
      auth.session = '';
      auth.user = null;
      saveSession();
      try { localStorage.removeItem(DATA_STORAGE_KEY); } catch (e) {}
      sync.pending = [];
      sync.ready = false;
      showLoginScreen(res.error);
      return true;
    }

    function setLoginMessage(text, tone = 'error') {
      const el = document.getElementById('login-message');
      if (!el) return;
      el.className = 'mt-5 text-xs leading-relaxed ' + (tone === 'error' ? 'text-rose-600' : 'text-slate-400');
      el.textContent = text || '';
      el.classList.toggle('hidden', !text);
    }

    function showLoginScreen(message) {
      const screen = document.getElementById('login-screen');
      screen.classList.remove('hidden');
      screen.classList.add('flex');
      setLoginMessage(message || '');
      renderEmbedHelp();
      prepareLoginButton();
    }

    // ---- Google Sites 안에 끼워 넣어 열렸을 때: 로그인 창·저장이 막힐 수 있어 '새 창에서 열기' 안내
    function isEmbedded() {
      try { return window.top !== window.self; } catch (e) { return true; }
    }
    function storageWorks() {
      try {
        localStorage.setItem('teamhub_probe', '1');
        const ok = localStorage.getItem('teamhub_probe') === '1';
        localStorage.removeItem('teamhub_probe');
        return ok;
      } catch (e) { return false; }
    }
    // 이 화면을 단독으로 여는 주소 (기본 서버가 아닌 주소를 쓰는 중이면 ?api= 로 같이 넘김)
    function standaloneUrl() {
      const base = window.location.origin + window.location.pathname;
      const api = getApiEndpoint();
      return api && api !== DEFAULT_API_ENDPOINT ? `${base}?api=${encodeURIComponent(api)}` : base;
    }
    function renderEmbedHelp(force) {
      const box = document.getElementById('login-embed-help');
      if (!box) return;
      if (!isEmbedded() && !force) { box.classList.add('hidden'); return; }
      const blocked = !storageWorks();
      box.classList.remove('hidden');
      box.innerHTML = `
        <div class="p-3 rounded-xl ${blocked ? 'bg-amber-50 border border-amber-200' : 'bg-slate-50 border border-slate-200'} text-left">
          <p class="text-[11px] leading-relaxed ${blocked ? 'text-amber-800' : 'text-slate-600'}">${blocked
            ? '<b>이 브라우저는 사이트 안에서 로그인 정보를 저장하지 못합니다.</b> 새 창에서 열어 로그인해 주세요.'
            : 'Google 로그인 창이 안 뜨거나, 로그인해도 이 화면으로 돌아오면 새 창에서 열어 주세요.'}</p>
          <a href="${escapeHtml(standaloneUrl())}" target="_blank" rel="noopener" class="mt-2 inline-flex w-full items-center justify-center gap-1.5 px-3 py-2 rounded-lg ${blocked ? 'bg-amber-500 hover:bg-amber-600 text-white' : 'bg-white border border-slate-300 hover:bg-slate-100 text-slate-700'} text-xs font-semibold">
            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>새 창에서 열기
          </a>
          <p class="text-[10px] text-slate-400 mt-1.5">새 창 주소를 즐겨찾기하거나, 휴대폰에서는 홈 화면에 추가해 두면 편합니다.</p>
        </div>`;
      if (window.lucide) lucide.createIcons();
    }
    function renderEmbedHeaderButton() {
      const btn = document.getElementById('open-standalone-btn');
      if (!btn) return;
      btn.classList.toggle('hidden', !isEmbedded());
      btn.href = standaloneUrl();
    }

    function hideLoginScreen() {
      const screen = document.getElementById('login-screen');
      screen.classList.add('hidden');
      screen.classList.remove('flex');
    }

    // 서버에서 Google 클라이언트 ID를 받아 로그인 버튼 준비
    function prepareLoginButton() {
      const box = document.getElementById('login-button');
      box.innerHTML = '<p class="text-xs text-slate-400">로그인 준비 중...</p>';
      fetch(getApiEndpoint() + (getApiEndpoint().includes('?') ? '&' : '?') + 'action=config', { cache: 'no-store' })
        .then(r => r.json())
        .then(res => {
          if (!res || !res.ok) throw new Error((res && res.error) || '서버 응답 오류');
          if (typeof res.clientId !== 'string') throw new Error('서버(Code.gs)가 예전 버전입니다. 관리자가 새 Code.gs를 배포해야 합니다.');
          if (!res.clientId) throw new Error('로그인 설정이 안 되어 있습니다. 관리자가 Apps Script에 GOOGLE_CLIENT_ID를 설정해야 합니다.');
          auth.clientId = res.clientId;
          // 로컬 목 서버 전용: 수정 단계에서는 로그인 화면 없이 바로 들어감 (실제 서버는 이 값을 보내지 않음)
          if (/^mock-/.test(res.clientId) && res.devAutoLogin) return loginWithIdToken('mock:' + res.devAutoLogin);
          if (/^mock-/.test(res.clientId)) renderMockLogin(box);
          else renderGoogleButton(box);
        })
        .catch(err => {
          box.innerHTML = '<button type="button" onclick="prepareLoginButton()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-50">다시 시도</button>';
          setLoginMessage('서버에 연결하지 못했습니다: ' + err.message);
        });
    }

    function renderGoogleButton(box) {
      const draw = () => {
        box.innerHTML = '';
        google.accounts.id.initialize({ client_id: auth.clientId, callback: r => loginWithIdToken(r.credential), auto_select: false, ux_mode: 'popup' });
        google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', locale: 'ko', width: 260 });
      };
      if (window.google && google.accounts && google.accounts.id) return draw();
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = draw;
      s.onerror = () => { setLoginMessage('Google 로그인 스크립트를 불러오지 못했습니다. 네트워크를 확인하거나 새 창에서 열어 주세요.'); renderEmbedHelp(true); };
      document.head.appendChild(s);
    }

    // 로컬 테스트 서버 전용: 이메일만 입력하는 가짜 로그인 (실제 Google 서버에서는 통과 못 함)
    function renderMockLogin(box) {
      box.innerHTML = `
        <form onsubmit="event.preventDefault(); loginWithIdToken('mock:' + this.email.value.trim())" class="space-y-2">
          <p class="text-[11px] font-semibold text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-2 py-1">로컬 테스트 서버 — 가짜 로그인</p>
          <input name="email" type="email" required placeholder="테스트 이메일" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          <button type="submit" class="w-full px-4 py-2 rounded-full border border-slate-300 bg-white text-sm font-medium text-slate-700 hover:bg-slate-50">테스트 계정으로 로그인</button>
        </form>`;
    }

    function postAuth(body) {
      return fetch(getApiEndpoint(), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      }).then(r => r.json());
    }

    function loginWithIdToken(idToken) {
      setLoginMessage('로그인 확인 중...', 'info');
      auth.pendingIdToken = idToken;
      postAuth({ action: 'login', idToken })
        .then(res => {
          if (res && (res.code === 'NEEDS_SIGNUP' || res.code === 'JOIN_PENDING')) return renderJoinPicker(res);
          if (!res || !res.ok) throw new Error((res && res.error) || '로그인 실패');
          auth.pendingIdToken = '';
          document.getElementById('login-join').classList.add('hidden');
          auth.session = res.session;
          auth.user = res.user;
          auth.joinRequests = Array.isArray(res.joinRequests) ? res.joinRequests : [];
          saveSession();
          sync.ready = true;
          sync.lastError = '';
          sync.lastSyncAt = Date.now();
          if (res.data) applyServerData(res.data, res.version);
          else sync.version = res.version || 0;
          hideLoginScreen();
          renderAll();
          updateBadge();
          showToast(`${res.user.name}님, 환영합니다.`, 'success');
        })
        .catch(err => setLoginMessage(err.message));
    }

    // 처음 온 사람: 본인 이름 고르기 / 승인 대기 안내
    function renderJoinPicker(res) {
      const box = document.getElementById('login-join');
      const pending = res.code === 'JOIN_PENDING';
      const members = (Array.isArray(res.members) ? res.members : []).slice().sort(compareMembers); // 직급순 → 이름순
      setLoginMessage('');
      box.classList.remove('hidden');
      box.innerHTML = `
        <div class="p-3 rounded-xl ${pending ? 'bg-amber-50 border border-amber-200' : 'bg-indigo-50 border border-indigo-200'}">
          <p class="text-xs font-bold ${pending ? 'text-amber-800' : 'text-indigo-800'} flex items-center gap-1.5">
            <i data-lucide="${pending ? 'hourglass' : 'user-plus'}" class="w-3.5 h-3.5"></i>${pending ? '승인 대기 중' : '처음 오셨네요'}
          </p>
          <p class="text-[11px] text-slate-600 mt-1 break-all">${escapeHtml(res.email || '')}</p>
          <p class="text-xs text-slate-700 mt-1.5">${escapeHtml(res.error || '')}</p>
        </div>
        ${members.length ? `
          <p class="text-[11px] font-semibold text-slate-500 mt-3 mb-1.5">${pending ? '다른 이름으로 다시 요청하려면 고르세요' : '본인 이름을 고르세요'}</p>
          <div class="grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto scrollbar-thin">
            ${members.map(m => `
              <button type="button" onclick="requestJoin('${escapeHtml(m.id)}')" class="px-2.5 py-2 rounded-lg border text-left text-xs transition ${res.pendingMemberId === m.id ? 'border-amber-400 bg-amber-50 font-bold text-amber-900' : 'border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 text-slate-700'}">
                ${escapeHtml(m.name)} <span class="text-slate-400">${escapeHtml(m.role)}</span>
              </button>`).join('')}
          </div>
          <p class="text-[11px] text-slate-400 mt-2">목록에 이름이 없으면 관리자에게 팀원 추가를 요청하세요.</p>
        ` : '<p class="text-[11px] text-slate-500 mt-3">고를 수 있는 팀원이 없습니다. 관리자에게 팀원 추가를 요청하세요.</p>'}
        ${pending ? '<button type="button" onclick="loginWithIdToken(auth.pendingIdToken)" class="mt-3 w-full px-3 py-2 rounded-lg bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800">승인됐는지 다시 확인</button>' : ''}`;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function requestJoin(memberId) {
      if (!auth.pendingIdToken) return setLoginMessage('다시 Google 로그인을 눌러 주세요.');
      setLoginMessage('가입 요청 보내는 중...', 'info');
      postAuth({ action: 'requestJoin', idToken: auth.pendingIdToken, memberId })
        .then(res => {
          if (res && (res.code === 'NEEDS_SIGNUP' || res.code === 'JOIN_PENDING')) return renderJoinPicker(res);
          if (res && res.ok && res.session) return loginWithIdToken(auth.pendingIdToken);
          throw new Error((res && res.error) || '요청 실패');
        })
        .catch(err => setLoginMessage(/expired|만료|AUTH_FAILED|확인에 실패/.test(err.message) ? 'Google 로그인이 만료되었습니다. Google 로그인을 다시 눌러 주세요.' : err.message));
    }

    // 관리자: 가입 요청 승인/거절
    function handleJoinRequest(email, approve) {
      const req = auth.joinRequests.find(r => r.email === email);
      if (!req) return;
      const go = () => postAuth({ action: 'approveJoin', session: auth.session, email, approve })
        .then(res => {
          if (res && !res.ok && handleAuthError(res)) return;
          if (!res || !res.ok) throw new Error((res && res.error) || '처리 실패');
          if (res.data) applyServerData(res.data, res.version);
          auth.joinRequests = Array.isArray(res.joinRequests) ? res.joinRequests : [];
          renderAll();
          showToast(approve ? `${req.memberName}님 가입을 승인했습니다. 이제 로그인할 수 있습니다.` : '가입 요청을 거절했습니다.', approve ? 'success' : 'info');
        })
        .catch(err => showToast(err.message, 'error'));
      if (approve) return go();
      askConfirm({
        title: '가입 요청 거절',
        message: `${req.email}\n"${req.memberName}"(으)로 보낸 가입 요청을 거절할까요?\n거절해도 다시 요청할 수 있습니다.`,
        confirmLabel: '거절',
        onConfirm: go
      });
    }

    function renderJoinRequestsPanel() {
      if (!authOn() || !isAdmin() || !auth.joinRequests.length) return '';
      return `
        <div class="bg-amber-50 rounded-2xl border border-amber-200 p-4 shadow-sm">
          <h3 class="text-sm font-bold text-amber-900 flex items-center gap-1.5 mb-3"><i data-lucide="user-plus" class="w-4 h-4"></i>가입 요청 ${auth.joinRequests.length}건 <span class="text-xs font-medium text-amber-700">· 본인이 맞는지 확인 후 승인하세요</span></h3>
          <div class="space-y-2">
            ${auth.joinRequests.map(r => `
              <div class="flex flex-wrap items-center gap-3 p-3 rounded-xl bg-white border border-amber-100">
                <div class="min-w-0">
                  <p class="text-sm font-semibold text-slate-900">${escapeHtml(r.memberName)} <span class="text-xs font-normal text-slate-400">← 이 팀원으로 요청</span></p>
                  <p class="text-xs text-slate-500 break-all">${escapeHtml(r.email)} · ${escapeHtml(String(r.requestedAt || '').slice(0, 10))}</p>
                </div>
                <div class="ml-auto flex gap-2 shrink-0">
                  <button type="button" onclick="handleJoinRequest('${escapeHtml(r.email)}', false)" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50">거절</button>
                  <button type="button" onclick="handleJoinRequest('${escapeHtml(r.email)}', true)" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">승인</button>
                </div>
              </div>`).join('')}
          </div>
        </div>`;
    }

    function logout() {
      const session = auth.session;
      auth.session = '';
      auth.user = null;
      saveSession();
      try { localStorage.removeItem(DATA_STORAGE_KEY); } catch (e) {}
      const done = () => window.location.reload();
      if (!session || !getApiEndpoint()) return done();
      fetch(getApiEndpoint(), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'logout', session })
      }).catch(() => {}).finally(done);
    }

    // 오른쪽 위 내 이름 + 메뉴
    function renderUserChip() {
      const box = document.getElementById('user-chip');
      if (!box) return;
      if (!authOn() || !auth.user) {
        box.innerHTML = '';
        box.classList.add('hidden');
        return;
      }
      const me = state.members.find(m => m.id === auth.user.memberId);
      const color = me ? me.color : 'bg-slate-500';
      const initials = me ? me.initials : (auth.user.email[0] || '?').toUpperCase();
      box.classList.remove('hidden');
      box.innerHTML = `
        <button type="button" onclick="toggleUserMenu(event)" class="flex items-center gap-2 pl-2 pr-1.5 py-1 rounded-xl hover:bg-slate-100 transition" title="${escapeHtml(auth.user.email)}">
          <span class="w-8 h-8 rounded-full ${color} text-white text-[11px] font-bold flex items-center justify-center shrink-0 ${auth.user.isAdmin ? 'ring-2 ring-indigo-500 ring-offset-2' : ''}">${escapeHtml(initials)}</span>
          <span class="hidden 2xl:block text-left leading-tight">
            <span class="flex items-center gap-1 text-sm font-semibold text-slate-900 whitespace-nowrap">${escapeHtml(auth.user.name)}${auth.user.isAdmin ? '<span class="px-1.5 py-0.5 rounded bg-indigo-600 text-white text-[10px] font-bold">관리자</span>' : ''}</span>
          </span>
          <i data-lucide="chevron-down" class="hidden 2xl:block w-4 h-4 text-slate-400"></i>
        </button>
        <div id="user-menu" class="hidden absolute right-0 top-full mt-2 w-64 bg-white rounded-xl border border-slate-200 shadow-lg p-1.5 z-30">
          <div class="px-3 py-2 border-b border-slate-100 mb-1">
            <p class="flex items-center gap-1.5 text-sm font-semibold text-slate-900">${escapeHtml(auth.user.name)}${me && me.role ? ' ' + escapeHtml(me.role) : ''}${auth.user.isAdmin ? '<span class="px-1.5 py-0.5 rounded bg-indigo-600 text-white text-[10px] font-bold">관리자</span>' : ''}</p>
            <p class="text-[11px] text-slate-400 truncate">${escapeHtml(auth.user.email)}</p>
          </div>
          ${me ? `<button type="button" onclick="openMyStatusModal()" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100"><i data-lucide="user-round-pen" class="w-4 h-4 text-indigo-600"></i>내 상태 바꾸기 <span class="ml-auto">${renderMemberStatusBadge(me.status)}</span></button>` : `<p class="px-3 py-2 text-[11px] text-amber-700">인원 관리에서 내 팀원 정보에 이 계정을 등록하면 보고서를 쓸 수 있습니다.</p>`}
          <a href="manual.html" target="_blank" rel="noopener" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100"><i data-lucide="book-marked" class="w-4 h-4 text-slate-400"></i>사용 매뉴얼</a>
          <button type="button" onclick="logout()" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-100"><i data-lucide="log-out" class="w-4 h-4 text-slate-400"></i>로그아웃</button>
        </div>`;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function toggleUserMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('user-menu');
      if (menu) menu.classList.toggle('hidden');
    }
    document.addEventListener('click', e => {
      const menu = document.getElementById('user-menu');
      if (menu && !menu.classList.contains('hidden') && !e.target.closest('#user-menu')) menu.classList.add('hidden');
    });

    // 본인 상태·출장 정보만 바꾸는 창 (일반 팀원용)
    function openMyStatusModal() {
      const me = state.members.find(m => m.id === myMemberId());
      if (!me) return;
      const menu = document.getElementById('user-menu');
      if (menu) menu.classList.add('hidden');
      openModal('내 상태 바꾸기', `
        <form onsubmit="saveMyStatus(event)" class="space-y-4">
          <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-100">
            <span class="w-9 h-9 rounded-xl ${me.color} text-white text-xs font-bold flex items-center justify-center">${escapeHtml(me.initials)}</span>
            <div><p class="text-sm font-bold text-slate-900">${escapeHtml(me.name)} ${escapeHtml(me.role)}</p><p class="text-[11px] text-slate-400">상태와 출장·외근 정보만 바꿀 수 있습니다</p></div>
          </div>
          ${renderStatusFields(me)}
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">취소</button>
            <button type="submit" class="px-4 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">저장</button>
          </div>
        </form>
      `);
    }

    function readStatusFields(fd, target) {
      target.status = fd.get('status');
      const absent = ABSENCE_STATUSES.includes(target.status);
      target.tripPlace = absent ? (fd.get('tripPlace') || '').trim() : '';
      target.tripStart = absent ? (DATE_RE.test(fd.get('tripStart') || '') ? fd.get('tripStart') : TODAY) : '';
      target.tripReturn = absent && DATE_RE.test(fd.get('tripReturn') || '') ? fd.get('tripReturn') : '';
      target.tripReturnTime = absent && TIME_RE.test(fd.get('tripReturnTime') || '') ? fd.get('tripReturnTime') : '';
      if (target.tripReturn && target.tripReturn < target.tripStart) target.tripReturn = target.tripStart;
      return target;
    }

    // 출장·외근·휴가 상태를 일정에 자동 반영 (일정 ops를 돌려주고 next.awayScheduleId를 채움)
    //  - 같은 종류의 부재를 고치면 같은 일정을 수정
    //  - 업무중 등으로 돌아오면: 아직 시작 전이면 일정 삭제, 진행 중이면 오늘까지로 줄임
    //  - 다른 부재로 바뀌면: 이전 일정은 어제까지로 줄이고 새 일정을 만듦
    function absenceScheduleOps(prev, next) {
      const ops = [];
      const prevSch = prev && prev.awayScheduleId ? state.schedules.find(x => x.id === prev.awayScheduleId) : null;
      const absentNow = ABSENCE_STATUSES.includes(next.status);
      const sameAbsence = absentNow && prevSch && prev.status === next.status;

      if (prevSch && !sameAbsence) {
        const endTo = absentNow ? addDays(TODAY, -1) : TODAY;
        if (endTo < prevSch.date) {
          ops.push({ op: 'delete', collection: 'schedules', id: prevSch.id });
        } else if (scheduleEnd(prevSch) > endTo) {
          ops.push({ op: 'upsert', collection: 'schedules', item: { ...prevSch, endDate: endTo > prevSch.date ? endTo : '' }, position: 'end' });
        }
      }

      if (absentNow) {
        const id = sameAbsence ? prevSch.id : uid('s');
        const place = next.tripPlace || '';
        ops.push({
          op: 'upsert', collection: 'schedules', position: 'end',
          item: {
            id,
            title: `${next.name} ${statusShort(next.status)}${place ? ' · ' + place : ''}`,
            date: next.tripStart || TODAY,
            endDate: next.tripReturn && next.tripReturn > (next.tripStart || TODAY) ? next.tripReturn : '',
            time: '종일',
            category: next.status === '휴가' ? '휴가/부재' : '출장/외근',
            attendeeIds: [next.id],
            description: `팀원 상태에서 자동 등록${next.tripReturnTime ? ` · 복귀 ${next.tripReturnTime}` : ''}`,
            auto: 'absence'
          }
        });
        next.awayScheduleId = id;
      } else {
        next.awayScheduleId = '';
      }
      return ops;
    }

    // 팀원 저장 + 부재 일정 자동 반영을 한 번에 서버로 보냄
    function saveMemberWithSchedule(prev, data, message) {
      const scheduleOps = absenceScheduleOps(prev, data);
      if (!commit([{ op: 'upsert', collection: 'members', item: data, position: 'end' }, ...scheduleOps])) return false;
      closeModal();
      renderAll();
      const added = scheduleOps.some(o => o.op === 'upsert' && o.item.auto === 'absence' && o.item.id === data.awayScheduleId);
      showToast(added ? message + ' 일정에도 자동으로 반영했습니다.' : message, 'success');
      return true;
    }

    function saveMyStatus(e) {
      e.preventDefault();
      const me = state.members.find(m => m.id === myMemberId());
      if (!me) return;
      const data = readStatusFields(new FormData(e.target), clone(me));
      if (saveMemberWithSchedule(me, data, '내 상태가 저장되었습니다.')) renderUserChip();
    }

    // 상태 + 출장·외근 입력칸 (관리자 팀원 수정 창과 내 상태 창이 같이 씀)
    function renderStatusFields(item) {
      return `
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">현재 상태</label>
          <select name="status" onchange="document.getElementById('trip-fields').classList.toggle('hidden', !ABSENCE_STATUSES.includes(this.value))" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
            ${MEMBER_STATUSES.map(s => `<option value="${s}" ${item && item.status === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <div id="trip-fields" class="${item && ABSENCE_STATUSES.includes(item.status) ? '' : 'hidden'} p-3 rounded-xl bg-purple-50/60 border border-purple-100 space-y-3">
          <p class="text-xs font-bold text-purple-800 flex items-center gap-1.5"><i data-lucide="plane" class="w-3.5 h-3.5"></i>출장·외근·휴가 정보 <span class="font-medium text-purple-600/70">(팀 현황과 일정에 자동 표시)</span></p>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">행선지 · 용무 (휴가는 비워도 됨)</label>
            <input name="tripPlace" value="${item ? escapeHtml(item.tripPlace || '') : ''}" placeholder="예: 오하이오 고객사 현장 셋업" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white" />
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">시작일</label>
              <input type="date" name="tripStart" value="${item && item.tripStart ? escapeHtml(item.tripStart) : TODAY}" class="w-full border border-slate-200 rounded-lg px-2 py-2 text-sm bg-white" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">복귀 예정일</label>
              <input type="date" name="tripReturn" value="${item ? escapeHtml(item.tripReturn || '') : ''}" class="w-full border border-slate-200 rounded-lg px-2 py-2 text-sm bg-white" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">복귀 시간 (선택)</label>
              <input type="time" name="tripReturnTime" value="${item ? escapeHtml(item.tripReturnTime || '') : ''}" class="w-full border border-slate-200 rounded-lg px-2 py-2 text-sm bg-white" />
            </div>
          </div>
        </div>`;
    }

    // 작성자 칸: 관리자는 선택, 일반 팀원은 본인으로 고정
    // reportsOnly: 일간·주간보고 작성자 목록에서는 '보고 제외' 팀원을 뺌 (이미 그 사람이 쓴 보고를 고칠 때만 남김)
    // 실무 팀원: '최상위 관리자'(프로젝트·출장·보고·상태와 무관한 임원)를 뺀 목록
    // keep: 이미 그 사람이 지정된 항목을 고칠 때는 목록에 남김
    function workMembers(keep = []) {
      const k = Array.isArray(keep) ? keep : [keep];
      return state.members.filter(m => !m.executive || k.includes(m.id));
    }
    function reportAuthorOptions(keepId) {
      return state.members.filter(m => !m.reportExempt || m.id === keepId);
    }
    function renderAuthorField(item, reportsOnly = false) {
      if (isAdmin()) {
        const selected = item ? item.authorId : myMemberId();
        const people = reportsOnly ? reportAuthorOptions(item ? item.authorId : '') : state.members;
        return `
          <label class="block text-xs font-semibold text-slate-600 mb-1">작성자</label>
          <select name="authorId" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
            ${people.map(m => `<option value="${m.id}" ${selected === m.id ? 'selected' : ''}>${escapeHtml(m.name)}</option>`).join('')}
          </select>`;
      }
      const me = getMember(myMemberId());
      return `
        <label class="block text-xs font-semibold text-slate-600 mb-1">작성자</label>
        <input type="hidden" name="authorId" value="${escapeHtml(myMemberId())}" />
        <div class="flex items-center gap-1.5 w-full rounded-lg px-3 py-2 text-sm bg-slate-100 text-slate-700" title="로그인한 본인으로 고정"><i data-lucide="lock" class="w-3.5 h-3.5 text-slate-400"></i>${escapeHtml(me.name)}</div>`;
    }

    function readOnlyNote() {
      return '<span class="inline-flex items-center gap-1 text-[11px] text-slate-400" title="작성자 본인과 관리자만 수정할 수 있습니다"><i data-lucide="lock" class="w-3.5 h-3.5"></i>읽기 전용</span>';
    }

    // 날짜가 바뀌면(자정 넘김) 오늘/이번 주 기준 갱신
    function rollDateIfNeeded() {
      const t = ymd(new Date());
      if (t === TODAY) return;
      const old = TODAY;
      const oldWeek = CURRENT_WEEK.code;
      TODAY = t;
      CURRENT_WEEK = getWeekInfo(t);
      if (state.dailyFilterDate === old) state.dailyFilterDate = t;
      if (state.selectedDate === old) state.selectedDate = t;
      if (state.weeklyFilterWeek === oldWeek) state.weeklyFilterWeek = CURRENT_WEEK.code;
      renderAll();
    }

    setInterval(() => {
      rollDateIfNeeded();
      if (document.visibilityState === 'visible' && (!authOn() || auth.session)) syncFromApi(true);
    }, AUTO_REFRESH_MS);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && Date.now() - sync.lastSyncAt > 15000 && (!authOn() || auth.session)) {
        rollDateIfNeeded();
        syncFromApi(true);
      }
    });

    // =========================================================================
    // 팀 대화방 (팀 전체 방 1개). 서버가 먼저 알려 줄 수 없어서 몇 초마다 새 메시지를 물어봄
    // =========================================================================
    const CHAT_POLL_OPEN_MS = 4000;     // 대화창을 열어 두었을 때
    const CHAT_POLL_IDLE_MS = 30000;    // 닫아 두었을 때 (안 읽은 수만 갱신)
    const CHAT_POLL_HIDDEN_MS = 120000; // 다른 탭을 보고 있을 때
    const CHAT_KEEP = 300;              // 화면에 들고 있을 최근 메시지 수
    const CHAT_READ_KEY = 'teamhub_chat_read_v1';
    const BASE_TITLE = document.title;
    const chat = {
      open: false, messages: new Map(), rev: 0, loaded: false, inflight: false, timer: null,
      sending: false, files: [], readRev: 0, hasReadMark: false, error: '', mentionList: [], mentionIdx: 0, renderedSig: ''
    };
    try {
      const v = localStorage.getItem(CHAT_READ_KEY);
      if (v !== null) { chat.readRev = Number(v) || 0; chat.hasReadMark = true; }
    } catch (e) {}

    function chatAvailable() { return authOn() && !!auth.session; }
    function chatSorted() { return [...chat.messages.values()].sort((a, b) => a.ts - b.ts || a.rev - b.rev); }
    function myName() { const me = state.members.find(m => m.id === myMemberId()); return me ? me.name : ''; }
    function chatMentionsMe(m) { const n = myName(); return !!n && (m.text || '').includes('@' + n); }
    function chatUnread() {
      const me = myMemberId();
      return chatSorted().filter(m => !m.deleted && m.rev > chat.readRev && (!me || m.authorId !== me));
    }
    function saveChatRead() {
      chat.hasReadMark = true;
      try { localStorage.setItem(CHAT_READ_KEY, String(chat.readRev)); } catch (e) {}
    }
    function markChatRead() {
      const top = chatSorted().reduce((mx, m) => Math.max(mx, m.rev), chat.rev);
      if (top > chat.readRev) { chat.readRev = top; saveChatRead(); }
    }

    function scheduleChatPoll(delay) {
      clearTimeout(chat.timer);
      const ms = delay != null ? delay
        : document.visibilityState !== 'visible' ? CHAT_POLL_HIDDEN_MS
        : chat.open ? CHAT_POLL_OPEN_MS : CHAT_POLL_IDLE_MS;
      chat.timer = setTimeout(pollChat, ms);
    }

    async function pollChat() {
      if (!chatAvailable()) { renderChat(); return scheduleChatPoll(CHAT_POLL_IDLE_MS); }
      if (chat.inflight) return scheduleChatPoll();
      chat.inflight = true;
      try {
        const api = getApiEndpoint();
        const url = api + (api.includes('?') ? '&' : '?') + 'action=chat&since=' + chat.rev + '&session=' + encodeURIComponent(auth.session);
        const res = await fetch(url, { cache: 'no-store' }).then(r => r.json());
        if (!res || !res.ok) {
          if (res && handleAuthError(res)) return;
          throw new Error((res && res.error) || '대화를 불러오지 못했습니다');
        }
        mergeChat(res.messages || [], res.rev);
        chat.error = '';
      } catch (err) {
        chat.error = err.message || '연결 오류';
      } finally {
        chat.inflight = false;
        renderChat();
        scheduleChatPoll();
      }
    }

    function mergeChat(list, rev) {
      const me = myMemberId();
      const fresh = [];
      list.forEach(m => {
        if (!m || !m.id) return;
        if (chat.loaded && !chat.messages.has(m.id) && !m.deleted && m.authorId !== me) fresh.push(m);
        chat.messages.set(m.id, m);
      });
      if (chat.messages.size > CHAT_KEEP) chatSorted().slice(0, chat.messages.size - CHAT_KEEP).forEach(m => chat.messages.delete(m.id));
      chat.rev = Math.max(chat.rev, Number(rev) || 0);
      if (!chat.loaded && !chat.hasReadMark) { chat.readRev = chat.rev; saveChatRead(); } // 처음 쓰는 사람: 예전 대화는 읽은 것으로
      chat.loaded = true;
      if (chat.open && document.visibilityState === 'visible') markChatRead();
      else fresh.filter(chatMentionsMe).slice(-2).forEach(m => showToast(`💬 ${m.authorName}: ${m.text.slice(0, 50)}`, 'info'));
    }

    function toggleChat(force) {
      chat.open = typeof force === 'boolean' ? force : !chat.open;
      const panel = document.getElementById('chat-panel');
      panel.classList.toggle('hidden', !chat.open);
      panel.classList.toggle('flex', chat.open);
      if (chat.open) {
        markChatRead();
        renderChat(true);
        if (window.matchMedia('(min-width: 640px)').matches) document.getElementById('chat-input').focus();
        scheduleChatPoll(0);
      } else {
        hideMentionBox();
        renderChat();
        scheduleChatPoll();
      }
    }

    function formatChatDay(day) {
      if (day === TODAY) return '오늘';
      const d = parseYmd(day);
      const y = parseYmd(TODAY); y.setDate(y.getDate() - 1);
      if (ymd(y) === day) return '어제';
      return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`;
    }

    function chatTextHtml(text, mine) {
      const names = state.members.map(m => m.name).filter(Boolean).sort((a, b) => b.length - a.length)
        .map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      const mentionRe = names.length ? new RegExp('@(' + names.join('|') + ')') : null;
      return text.split(/(https?:\/\/[^\s<>"'`]+)/g).map((part, i) => {
        if (i % 2) return `<a href="${escapeHtml(part)}" target="_blank" rel="noopener noreferrer" class="underline break-all ${mine ? 'text-white' : 'text-indigo-600'}">${escapeHtml(part)}</a>`;
        if (!mentionRe) return escapeHtml(part);
        return part.split(mentionRe).map((seg, j) => j % 2
          ? `<b class="${mine ? 'text-amber-200' : 'text-indigo-600'}">@${escapeHtml(seg)}</b>`
          : escapeHtml(seg)).join('');
      }).join('');
    }

    function chatAttachHtml(list, mine) {
      return list.map(a => `<a ${attachOpenAttrs(a)} class="mt-1.5 flex items-center gap-2 px-2.5 py-1.5 rounded-lg ${mine ? 'bg-white/15 hover:bg-white/25' : 'bg-slate-50 hover:bg-slate-100 border border-slate-200'} max-w-full"><i data-lucide="${attachIcon(a)}" class="w-4 h-4 shrink-0"></i><span class="truncate text-xs font-medium">${escapeHtml(a.name)}</span><span class="text-[10px] opacity-70 shrink-0">${formatBytes(a.size)}</span></a>`).join('');
    }

    function renderChatMessages() {
      const list = chatSorted();
      if (!list.length) {
        return `<div class="h-full flex flex-col items-center justify-center text-center text-slate-400 gap-2 py-10">
          <i data-lucide="messages-square" class="w-8 h-8"></i>
          <p class="text-sm">${chat.loaded ? '아직 대화가 없습니다.<br>첫 메시지를 남겨 보세요.' : '대화를 불러오는 중...'}</p></div>`;
      }
      const me = myMemberId();
      let html = '', prevDay = '', prev = null;
      list.forEach(m => {
        const d = new Date(m.ts);
        const day = ymd(d);
        if (day !== prevDay) {
          html += `<div class="flex justify-center my-3"><span class="px-3 py-0.5 rounded-full bg-slate-200/70 text-[11px] text-slate-600">${formatChatDay(day)}</span></div>`;
          prevDay = day; prev = null;
        }
        const mine = !!me && m.authorId === me;
        const grouped = !!prev && prev.authorId === m.authorId && m.ts - prev.ts < 5 * 60000 && !prev.deleted;
        const member = state.members.find(x => x.id === m.authorId);
        const name = member ? member.name : (m.authorName || '알 수 없음');
        const time = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
        const canDelete = !m.deleted && (mine || isAdmin());
        const canEdit = !m.deleted && mine;
        // PC는 마우스를 올리면 보이고, 휴대폰(마우스 없음)은 늘 보임
        const actBtn = 'opacity-0 group-hover:opacity-100 focus:opacity-100 [@media(hover:none)]:opacity-100 p-1 rounded text-slate-300 shrink-0';
        const del = (canEdit ? `<button type="button" onclick="editChatMessage('${m.id}')" class="${actBtn} hover:text-indigo-600" title="수정" aria-label="메시지 수정"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>` : '')
          + (canDelete ? `<button type="button" onclick="deleteChatMessage('${m.id}')" class="${actBtn} hover:text-rose-500" title="삭제" aria-label="메시지 삭제"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : '');
        const editedMark = m.edited && !m.deleted ? '<span class="text-[10px] text-slate-400 shrink-0 mb-0.5">(수정됨)</span>' : '';
        const body = m.deleted
          ? '<span class="italic text-xs">삭제된 메시지입니다</span>'
          : (m.text ? `<div class="whitespace-pre-wrap break-words">${chatTextHtml(m.text, mine)}</div>` : '') + chatAttachHtml(m.attachments || [], mine);
        const mention = !mine && !m.deleted && chatMentionsMe(m);
        if (mine) {
          html += `<div class="group flex justify-end items-end gap-1 ${grouped ? 'mt-0.5' : 'mt-2.5'}">${del}${editedMark}<span class="text-[10px] text-slate-400 shrink-0 mb-0.5">${time}</span><div class="max-w-[78%] min-w-0 px-3 py-2 rounded-2xl rounded-br-md text-sm ${m.deleted ? 'bg-slate-100 text-slate-400' : 'bg-indigo-600 text-white'}">${body}</div></div>`;
        } else {
          html += `<div class="group flex items-start gap-2 ${grouped ? 'mt-0.5' : 'mt-2.5'}">
            <div class="w-8 shrink-0">${grouped ? '' : member ? avatar(member, 'w-8 h-8 text-[11px]') : '<span class="w-8 h-8 rounded-full bg-slate-300 flex"></span>'}</div>
            <div class="min-w-0 max-w-[78%]">
              ${grouped ? '' : `<p class="text-[11px] font-semibold text-slate-600 mb-0.5">${escapeHtml(name)}</p>`}
              <div class="flex items-end gap-1"><div class="min-w-0 px-3 py-2 rounded-2xl rounded-tl-md text-sm border ${m.deleted ? 'bg-slate-100 border-slate-100 text-slate-400' : mention ? 'bg-amber-50 border-amber-300 text-slate-800' : 'bg-white border-slate-200 text-slate-800'}">${body}</div><span class="text-[10px] text-slate-400 shrink-0 mb-0.5">${time}</span>${editedMark}${del}</div>
            </div>
          </div>`;
        }
        prev = m;
      });
      return html;
    }

    function renderChat(forceBottom = false) {
      const fab = document.getElementById('chat-fab');
      if (!fab) return;
      const available = chatAvailable();
      fab.classList.toggle('hidden', !available);
      fab.classList.toggle('flex', available);
      const unread = available && !chat.open ? chatUnread() : [];
      const badge = document.getElementById('chat-badge');
      badge.textContent = unread.length > 99 ? '99+' : String(unread.length);
      badge.classList.toggle('hidden', !unread.length);
      badge.classList.toggle('flex', !!unread.length);
      badge.classList.toggle('bg-amber-500', unread.some(chatMentionsMe));
      document.title = unread.length ? `(${unread.length}) ${BASE_TITLE}` : BASE_TITLE;
      if (!chat.open) return;

      document.getElementById('chat-status').textContent = chat.error
        ? '연결이 끊겼습니다 · 다시 시도하는 중'
        : `${state.members.length}명 · 몇 초마다 새 메시지 확인`;
      const box = document.getElementById('chat-messages');
      const sig = [chat.rev, chat.messages.size, myMemberId(), chatSorted().map(m => m.id + ':' + m.rev + (m.deleted ? 'd' : '')).join(','), TODAY].join('|');
      if (sig === chat.renderedSig && !forceBottom) return; // 바뀐 게 없으면 다시 그리지 않음 (글자 선택 유지)
      const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
      box.innerHTML = renderChatMessages();
      chat.renderedSig = sig;
      lucide.createIcons();
      if (forceBottom || nearBottom) box.scrollTop = box.scrollHeight;
    }

    function autoSizeChatInput() {
      const el = document.getElementById('chat-input');
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 128) + 'px';
    }

    function renderChatFiles() {
      const box = document.getElementById('chat-files');
      box.classList.toggle('hidden', !chat.files.length);
      box.innerHTML = chat.files.map((a, i) => `
        <span class="inline-flex items-center gap-1 max-w-[180px] px-2 py-1 rounded-lg ${a.uploading ? 'bg-indigo-50 text-indigo-600' : 'bg-slate-100 text-slate-700'} text-[11px]">
          <i data-lucide="${a.uploading ? 'loader-circle' : attachIcon(a)}" class="w-3.5 h-3.5 shrink-0 ${a.uploading ? 'animate-spin' : ''}"></i>
          <span class="truncate">${escapeHtml(a.name)}</span>
          ${a.uploading ? '' : `<button type="button" onclick="chat.files.splice(${i}, 1); renderChatFiles()" class="shrink-0 hover:text-rose-600" title="빼기"><i data-lucide="x" class="w-3 h-3"></i></button>`}
        </span>`).join('');
      lucide.createIcons();
    }

    function chatPickFiles(input) {
      return uploadFilesInto(chat.files, input, renderChatFiles);
    }

    async function sendChat(e) {
      if (e) e.preventDefault();
      if (!chatAvailable()) return showToast('대화방은 팀 서버에 로그인했을 때만 쓸 수 있습니다.', 'error');
      if (chat.sending) return;
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (chat.files.some(f => f.uploading)) return showToast('파일을 올리는 중입니다. 끝난 뒤에 보내 주세요.', 'error');
      const attachments = attachList(chat.files);
      if (!text && !attachments.length) return;
      chat.sending = true;
      document.getElementById('chat-send').disabled = true;
      try {
        const res = await postAuth({ action: 'chatSend', session: auth.session, text, attachments });
        if (!res || !res.ok) {
          if (res && handleAuthError(res)) return;
          throw new Error((res && res.error) || '보내기 실패');
        }
        input.value = '';
        chat.files = [];
        autoSizeChatInput();
        renderChatFiles();
        hideMentionBox();
        chat.messages.set(res.message.id, res.message); // 번호(rev)는 다음 확인 때 맞춤 → 그 사이 다른 사람 메시지도 빠짐없이 받음
        chat.readRev = Math.max(chat.readRev, res.message.rev);
        saveChatRead();
        renderChat(true);
        scheduleChatPoll(300);
      } catch (err) {
        showToast('메시지를 보내지 못했습니다: ' + err.message, 'error');
      } finally {
        chat.sending = false;
        document.getElementById('chat-send').disabled = false;
        input.focus();
      }
    }

    function editChatMessage(id) {
      const m = chat.messages.get(id);
      if (!m || m.deleted) return;
      openModal('메시지 수정', `
        <form onsubmit="event.preventDefault(); saveChatEdit('${id}', this)" class="space-y-3">
          <textarea name="text" rows="4" maxlength="2000" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-300">${escapeHtml(m.text || '')}</textarea>
          <p class="text-[11px] text-slate-400">고치면 모두의 화면에 바뀐 내용과 '(수정됨)'이 보입니다.${(m.attachments || []).length ? ' 첨부 파일은 그대로 남습니다.' : ''}</p>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50">취소</button>
            <button type="submit" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">저장</button>
          </div>
        </form>`);
      const ta = document.querySelector('#modal-body textarea[name=text]');
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }

    async function saveChatEdit(id, form) {
      const text = form.text.value.trim();
      const m = chat.messages.get(id);
      if (!m) return closeModal();
      if (text === (m.text || '').trim()) return closeModal();
      if (!text && !(m.attachments || []).length) return showToast('내용을 모두 지우려면 메시지 삭제를 쓰세요.', 'error');
      const btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        const res = await postAuth({ action: 'chatEdit', session: auth.session, id, text });
        if (!res || !res.ok) {
          if (res && handleAuthError(res)) return;
          throw new Error((res && res.error) || '수정 실패');
        }
        chat.messages.set(id, { ...m, ...res.message });
        chat.readRev = Math.max(chat.readRev, res.message.rev); // 내가 고친 건 읽은 것으로
        saveChatRead();
        closeModal();
        renderChat();
        scheduleChatPoll(300);
      } catch (err) {
        btn.disabled = false;
        showToast('고치지 못했습니다: ' + err.message, 'error');
      }
    }

    function deleteChatMessage(id) {
      askConfirm({
        title: '메시지 삭제',
        message: '이 메시지를 지울까요?\n모두의 화면에서 "삭제된 메시지입니다"로 바뀝니다.',
        confirmLabel: '삭제',
        onConfirm: async () => {
          try {
            const res = await postAuth({ action: 'chatDelete', session: auth.session, id });
            if (!res || !res.ok) {
              if (res && handleAuthError(res)) return;
              throw new Error((res && res.error) || '삭제 실패');
            }
            const m = chat.messages.get(id);
            if (m) chat.messages.set(id, { ...m, deleted: true, text: '', attachments: [] });
            renderChat();
            scheduleChatPoll(300);
          } catch (err) {
            showToast('지우지 못했습니다: ' + err.message, 'error');
          }
        }
      });
    }

    // @이름 자동완성
    function chatInputChanged() {
      autoSizeChatInput();
      const el = document.getElementById('chat-input');
      const m = /@([^\s@]*)$/.exec(el.value.slice(0, el.selectionStart));
      if (!m) return hideMentionBox();
      const q = m[1].replace(/\s/g, '');
      chat.mentionList = state.members.filter(x => x.id !== myMemberId() && x.name.replace(/\s/g, '').includes(q)).slice(0, 6);
      if (!chat.mentionList.length) return hideMentionBox();
      chat.mentionIdx = 0;
      renderMentionBox();
    }
    function renderMentionBox() {
      const box = document.getElementById('chat-mention-box');
      box.innerHTML = chat.mentionList.map((x, i) => `
        <button type="button" onmousedown="event.preventDefault(); pickMention(${i})" class="w-full flex items-center gap-2 px-3 py-1.5 text-left text-sm ${i === chat.mentionIdx ? 'bg-indigo-50 text-indigo-700' : 'text-slate-700 hover:bg-slate-50'}">
          ${avatar(x)}<span class="truncate">${escapeHtml(x.name)}</span><span class="ml-auto text-[11px] text-slate-400">${escapeHtml(x.role)}</span>
        </button>`).join('');
      box.classList.remove('hidden');
    }
    function hideMentionBox() {
      chat.mentionList = [];
      const box = document.getElementById('chat-mention-box');
      if (box) box.classList.add('hidden');
    }
    function pickMention(i) {
      const x = chat.mentionList[i];
      const el = document.getElementById('chat-input');
      if (!x) return;
      const pos = el.selectionStart;
      const before = el.value.slice(0, pos).replace(/@([^\s@]*)$/, '@' + x.name + ' ');
      el.value = before + el.value.slice(pos);
      el.selectionStart = el.selectionEnd = before.length;
      hideMentionBox();
      el.focus();
    }
    function chatKeydown(e) {
      if (chat.mentionList.length) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const n = chat.mentionList.length;
          chat.mentionIdx = (chat.mentionIdx + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
          return renderMentionBox();
        }
        if ((e.key === 'Enter' || e.key === 'Tab') && !e.isComposing) { e.preventDefault(); return pickMention(chat.mentionIdx); }
        if (e.key === 'Escape') return hideMentionBox();
      }
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); }
      if (e.key === 'Escape') toggleChat(false);
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (chat.open) markChatRead();
        scheduleChatPoll(chat.open ? 0 : 1000);
      }
    });
    scheduleChatPoll(1500);

    // 앱 설치용 서비스 워커 (Google Sites 안에 넣은 화면에서는 등록하지 않음)
    try {
      if ('serviceWorker' in navigator && window.top === window.self && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    } catch (e) {}

    // ---- 새 버전 알림: GitHub에 올린 화면이 바뀌면 '새로고침' 안내를 띄움
    // (GitHub Pages는 브라우저가 화면 파일을 10분까지 다시 쓰므로, 주소에 ?v= 를 붙여 새로 받게 함)
    // APP_VERSION 은 GitHub에 올릴 때 올린 시각으로 바뀜. 'dev' 면 검사하지 않음
    const APP_VERSION = '20261127-164151';
    let updateNoticeShown = false;
    async function checkForUpdate() {
      if (APP_VERSION === 'dev' || updateNoticeShown || !/^https?:$/.test(location.protocol)) return;
      try {
        const res = await fetch(`${location.pathname}?vcheck=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) return;
        const m = (await res.text()).match(/const APP_VERSION = '([^']+)'/);
        if (m && m[1] !== 'dev' && m[1] !== APP_VERSION) showUpdateNotice(m[1]);
      } catch (e) {}
    }
    function reloadToVersion(v) {
      const url = new URL(location.href);
      url.searchParams.set('v', v);
      location.replace(url.toString());
    }
    function showUpdateNotice(v) {
      updateNoticeShown = true;
      const bar = document.createElement('div');
      bar.id = 'update-notice';
      bar.className = 'fixed top-3 left-1/2 -translate-x-1/2 z-[60] flex items-center gap-3 pl-4 pr-2 py-2 rounded-xl bg-slate-900 text-white shadow-xl text-sm max-w-[calc(100vw-2rem)]';
      bar.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4 text-amber-300 shrink-0"></i><span>새 버전이 올라왔습니다.</span>
        <button type="button" class="px-3 py-1.5 rounded-lg bg-indigo-500 hover:bg-indigo-400 font-semibold text-xs whitespace-nowrap">새로고침</button>
        <button type="button" class="p-1 rounded-lg hover:bg-white/10 text-slate-300" aria-label="닫기"><i data-lucide="x" class="w-4 h-4"></i></button>`;
      const [go, close] = bar.querySelectorAll('button');
      go.onclick = () => {
        if (sync.inflight || sync.pending.length) { showToast('저장 중입니다. 잠시 뒤 다시 눌러 주세요.', 'info'); return; }
        reloadToVersion(v);
      };
      close.onclick = () => bar.remove();
      document.body.appendChild(bar);
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }
    // 주소의 ?v= 는 새로 받은 뒤에는 필요 없으니 지움 (즐겨찾기·공유 주소가 지저분해지지 않게)
    try {
      const u = new URL(location.href);
      if (u.searchParams.has('v')) { u.searchParams.delete('v'); history.replaceState(null, '', u.toString()); }
    } catch (e) {}
    setTimeout(checkForUpdate, 5000);
    setInterval(checkForUpdate, 10 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });

    window.addEventListener('beforeunload', e => {
      if (sync.inflight || sync.pending.length) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // ---- 상단 시계 (한국 시간 + 세계시간). 시간대 이름으로 계산하므로 서머타임 자동 반영
    const HOME_TZ = 'Asia/Seoul';
    const WORLD_CLOCKS = [
      { name: '미국 오하이오', tz: 'America/New_York' },
      { name: '미국 테네시', tz: 'America/Chicago' },   // 내슈빌 기준 (테네시 동부는 오하이오와 같은 시각)
      { name: '중국 청두', tz: 'Asia/Shanghai' },
      { name: '인도네시아 카라왕', tz: 'Asia/Jakarta' }
    ];
    function timePartsIn(tz, d) {
      try {
        const p = {};
        new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
          .formatToParts(d).forEach(x => { p[x.type] = x.value; });
        return { y: +p.year, mo: +p.month, d: +p.day, h: +p.hour % 24, mi: +p.minute };
      } catch (e) {
        return null;
      }
    }
    function renderClocks() {
      const now = new Date();
      const home = timePartsIn(HOME_TZ, now) || { y: now.getFullYear(), mo: now.getMonth() + 1, d: now.getDate(), h: now.getHours(), mi: now.getMinutes() };
      const homeEl = document.getElementById('clock-home');
      if (homeEl) homeEl.textContent = `${pad2(home.h)}:${pad2(home.mi)}`;
      const box = document.getElementById('world-clocks');
      if (!box) return;
      const homeMin = Date.UTC(home.y, home.mo - 1, home.d, home.h, home.mi) / 60000;
      box.innerHTML = WORLD_CLOCKS.map(c => {
        const t = timePartsIn(c.tz, now);
        if (!t) return '';
        const diffH = Math.round((Date.UTC(t.y, t.mo - 1, t.d, t.h, t.mi) / 60000 - homeMin) / 60);
        const dayDiff = Math.round((Date.UTC(t.y, t.mo - 1, t.d) - Date.UTC(home.y, home.mo - 1, home.d)) / 86400000);
        const night = t.h < 7 || t.h >= 19;
        const work = t.h >= 9 && t.h < 18;
        const dayLabel = dayDiff < 0 ? '어제' : dayDiff > 0 ? '내일' : '오늘';
        const diffLabel = `${diffH >= 0 ? '+' : ''}${diffH}h`;
        return `<div class="px-2.5 py-1 rounded-xl border whitespace-nowrap ${night ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'}" title="${c.name} 현지 시각 · 한국 기준 ${dayLabel} ${diffLabel} · ${work ? '근무시간' : '근무시간 외'}">
          <div class="flex items-center gap-1 text-[10px] font-semibold leading-tight ${night ? 'text-slate-300' : 'text-slate-500'}"><i data-lucide="${night ? 'moon' : 'sun'}" class="w-3 h-3 ${night ? 'text-amber-200' : 'text-amber-500'}"></i>${c.name}<span class="ml-0.5 w-1.5 h-1.5 rounded-full ${work ? 'bg-emerald-500' : 'bg-slate-400'}"></span></div>
          <div class="flex items-baseline gap-1.5"><span class="text-lg font-bold tabular-nums leading-tight">${pad2(t.h)}:${pad2(t.mi)}</span><span class="clock-diff hidden 2xl:inline text-[10px] text-slate-400">${dayLabel} ${diffLabel}</span></div>
        </div>`;
      }).join('');
      if (typeof lucide !== 'undefined') lucide.createIcons();
      fitClocks();
    }
    // 헤더 폭이 모자라면 뒤쪽 시계부터 숨김 (검색창 밑으로 겹쳐 보이지 않게)
    function fitClocks() {
      const box = document.getElementById('world-clocks');
      if (!box) return;
      const cards = [...box.children];
      const diffs = [...box.querySelectorAll('.clock-diff')];
      const header = box.parentElement;
      cards.forEach(c => { c.style.display = ''; });
      diffs.forEach(d => { d.style.display = ''; });
      header.classList.remove('clocks-tight');
      const tooWide = () => box.scrollWidth > box.clientWidth + 1;
      // 1) '어제 -14h' 같은 작은 글씨를 빼고, 2) 검색창을 돋보기 버튼으로 접고, 3) 그래도 넘치면 뒤쪽 시계부터 숨김
      if (tooWide()) diffs.forEach(d => { d.style.display = 'none'; });
      if (tooWide()) header.classList.add('clocks-tight');
      for (let i = cards.length - 1; i >= 0 && tooWide(); i--) cards[i].style.display = 'none';
    }
    setInterval(renderClocks, 15000);
    // 창 크기·사이드바가 바뀌어 헤더 폭이 달라지면 다시 맞춤
    (function watchClockSpace() {
      const refit = () => { clearTimeout(fitClocks._t); fitClocks._t = setTimeout(fitClocks, 100); };
      window.addEventListener('resize', refit);
      const header = document.getElementById('world-clocks')?.parentElement;
      if (header && 'ResizeObserver' in window) new ResizeObserver(refit).observe(header);
    })();

    function toggleHeaderSearch() {

      if (open) document.getElementById('global-search').focus();

    const NAV_ITEMS = [

      { id: 'notices', label: '공지·News', icon: 'megaphone' },
      { id: 'schedule', label: '일정 관리', icon: 'calendar-days' },
      { id: 'daily', label: '일간보고', icon: 'clipboard-check' },
      { id: 'weekly', label: '주간보고', icon: 'file-bar-chart-2' },
      { id: 'meetings', label: '회의록', icon: 'notebook-pen' },
      { id: 'issues', label: '이슈 트래킹', icon: 'bug' },
      { id: 'projects', label: '프로젝트 관리', icon: 'kanban' },
      { id: 'members', label: '인원 관리', icon: 'users' },
      { id: 'trips', label: '출장 계획', icon: 'plane' },

    function toggleMobileSidebar(open) {

        backdrop.classList.remove('hidden');

        backdrop.classList.add('hidden');

    function renderSidebar() {
      const nav = document.getElementById('sidebar-nav');
      const counts = {
        projects: state.projects.filter(p => p.status !== '완료').length,
        members: state.members.length,
        weekly: state.weeklyReports.filter(w => w.week === state.weeklyFilterWeek).length,
        daily: state.dailyReports.filter(d => d.date === TODAY).length,
        schedule: state.schedules.filter(s => scheduleEnd(s) >= TODAY).length,
        pool: state.knowledgePool.length,
        notices: state.notices.length,
        issues: state.issues.filter(i => !ISSUE_CLOSED.includes(i.status)).length,
        meetings: state.meetings.length,
        parts: state.parts.filter(p => p.status !== '반납 완료' && p.status !== '폐기').length
      };

      const checkCount = computeOverview().checkCount;
      nav.innerHTML = NAV_ITEMS.map(item => {
        const active = state.activeTab === item.id;
        const count = counts[item.id];
        if (item.id === 'members' && authOn() && isAdmin() && auth.joinRequests.length) {
          return `
          <button type="button" onclick="setActiveTab('members')"
            class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition ${
              active ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
            }">
            <span class="flex items-center gap-2.5 truncate">
              <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0 ${active ? 'text-indigo-600' : 'text-slate-400'}"></i>
              <span class="truncate">${item.label}</span>
            </span>
            <span class="ml-2 px-2 py-0.5 text-[11px] rounded-full bg-amber-100 text-amber-800 font-semibold whitespace-nowrap" title="가입 요청">요청 ${auth.joinRequests.length}</span>
          </button>`;
        }
        if (item.id === 'overview') {
          return `
          <button type="button" onclick="setActiveTab('overview')"
            class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition ${
              active ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
            }">
            <span class="flex items-center gap-2.5 truncate">
              <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0 ${active ? 'text-indigo-600' : 'text-slate-400'}"></i>
              <span class="truncate">${item.label}</span>
            </span>
            ${checkCount ? `<span class="ml-2 px-2 py-0.5 text-[11px] rounded-full bg-rose-100 text-rose-700 font-semibold whitespace-nowrap" title="오늘 확인 필요">확인 ${checkCount}</span>` : ''}
          </button>`;
        }
        return `
          <button type="button" onclick="setActiveTab('${item.id}')"
            class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition ${
              active
                ? 'bg-indigo-50 text-indigo-700 font-semibold'
                : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
            }">
            <span class="flex items-center gap-2.5 truncate">
              <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0 ${active ? 'text-indigo-600' : 'text-slate-400'}"></i>
              <span class="truncate">${item.label}</span>
            </span>
            ${count !== undefined ? `<span class="ml-2 px-2 py-0.5 text-[11px] rounded-full ${active ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-500'}">${count}</span>` : ''}
          </button>
        `;
      }).join('');

      const activeItem = NAV_ITEMS.find(n => n.id === state.activeTab);
      document.getElementById('page-title').textContent = activeItem ? activeItem.label : '팀 현황';
    }

    // 휴대폰 아래쪽 메뉴: 자주 쓰는 4개 + 전체 메뉴
    const BOTTOM_NAV = [
      { id: 'overview', label: '현황', icon: 'layout-dashboard' },
      { id: 'daily', label: '일간보고', icon: 'clipboard-check' },
      { id: 'issues', label: '이슈', icon: 'bug' },

    function renderBottomNav() {

        return `<button type="button" onclick="setActiveTab('${b.id}')" class="relative flex flex-col items-center justify-center gap-0.5 py-2 text-[11px] font-semibold ${active ? 'text-indigo-600' : 'text-slate-500'}">
          <i data-lucide="${b.icon}" class="w-5 h-5"></i>${escapeHtml(b.label)}${dot}</button>`;

          <i data-lucide="menu" class="w-5 h-5"></i>${inBar ? '전체 메뉴' : escapeHtml((NAV_ITEMS.find(n => n.id === state.activeTab) || { label: '전체 메뉴' }).label.split(' ')[0])}</button>`;
    }

    function renderAll() {
      destroyCharts();
