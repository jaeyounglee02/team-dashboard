      const repeatOn = !!(document.getElementById('sch-repeat-on') || {}).checked;
      const repeat = repeatOn && REPEAT_KEYS.includes(fd.get('repeat')) ? fd.get('repeat') : '';
      const repeatUntil = repeat && DATE_RE.test(fd.get('repeatUntil') || '') ? fd.get('repeatUntil') : '';
      if (repeatUntil && repeatUntil < fd.get('date')) return showToast('반복 종료일이 시작 날짜보다 빠릅니다.', 'error');
      const data = {
        id: id || uid('s'),
        title: fd.get('title').trim(),
        date: fd.get('date'),
        endDate: !repeat && DATE_RE.test(fd.get('endDate') || '') && fd.get('endDate') > fd.get('date') ? fd.get('endDate') : '',
        repeat, repeatUntil,
        time: fd.get('time').trim() || '종일',
        category: fd.get('category'),
        attendeeIds: prev ? prev.attendeeIds || [] : [],
        description: fd.get('description').trim(),
        auto: prev && prev.auto ? prev.auto : ''
      };
      if (saveItem('schedules', data, 'end', '일정이 저장되었습니다.')) {
        selectCalendarDate(data.date);
      }
    }

    // --- 첨부 (업무 Pool·대화방): 파일은 줄여서 팀 시트에 저장, 큰 문서는 링크 ---
    const UPLOAD_MAX_MB = 2;           // Code.gs FILE_MAX_BYTES 와 같게 (줄인 뒤 크기)
    const UPLOAD_MAX_BYTES = UPLOAD_MAX_MB * 1024 * 1024;
    const READ_MAX_MB = 50;            // 줄이기 전 원본으로 받을 수 있는 크기
    const IMAGE_MAX_SIDE = 1920;       // 사진 긴 변 (픽셀)
    const DOC_IMAGE_MAX_SIDE = 1280;   // Word 안 그림 긴 변
    const MAMMOTH_URL = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
    let poolDraft = [];                // 편집 창에서 고치는 중인 첨부 목록
    const storedFiles = new Map();     // fileId → 첨부 정보 (열기·미리보기용)
    const storedBlobs = new Map();     // fileId → Promise<Blob> (한 번 받은 파일은 다시 안 받음)

    function formatBytes(n) {
      if (!n) return '';
      if (n < 1024) return n + 'B';
      if (n < 1024 * 1024) return Math.round(n / 1024) + 'KB';
      return (n / 1024 / 1024).toFixed(n < 10 * 1024 * 1024 ? 1 : 0) + 'MB';
    }
    function attachIcon(a) {
      const t = `${a.mimeType} ${a.name} ${a.url}`.toLowerCase();
      if (/pdf/.test(t)) return 'file-text';
      if (/image\/|\.(png|jpe?g|gif|webp|svg)\b/.test(t)) return 'image';
      if (/text\/html|\.html?\b/.test(t)) return 'file-code';
      if (/sheet|excel|\.xlsx?\b|\.csv\b|spreadsheets/.test(t)) return 'file-spreadsheet';
      if (/presentation|powerpoint|\.pptx?\b/.test(t)) return 'presentation';
      if (/video\/|\.(mp4|mov)\b/.test(t)) return 'file-video';
      if (/zip|compressed/.test(t)) return 'file-archive';
      return a.kind === 'link' ? 'link' : 'file';
    }
    // 시트에 저장한 파일을 화면 안에서 어떻게 보여 줄지
    function storedViewKind(a) {
      const t = (a.mimeType || '').toLowerCase();
      if (t === 'text/html' || /\.html?$/i.test(a.name)) return 'html';
      if (t.startsWith('image/')) return 'image';
      if (t === 'application/pdf') return 'pdf';
      if (t.startsWith('text/') || /\.(txt|md|csv|log)$/i.test(a.name)) return 'text';
      return '';
    }
    // 링크 첨부를 화면 안에서 미리볼 주소 (Google Drive·문서·시트·슬라이드, PDF, 이미지)
    function attachPreviewUrl(a) {
      let m = /^https:\/\/drive\.google\.com\/file\/d\/([\w-]+)/.exec(a.url) || /^https:\/\/drive\.google\.com\/open\?id=([\w-]+)/.exec(a.url);
      if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
      m = /^https:\/\/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([\w-]+)/.exec(a.url);
      if (m) return `https://docs.google.com/${m[1]}/d/${m[2]}/preview`;
      if (/^application\/pdf$|^image\//.test(a.mimeType) || /\.(pdf|png|jpe?g|gif|webp)$/i.test(a.url)) return a.url;
      return '';
    }
    function sizeLabel(a) {
      if (a.kind !== 'file') return '링크';
      return a.originalSize > a.size * 1.1 ? `${formatBytes(a.size)} <span class="text-slate-300">(원본 ${formatBytes(a.originalSize)})</span>` : formatBytes(a.size);
    }
    // 첨부 하나를 여는 링크 속성: 시트 파일은 화면에서 받아서 열고, 링크는 새 탭
    function attachOpenAttrs(a) {
      if (a.fileId) {
        storedFiles.set(a.fileId, a);
        return `href="#" onclick="event.preventDefault(); openStoredFile('${a.fileId}')"`;
      }
      return `href="${escapeHtml(a.url)}" target="_blank" rel="noopener noreferrer"`;
    }

    function renderAttachmentList(list) {
      if (!list.length) return '';
      return `
        <div class="rounded-xl border border-slate-200">
          <p class="px-3 py-2 text-xs font-bold text-slate-600 border-b border-slate-100 flex items-center gap-1.5"><i data-lucide="paperclip" class="w-3.5 h-3.5"></i>첨부 ${list.length}개</p>
          <div class="divide-y divide-slate-100">
            ${list.map((a, i) => {
              const preview = a.fileId ? storedViewKind(a) : attachPreviewUrl(a);
              const previewCall = a.fileId ? `toggleStoredPreview(${i}, '${a.fileId}')` : `toggleAttachPreview(${i}, '${escapeHtml(preview)}')`;
              return `
              <div class="px-3 py-2">
                <div class="flex items-center gap-2 min-w-0">
                  <i data-lucide="${attachIcon(a)}" class="w-4 h-4 shrink-0 ${a.kind === 'file' ? 'text-indigo-500' : 'text-slate-400'}"></i>
                  <a ${attachOpenAttrs(a)} class="text-sm text-slate-800 hover:text-indigo-700 hover:underline truncate">${escapeHtml(a.name)}</a>
                  <span class="text-[11px] text-slate-400 shrink-0">${sizeLabel(a)}</span>
                  <span class="ml-auto flex items-center gap-1 shrink-0">
                    ${preview ? `<button type="button" onclick="${previewCall}" class="px-2 py-1 rounded-md text-[11px] font-semibold text-indigo-600 hover:bg-indigo-50">미리보기</button>` : ''}
                    <a ${attachOpenAttrs(a)} class="px-2 py-1 rounded-md text-[11px] font-semibold text-slate-600 hover:bg-slate-100">${a.fileId && !preview ? '받기' : '열기'}</a>
                  </span>
                </div>
                <div id="attach-preview-${i}" class="hidden mt-2"></div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
    }

    function toggleAttachPreview(i, url) {
      const box = document.getElementById('attach-preview-' + i);
      if (!box) return;
      if (!box.classList.contains('hidden')) { box.classList.add('hidden'); box.innerHTML = ''; return; }
      box.innerHTML = `<iframe src="${escapeHtml(url)}" class="w-full h-[60vh] rounded-lg border border-slate-200 bg-slate-50" allow="autoplay" referrerpolicy="no-referrer"></iframe>
        <p class="text-[11px] text-slate-400 mt-1">안 보이면 [열기]를 누르세요. Google Drive 파일은 볼 권한이 있는 계정으로 로그인되어 있어야 보입니다.</p>`;
      box.classList.remove('hidden');
    }

    // --- 시트에 저장한 파일 받기·보기 ---
    async function gunzipBytes(blob) {
      if (typeof DecompressionStream !== 'function') throw new Error('이 브라우저는 압축 풀기를 지원하지 않습니다. Chrome·Edge 최신 버전을 써 주세요.');
      return new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
    }
    function fetchStoredFile(fileId) {
      if (storedBlobs.has(fileId)) return storedBlobs.get(fileId);
      const p = (async () => {
        if (!authOn() || !auth.session) throw new Error('팀 서버에 로그인해야 볼 수 있습니다.');
        const api = getApiEndpoint();
        const url = api + (api.includes('?') ? '&' : '?') + 'action=file&id=' + encodeURIComponent(fileId) + '&session=' + encodeURIComponent(auth.session);
        const res = await fetch(url, { cache: 'no-store' }).then(r => r.json());
        if (!res || !res.ok) {
          if (res && handleAuthError(res)) throw new Error('로그인이 필요합니다.');
          throw new Error((res && res.error) || '파일을 받지 못했습니다.');
        }
        const bin = atob(res.file.data);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        let blob = new Blob([bytes]);
        if (res.file.encoding === 'gzip') blob = await gunzipBytes(blob);
        return new Blob([blob], { type: res.file.mimeType || 'application/octet-stream' });
      })();
      storedBlobs.set(fileId, p);
      p.catch(() => storedBlobs.delete(fileId));
      return p;
    }
    // 올린 HTML은 스크립트·외부 주소·양식을 모두 막은 칸 안에서만 보여 줌
    const SAFE_HTML_CSP = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; font-src data:">`;
    function sandboxedHtml(html) {
      return SAFE_HTML_CSP + '<base target="_blank">' + html;
    }
    function storedFrameHtml(kind, blob, text) {
      const url = URL.createObjectURL(blob);
      if (kind === 'image') return `<div class="rounded-lg border border-slate-200 bg-slate-50 p-2 flex justify-center"><img src="${url}" alt="" class="max-h-[60vh] max-w-full object-contain" /></div>`;
      if (kind === 'pdf') return `<iframe src="${url}" class="w-full h-[60vh] rounded-lg border border-slate-200 bg-slate-50"></iframe>`;
      if (kind === 'text') return `<pre class="max-h-[60vh] overflow-auto p-3 rounded-lg border border-slate-200 bg-slate-50 text-xs whitespace-pre-wrap">${escapeHtml(text)}</pre>`;
      return `<iframe sandbox srcdoc="${escapeHtml(sandboxedHtml(text))}" class="w-full h-[60vh] rounded-lg border border-slate-200 bg-white"></iframe>`;
    }
    async function toggleStoredPreview(i, fileId) {
      const box = document.getElementById('attach-preview-' + i);
      const a = storedFiles.get(fileId);
      if (!box || !a) return;
      if (!box.classList.contains('hidden')) { box.classList.add('hidden'); box.innerHTML = ''; return; }
      box.innerHTML = '<p class="text-xs text-slate-400 py-2">불러오는 중...</p>';
      box.classList.remove('hidden');
      try {
        const kind = storedViewKind(a);
        const blob = await fetchStoredFile(fileId);
        const text = kind === 'html' || kind === 'text' ? await blob.text() : '';
        box.innerHTML = storedFrameHtml(kind, blob, text);
      } catch (err) {
        box.innerHTML = `<p class="text-xs text-rose-600 py-2">${escapeHtml(err.message)}</p>`;
      }
    }
    function downloadBlob(blob, name) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 60000);
    }
    function closeFileViewer() {
      const v = document.getElementById('file-viewer');
      if (v) v.remove();
      document.removeEventListener('keydown', fileViewerKey, true);
    }
    function fileViewerKey(e) {
      if (e.key === 'Escape') { e.stopPropagation(); closeFileViewer(); }
    }
    // 열기: 화면 위에 크게 띄워서 봄 (새 창은 Google Sites 안에서 막힐 수 있어서 안 씀). 볼 수 없는 형식은 바로 받기
    async function openStoredFile(fileId) {
      const a = storedFiles.get(fileId);
      if (!a) return;
      const kind = storedViewKind(a);
      if (!kind) {
        try { downloadBlob(await fetchStoredFile(fileId), a.name); }
        catch (err) { showToast(`"${a.name}"을(를) 받지 못했습니다: ${err.message}`, 'error'); }
        return;
      }
      closeFileViewer();
      const v = document.createElement('div');
      v.id = 'file-viewer';
      v.className = 'fixed inset-0 z-[70] bg-slate-900/80 flex flex-col p-2 sm:p-6';
      v.innerHTML = `
        <div class="flex items-center gap-2 text-white mb-2 min-w-0">
          <i data-lucide="${attachIcon(a)}" class="w-4 h-4 shrink-0"></i>
          <span class="font-semibold text-sm truncate">${escapeHtml(a.name)}</span>
          <span class="text-xs text-slate-300 shrink-0">${formatBytes(a.size)}</span>
          <button type="button" id="file-viewer-dl" class="ml-auto inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-xs font-semibold shrink-0"><i data-lucide="download" class="w-3.5 h-3.5"></i>받기</button>
          <button type="button" onclick="closeFileViewer()" class="p-1.5 rounded-lg hover:bg-white/15 shrink-0" title="닫기 (Esc)"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div id="file-viewer-body" class="flex-1 min-h-0 rounded-xl bg-white overflow-hidden flex items-center justify-center text-sm text-slate-400">불러오는 중...</div>`;
      v.addEventListener('click', e => { if (e.target === v) closeFileViewer(); });
      document.body.appendChild(v);
      document.addEventListener('keydown', fileViewerKey, true);
      lucide.createIcons();
      try {
        const blob = await fetchStoredFile(fileId);
        if (!document.body.contains(v)) return;
        document.getElementById('file-viewer-dl').onclick = () => downloadBlob(blob, a.name);
        const body = document.getElementById('file-viewer-body');
        const text = kind === 'html' || kind === 'text' ? await blob.text() : '';
        const url = URL.createObjectURL(blob);
        if (kind === 'image') body.innerHTML = `<img src="${url}" alt="" class="max-w-full max-h-full object-contain" />`;
        else if (kind === 'pdf') body.innerHTML = `<iframe src="${url}" class="w-full h-full"></iframe>`;
        else if (kind === 'text') body.innerHTML = `<pre class="w-full h-full overflow-auto p-4 text-xs text-slate-800 whitespace-pre-wrap">${escapeHtml(text)}</pre>`;
        else body.innerHTML = `<iframe sandbox srcdoc="${escapeHtml(sandboxedHtml(text))}" class="w-full h-full bg-white"></iframe>`;
      } catch (err) {
        const body = document.getElementById('file-viewer-body');
        if (body) body.innerHTML = `<p class="text-rose-600 px-4">${escapeHtml(err.message)}</p>`;
      }
    }

    // --- 올리기 전에 파일 줄이기 ---
    function loadScriptOnce(src) {
      loadScriptOnce.cache = loadScriptOnce.cache || {};
      if (!loadScriptOnce.cache[src]) {
        loadScriptOnce.cache[src] = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = () => { delete loadScriptOnce.cache[src]; reject(new Error('변환 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.')); };
          document.head.appendChild(s);
        });
      }
      return loadScriptOnce.cache[src];
    }
    function canvasToBlob(canvas, type, quality) {
      return new Promise(resolve => canvas.toBlob(resolve, type, quality));
    }
    // 사진을 긴 변 maxSide 이하, WebP(안 되면 JPEG)로 줄임. 2MB 안에 들 때까지 조금씩 더 줄임
    async function shrinkImage(blob, maxSide, limit) {
      const img = await createImageBitmap(blob);
      let scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      let quality = 0.82;
      let out = null;
      for (let step = 0; step < 6; step++) {
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        out = await canvasToBlob(canvas, 'image/webp', quality);
        if (!out || out.type !== 'image/webp') out = await canvasToBlob(canvas, 'image/jpeg', quality);
        if (out.size <= limit) break;
        scale *= 0.8; quality = Math.max(0.5, quality - 0.08);
      }
      img.close && img.close();
      return out;
    }
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result).split(',')[1] || '');
        r.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
        r.readAsDataURL(blob);
      });
    }
    async function gzipBlob(blob) {
      if (typeof CompressionStream !== 'function') return null;
      return new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();
    }
    const baseName = name => name.replace(/\.[^.]+$/, '');
    // Word(.docx) → 한 장짜리 HTML. 글·표·목록·그림은 남기고, 그림은 줄여서 안에 넣음
    async function docxToHtml(file) {
      await loadScriptOnce(MAMMOTH_URL);
      const convertImage = window.mammoth.images.imgElement(async image => {
        const b64 = await image.read('base64');
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const raw = new Blob([bytes], { type: image.contentType });
        try {
          const small = await shrinkImage(raw, DOC_IMAGE_MAX_SIDE, 300 * 1024);
          return { src: 'data:' + small.type + ';base64,' + await blobToBase64(small) };
        } catch (e) {
          return { src: 'data:' + image.contentType + ';base64,' + b64 }; // 줄일 수 없는 그림(EMF 등)은 그대로
        }
      });
      const result = await window.mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() }, {
        convertImage,
        styleMap: ["p[style-name='Title'] => h1.doc-title:fresh", "p[style-name='제목'] => h1.doc-title:fresh", "p[style-name='Subtitle'] => p.doc-subtitle:fresh"]
      });
      const title = escapeHtml(baseName(file.name));
      return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${title}</title><style>
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;line-height:1.7;color:#1e293b;max-width:860px;margin:0 auto;padding:24px}
img{max-width:100%;height:auto}table{border-collapse:collapse;margin:12px 0}td,th{border:1px solid #cbd5e1;padding:4px 8px;vertical-align:top}
h1,h2,h3{line-height:1.35}p{margin:6px 0}.doc-title{font-size:1.9em;border-bottom:2px solid #e2e8f0;padding-bottom:6px}.doc-subtitle{color:#64748b}
</style></head><body>${result.value}</body></html>`;
    }
    const ALREADY_PACKED = /^(image|video|audio)\/|zip|compressed|x-7z|rar|\.(docx|xlsx|pptx|hwpx|zip|7z|rar|jpe?g|png|webp|gif|mp4|mov)$/i;
    // 올릴 수 있게 줄인 결과 { name, mimeType, blob, encoding, originalSize }
    async function prepareUpload(file, onStage) {
      const originalSize = file.size;
      let name = file.name, mimeType = file.type || 'application/octet-stream', blob = file;
      const ext = (/\.([^.]+)$/.exec(name) || [])[1] || '';
      if (/^image\/(jpeg|png|webp|bmp)$/.test(mimeType)) {
        onStage('사진 줄이는 중...');
        const small = await shrinkImage(file, IMAGE_MAX_SIDE, UPLOAD_MAX_BYTES);
        if (small && (small.size < file.size || file.size > UPLOAD_MAX_BYTES)) {
          blob = small; mimeType = small.type;
          name = baseName(name) + (small.type === 'image/webp' ? '.webp' : '.jpg');
        }
      } else if (/^docx$/i.test(ext)) {
        onStage('Word → HTML 변환 중...');
        blob = new Blob([await docxToHtml(file)], { type: 'text/html' });
        mimeType = 'text/html'; name = baseName(name) + '.html';
      } else if (/^html?$/i.test(ext)) {
        mimeType = 'text/html';
      }
      let encoding = '';
      if (!ALREADY_PACKED.test(mimeType) && !ALREADY_PACKED.test('.' + ext)) {
        onStage('압축 중...');
        const gz = await gzipBlob(blob);
        if (gz && gz.size < blob.size * 0.95) { blob = gz; encoding = 'gzip'; }
      }
      return { name, mimeType, blob, encoding, originalSize };
    }

    function renderAttachmentEditorShell() {
      return `
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">첨부 (파일·링크)</label>

          <div class="flex flex-wrap items-center gap-2 mt-2">

    function renderAttachmentEditorItems() {
      if (!poolDraft.length) return '<p class="text-xs text-slate-400">첨부 없음</p>';
      return poolDraft.map((a, i) => `
        <div class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg border ${a.uploading ? 'border-indigo-100 bg-indigo-50/50' : 'border-slate-200 bg-white'} min-w-0">
          <i data-lucide="${a.uploading ? 'loader-circle' : attachIcon(a)}" class="w-4 h-4 shrink-0 ${a.uploading ? 'text-indigo-500 animate-spin' : a.kind === 'file' ? 'text-indigo-500' : 'text-slate-400'}"></i>
          <span class="text-sm text-slate-800 truncate">${escapeHtml(a.name)}</span>

    }

    function refreshPoolAttachEditor() {

    // 파일을 줄여서 팀 시트에 올리고 target 목록에 첨부로 넣음 (올리는 동안은 uploading 표시)
    async function uploadFilesInto(target, input, refresh) {
      const files = Array.from(input.files || []);
      input.value = '';
      if (!files.length) return;
      if (!authOn() || !auth.session) {
        return showToast('파일 올리기는 팀 서버에 로그인했을 때만 됩니다. 지금은 링크 추가를 이용해 주세요.', 'error');
      }
      for (const file of files) {
        if (file.size > READ_MAX_MB * 1024 * 1024) {
          showToast(`"${file.name}"은(는) 너무 큽니다. Drive에 올리고 링크로 붙여 주세요.`, 'error');
          continue;
        }
        const slot = { name: file.name, url: '', kind: 'file', mimeType: file.type, size: file.size, uploading: true, stage: '준비 중...' };
        target.push(slot);
        refresh();
        try {
          const ready = await prepareUpload(file, stage => { slot.stage = stage; refresh(); });
          if (ready.blob.size > UPLOAD_MAX_BYTES) {
            throw new Error(`줄여도 ${formatBytes(ready.blob.size)}라서 ${UPLOAD_MAX_MB}MB를 넘습니다. Drive에 올리고 링크로 붙여 주세요.`);
          }
          slot.stage = '올리는 중...'; refresh();
          const data = await blobToBase64(ready.blob);
          const res = await postAuth({ action: 'upload', session: auth.session, name: ready.name, mimeType: ready.mimeType, data, encoding: ready.encoding, originalSize: ready.originalSize });
          if (!res || !res.ok) {
            if (res && handleAuthError(res)) return;
            throw new Error((res && res.error) || '올리기 실패');
          }
          Object.assign(slot, { name: res.file.name, fileId: res.file.fileId, url: '', mimeType: res.file.mimeType, size: res.file.size, originalSize: res.file.originalSize });
          delete slot.uploading; delete slot.stage;
          if (slot.originalSize > slot.size * 1.1) showToast(`"${file.name}" ${formatBytes(slot.originalSize)} → ${formatBytes(slot.size)}로 줄여 올렸습니다.`, 'success');
        } catch (err) {
          const i = target.indexOf(slot);
          if (i !== -1) target.splice(i, 1);
          showToast(`"${file.name}" 올리기 실패: ${err.message}`, 'error');
        }
        refresh();
      }
    }

    // ---- 출장 계획 화면·창
    function canEditTrips() { return isAdmin(); }
    function tripSitesSorted() {
      return [...state.tripSites].sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
    }
    function tripSite(id) {
      return state.tripSites.find(s => s.id === id) || { id: '', name: '사이트 없음', color: 'gray' };
    }
    function tripColor(site) { return TRIP_COLORS[site.color] || TRIP_COLORS.gray; }
    function tripPersonKey(p) { return p.memberId ? 'm:' + p.memberId : 'p:' + p.person; }
    function tripPersonName(p) { return p.memberId ? getMember(p.memberId).name : p.person; }
    function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000) + 1; }
    function tripsInYear(year) {
      const from = `${year}-01-01`, to = `${year}-12-31`;
      return state.tripPlans.filter(p => p.start && p.end && p.start <= to && p.end >= from);
    }
    // 날짜 → 표에서의 위치(0~12, 달 칸 기준: 1월 칸 = 0~1)
    function tripPos(dateStr, year, endOfDay) {
      const d = parseYmd(dateStr);
      if (d.getFullYear() < year) return 0;
      if (d.getFullYear() > year) return 12;
      const dim = new Date(year, d.getMonth() + 1, 0).getDate();
      return d.getMonth() + (d.getDate() - (endOfDay ? 0 : 1)) / dim;
    }
    // 막대 끝 날짜 표시: 같은 해면 "10/1", 다른 해면 "26/11/10"
    function tripDateLabel(dateStr, year) {
      const d = parseYmd(dateStr);
      const md = `${d.getMonth() + 1}/${d.getDate()}`;
      return d.getFullYear() === year ? md : `${String(d.getFullYear()).slice(2)}/${md}`;
    }
    function tripDaysInYear(p, year) {
      const s = p.start < `${year}-01-01` ? `${year}-01-01` : p.start;
      const e = p.end > `${year}-12-31` ? `${year}-12-31` : p.end;
      return e >= s ? daysBetween(s, e) : 0;
    }
    // 겹치는 출장은 줄을 나눠서 그림
    function tripLanes(list) {
      const lanes = [];
      [...list].sort((a, b) => a.start.localeCompare(b.start)).forEach(p => {
        let i = lanes.findIndex(end => end < p.start);
        if (i === -1) { i = lanes.length; lanes.push(''); }
        lanes[i] = p.end;
        p._lane = i;
      });
      return Math.max(1, lanes.length);
    }
    function setTripYear(delta) {
      state.tripYear = (Number(state.tripYear) || parseYmd(TODAY).getFullYear()) + delta;
      renderAll();
    }

    function renderTrips() {
      const year = Number(state.tripYear) || parseYmd(TODAY).getFullYear();
      const sites = tripSitesSorted();
      const plans = tripsInYear(year).map(p => ({ ...p }));
      const editable = canEditTrips();

      // 줄: 팀원 전체(순서대로) + 팀원이 아닌 사람(기타)
      const rows = state.members.filter(m => !m.tripExempt || plans.some(p => p.memberId === m.id)).map(m => ({ key: 'm:' + m.id, memberId: m.id, name: m.name, visa: m.visa || '', role: m.role }));
      [...new Set(plans.filter(p => !p.memberId && p.person).map(p => p.person))].sort()
        .forEach(name => rows.push({ key: 'p:' + name, memberId: '', name, visa: '', role: '기타' }));

      const monthOn = (p, mo) => p.start <= `${year}-${pad2(mo)}-31` && p.end >= `${year}-${pad2(mo)}-01`;
      const todayPos = parseYmd(TODAY).getFullYear() === year ? tripPos(TODAY, year, false) + 0.5 / 30 : -1;
      const grid = MONTHS.map(mo => `<div class="flex-1 border-r border-slate-100 last:border-r-0 ${mo % 2 ? '' : 'bg-slate-50/60'}"></div>`).join('');

      const bodyRows = rows.map(r => {
        const mine = plans.filter(p => tripPersonKey(p) === r.key);
        const laneCount = tripLanes(mine);
        const h = laneCount * 26 + 8;
        const bars = mine.map(p => {
          const site = tripSite(p.siteId);
          const c = tripColor(site);
          const left = tripPos(p.start, year, false) / 12 * 100;
          const right = tripPos(p.end, year, true) / 12 * 100;
          const width = Math.max(0.6, right - left);
          const s = tripDateLabel(p.start, year), e = tripDateLabel(p.end, year);
          const tip = `${tripPersonName(p)} · ${site.name}\n${p.start} ~ ${p.end} (${daysBetween(p.start, p.end)}일)${p.note ? '\n' + p.note : ''}`;
          // 넓으면 출발일·사이트·복귀일, 좁으면 날짜만 (사이트는 색과 마우스 설명으로)
          const label = width > 14 ? `<span>${s}</span><span class="truncate px-1 opacity-80">${escapeHtml(site.name)}</span><span>${e}</span>`
            : width > 5.5 ? `<span>${s}</span><span>${e}</span>`
            : width > 2.5 ? `<span>${s}</span>` : '';
          return `<button type="button" onclick="event.stopPropagation(); openTripModal('${p.id}')" title="${escapeHtml(tip)}"
            class="absolute h-[22px] rounded-md text-[10px] font-bold flex items-center justify-between px-1.5 gap-1 overflow-hidden whitespace-nowrap shadow-sm hover:ring-2 hover:ring-slate-900/40"
            style="left:${left}%;width:${width}%;top:${4 + p._lane * 26}px;background:${c.bg};color:${c.fg}">${label}</button>`;
        }).join('');
        const count = mine.length;
        const days = mine.reduce((sum, p) => sum + tripDaysInYear(p, year), 0);
        const notes = mine.filter(p => p.note).map(p => p.note).join(' / ');
        return `
          <tr class="border-t border-slate-100 group">
            <td class="sticky left-0 z-10 bg-white group-hover:bg-slate-50 px-3 py-1.5 text-sm font-semibold text-slate-800 whitespace-nowrap border-r border-slate-100">${escapeHtml(r.name)}</td>
            <td class="px-2 py-1.5 text-xs text-center text-slate-600 whitespace-nowrap">${escapeHtml(r.visa || '-')}</td>
            <td class="px-2 py-1.5 text-xs text-center text-slate-500 whitespace-nowrap border-r border-slate-100">${escapeHtml(r.role)}</td>
            <td colspan="12" class="p-0 align-top">
              <div class="relative ${editable ? 'cursor-copy' : ''}" style="height:${h}px" ${editable ? `onclick="tripTimelineClick(event, '${escapeHtml(r.memberId)}', '${escapeHtml(r.memberId ? '' : r.name)}')" title="빈 곳을 누르면 이 날짜로 출장 추가"` : ''}>
                <div class="absolute inset-0 flex pointer-events-none">${grid}</div>
                ${todayPos >= 0 ? `<div class="absolute top-0 bottom-0 w-px bg-rose-500/70 pointer-events-none" style="left:${todayPos / 12 * 100}%"></div>` : ''}
                ${bars}
              </div>
            </td>
            <td class="px-2 py-1.5 text-xs text-center font-semibold text-slate-700 border-l border-slate-100">${count || ''}</td>
            <td class="px-2 py-1.5 text-xs text-center text-slate-700">${days ? days + '일' : ''}</td>
            <td class="px-3 py-1.5 text-[11px] text-slate-600 min-w-[220px] max-w-[320px]"><span class="line-clamp-2" title="${escapeHtml(notes)}">${escapeHtml(notes)}</span></td>
          </tr>`;
      }).join('');

      // 표 아래: 이 표에서 센 출장 인원 + 관리자가 입력한 월별 인력 현황
      const teamAbroad = MONTHS.map(mo => new Set(plans.filter(p => monthOn(p, mo)).map(tripPersonKey)).size);
      const staff = state.tripStaffing.find(s => s.year === year);
      const footRow = (label, values, opts = {}) => {
        const nums = values.filter(v => v !== null && v !== undefined);
        const sum = nums.reduce((a, b) => a + b, 0);
        return `
          <tr class="border-t ${opts.strong ? 'border-slate-300 bg-slate-700 text-white' : 'border-slate-200 bg-slate-50'}">
            <td colspan="3" class="sticky left-0 z-10 ${opts.strong ? 'bg-slate-700' : 'bg-slate-50'} px-3 py-1.5 text-xs font-bold whitespace-nowrap border-r ${opts.strong ? 'border-slate-600' : 'border-slate-200'}">${label}</td>
            ${values.map(v => `<td class="px-1 py-1.5 text-xs text-center tabular-nums">${v === null || v === undefined ? '' : v}</td>`).join('')}
            <td class="px-2 py-1.5 text-xs text-center font-bold tabular-nums" title="합계">${nums.length ? sum : ''}</td>
            <td class="px-2 py-1.5 text-xs text-center tabular-nums" title="월평균">${nums.length ? Math.round(sum / nums.length) : ''}</td>
            <td class="px-3 py-1.5 text-[11px] ${opts.strong ? 'text-slate-300' : 'text-slate-400'}">${opts.note || ''}</td>
          </tr>`;
      };
      const staffRows = TRIP_STAFF_ROWS.map((r, i) => footRow(r.label, staff ? staff.rows[r.key] : MONTHS.map(() => null), { strong: i === TRIP_STAFF_ROWS.length - 1 })).join('');

      const legend = sites.length
        ? sites.map(s => { const c = tripColor(s); return `<span class="inline-flex items-center px-2 py-1 rounded-md text-[11px] font-bold" style="background:${c.bg};color:${c.fg}">${escapeHtml(s.name)}</span>`; }).join('')
        : `<span class="text-xs text-slate-400">등록된 사이트가 없습니다.${editable ? ' [사이트 관리]에서 먼저 추가하세요.' : ''}</span>`;

      return `
        <div class="space-y-4">
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-2">
                <button type="button" onclick="setTripYear(-1)" class="p-1.5 rounded-lg border border-slate-200 hover:bg-slate-50" title="이전 해"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <h3 class="text-lg font-bold text-slate-900 tabular-nums">${year}년 출장 계획</h3>
                <button type="button" onclick="setTripYear(1)" class="p-1.5 rounded-lg border border-slate-200 hover:bg-slate-50" title="다음 해"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                ${year !== parseYmd(TODAY).getFullYear() ? `<button type="button" onclick="state.tripYear=${parseYmd(TODAY).getFullYear()}; renderAll()" class="px-2 py-1 rounded-lg text-xs font-semibold text-indigo-600 hover:bg-indigo-50">올해</button>` : ''}
                <span class="text-xs text-slate-500 ml-1">${year}년 계획 ${plans.length}건</span>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button type="button" onclick="exportTripsExcel()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold"><i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>엑셀로 내보내기</button>
              ${editable ? `
                <button type="button" onclick="openTripSitesModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i>사이트 관리</button>
                <button type="button" onclick="openTripStaffingModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold"><i data-lucide="table-2" class="w-3.5 h-3.5"></i>월별 인력 입력</button>
                <button type="button" onclick="openTripModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold"><i data-lucide="plus" class="w-3.5 h-3.5"></i>출장 추가</button>
              ` : '<span class="text-[11px] text-slate-400">출장 계획은 관리자가 입력합니다.</span>'}
              </div>
            </div>
            <div class="flex flex-wrap gap-1.5">${legend}</div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
            <table class="w-full min-w-[1180px] border-collapse table-fixed">
              <colgroup><col class="w-[88px]"><col class="w-[52px]"><col class="w-[52px]">${MONTHS.map(() => '<col>').join('')}<col class="w-[52px]"><col class="w-[60px]"><col class="w-[240px]"></colgroup>
              <thead>
                <tr class="bg-slate-50 text-[11px] font-bold text-slate-600">
                  <th class="sticky left-0 z-10 bg-slate-50 px-3 py-2 text-left border-r border-slate-200">이름</th>
                  <th class="px-1 py-2">비자</th>
                  <th class="px-1 py-2 border-r border-slate-200">직급</th>
                  ${MONTHS.map(mo => `<th class="py-2 border-r border-slate-100 last:border-r-0 ${parseYmd(TODAY).getFullYear() === year && parseYmd(TODAY).getMonth() + 1 === mo ? 'text-rose-600' : ''}">${mo}월</th>`).join('')}
                  <th class="px-1 py-2 border-l border-slate-200" title="올해 출장 횟수">횟수</th>
                  <th class="px-1 py-2" title="올해 안에 든 출장 일수 합계">일수</th>
                  <th class="px-3 py-2 text-left">비고</th>
                </tr>
              </thead>
              <tbody>${bodyRows || '<tr><td colspan="18" class="py-10 text-center text-sm text-slate-400">등록된 팀원이 없습니다.</td></tr>'}</tbody>
              <tfoot class="text-slate-700">
                ${footRow('우리 팀 출장 인원', teamAbroad, { note: '위 표에서 자동 계산' })}
                ${staffRows}
              </tfoot>
            </table>
          </div>
          <p class="text-[11px] text-slate-400">막대를 누르면 내용을 보고 고칠 수 있습니다.${editable ? ' 팀원 줄의 빈 곳을 누르면 그 날짜로 출장을 추가합니다.' : ''} 오른쪽 두 칸은 아래 인력 표에서 각각 합계·월평균입니다.</p>
        </div>`;
    }

    function tripTimelineClick(e, memberId, person) {
      const box = e.currentTarget.getBoundingClientRect();
      const x = Math.min(0.9999, Math.max(0, (e.clientX - box.left) / box.width)) * 12;
      const year = Number(state.tripYear);
      const mo = Math.floor(x);
      const dim = new Date(year, mo + 1, 0).getDate();
      const day = Math.min(dim, Math.floor((x - mo) * dim) + 1);
      openTripModal('', { memberId, person, start: `${year}-${pad2(mo + 1)}-${pad2(day)}` });
    }

    function openTripModal(id = '', preset = {}) {
      const item = id ? state.tripPlans.find(p => p.id === id) : null;
      const editable = canEditTrips();
      if (!item && !editable) return;
      const sites = tripSitesSorted();
      if (!item && !sites.length) { openTripSitesModal(); return showToast('먼저 출장 사이트를 추가해 주세요.', 'info'); }
      const v = item || { memberId: preset.memberId || '', person: preset.person || '', siteId: sites[0].id, start: preset.start || TODAY, end: preset.start ? addDays(preset.start, 29) : addDays(TODAY, 29), note: '' };
      if (!editable) {
        const site = tripSite(v.siteId);
        const c = tripColor(site);
        return openModal('출장 계획', `
          <div class="space-y-3 text-sm">
            <p class="text-base font-bold text-slate-900">${escapeHtml(tripPersonName(v))}</p>
            <p><span class="inline-flex px-2 py-1 rounded-md text-xs font-bold" style="background:${c.bg};color:${c.fg}">${escapeHtml(site.name)}</span></p>
            <p class="text-slate-700">${v.start} ~ ${v.end} <span class="text-slate-400">(${daysBetween(v.start, v.end)}일)</span></p>
            ${v.note ? `<p class="p-3 rounded-lg bg-slate-50 text-slate-700 whitespace-pre-wrap">${escapeHtml(v.note)}</p>` : ''}
            <p class="text-[11px] text-slate-400">출장 계획은 관리자만 고칠 수 있습니다.</p>
          </div>`);
      }
      const other = !v.memberId && !!v.person;
      openModal(item ? '출장 계획 수정' : '출장 추가', `
        <form onsubmit="saveTrip(event, '${id}')" class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">인원 *</label>
              <select name="memberId" onchange="document.getElementById('trip-person-wrap').classList.toggle('hidden', this.value !== '__other')" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                ${workMembers([v.memberId]).map(m => `<option value="${m.id}" ${v.memberId === m.id ? 'selected' : ''}>${escapeHtml(m.name)} ${escapeHtml(m.role)}</option>`).join('')}
                <option value="__other" ${other ? 'selected' : ''}>기타 (직접 입력)</option>
              </select>
              <div id="trip-person-wrap" class="${other ? '' : 'hidden'} mt-2">
                <input name="person" value="${escapeHtml(v.person || '')}" maxlength="30" placeholder="이름 (예: 협력업체 홍길동)" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">사이트 *</label>
              <select name="siteId" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                ${sites.map(s => `<option value="${s.id}" ${v.siteId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">출발일 *</label>
              <input required type="date" name="start" value="${escapeHtml(v.start)}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">복귀일 *</label>
              <input required type="date" name="end" value="${escapeHtml(v.end)}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">비고</label>
            <input name="note" value="${escapeHtml(v.note || '')}" maxlength="300" placeholder="예: 2공장 음극 3호기 포일비전 추가" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div class="flex items-center justify-between pt-2">
            ${item ? `<button type="button" onclick="deleteItem('tripPlans', '${item.id}')" class="px-3 py-2 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50">삭제</button>` : '<div></div>'}
            <div class="flex gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">취소</button>
              <button type="submit" class="px-4 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">저장</button>
            </div>
          </div>
        </form>`);
    }

    function saveTrip(e, id) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const sel = fd.get('memberId');
      const person = sel === '__other' ? (fd.get('person') || '').trim().slice(0, 30) : '';
      if (sel === '__other' && !person) return showToast('기타 인원의 이름을 넣어 주세요.', 'error');
      const start = fd.get('start'), end = fd.get('end');
      if (!DATE_RE.test(start) || !DATE_RE.test(end)) return showToast('출발일과 복귀일을 넣어 주세요.', 'error');
      if (end < start) return showToast('복귀일이 출발일보다 빠릅니다.', 'error');
      const data = {
        id: id || uid('t'), memberId: sel === '__other' ? '' : sel, person, siteId: fd.get('siteId'),
        start, end, note: (fd.get('note') || '').trim().slice(0, 300)
      };
      if (saveItem('tripPlans', data, 'end', '출장 계획이 저장되었습니다.')) {
        const y = parseYmd(start).getFullYear();
        if (y !== Number(state.tripYear) && parseYmd(end).getFullYear() !== Number(state.tripYear)) { state.tripYear = y; renderAll(); }
      }
    }

    // --- 출장 계획 엑셀(.xlsx) 내보내기: 화면 표와 같은 모양(달 칸에 사이트 색) + 출장 목록 시트 ---
    const EXCELJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    const xlsArgb = hex => 'FF' + hex.replace('#', '').toUpperCase();
    async function exportTripsExcel() {
      const year = Number(state.tripYear) || parseYmd(TODAY).getFullYear();
      showToast('엑셀 파일을 만드는 중입니다...', 'info');
      try {
        await loadScriptOnce(EXCELJS_URL);
        const wb = new window.ExcelJS.Workbook();
        wb.creator = 'TeamHub';
        const ws = wb.addWorksheet(`${year} 출장계획`, { views: [{ state: 'frozen', xSplit: 3, ySplit: 3 }] });
        const thin = { style: 'thin', color: { argb: 'FFD0D5DD' } };
        const border = { top: thin, left: thin, bottom: thin, right: thin };
        const fill = hex => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: xlsArgb(hex) } });
        const sites = tripSitesSorted();
        const plans = tripsInYear(year);

        // 1줄: 제목, 2줄: 사이트 범례
        ws.mergeCells(1, 1, 1, 18);
        Object.assign(ws.getCell(1, 1), { value: `${year}년 출장 계획`, font: { bold: true, size: 14 } });
        ws.getCell(2, 1).value = '사이트';
        ws.getCell(2, 1).font = { bold: true };
        sites.forEach((s, i) => {
          const c = ws.getCell(2, 4 + i);
          const col = tripColor(s);
          Object.assign(c, { value: s.name, fill: fill(col.bg), font: { bold: true, size: 9, color: { argb: xlsArgb(col.fg) } }, alignment: { horizontal: 'center', vertical: 'middle', shrinkToFit: true }, border });
        });
        // 3줄: 머리글
        const head = ['이름', '보유비자', '직급', ...MONTHS.map(m => m + '월'), '출장 횟수', '출장 일수', '비고'];
        head.forEach((h, i) => Object.assign(ws.getCell(3, i + 1), { value: h, font: { bold: true }, fill: fill('#f1f5f9'), alignment: { horizontal: 'center', vertical: 'middle' }, border }));

        // 팀원 줄 (화면과 같은 사람·순서)
        const rows = state.members.filter(m => !m.tripExempt || plans.some(p => p.memberId === m.id))
          .map(m => ({ key: 'm:' + m.id, name: m.name, visa: m.visa || '', role: m.role }));
        [...new Set(plans.filter(p => !p.memberId && p.person).map(p => p.person))].sort()
          .forEach(name => rows.push({ key: 'p:' + name, name, visa: '', role: '기타' }));
        let r = 4;
        rows.forEach(row => {
          const mine = plans.filter(p => tripPersonKey(p) === row.key).sort((a, b) => a.start.localeCompare(b.start));
          ws.getCell(r, 1).value = row.name;
          ws.getCell(r, 2).value = row.visa || '-';
          ws.getCell(r, 3).value = row.role;
          MONTHS.forEach((mo, i) => {
            const cell = ws.getCell(r, 4 + i);
            const from = `${year}-${pad2(mo)}-01`, to = `${year}-${pad2(mo)}-31`;
            const here = mine.filter(p => p.start <= to && p.end >= from);
            if (!here.length) return;
            const p = here[0];
            const col = tripColor(tripSite(p.siteId));
            // 출발한 달엔 출발일, 복귀하는 달엔 복귀일 (엑셀 원본처럼)
            const labels = here.map(x => {
              const startHere = x.start >= from && x.start <= to;
              const endHere = x.end >= from && x.end <= to;
              const showStart = startHere || (mo === 1 && x.start < from); // 1월 칸엔 지난해 출발일도
              const showEnd = endHere || (mo === 12 && x.end > to);         // 12월 칸엔 다음 해 복귀일도
              const sl = tripDateLabel(x.start, year), el = tripDateLabel(x.end, year);
              return showStart && showEnd ? `${sl}~${el}` : showStart ? sl : showEnd ? el : '';
            }).filter(Boolean);
            Object.assign(cell, { value: labels.join(', ') || null, fill: fill(col.bg), font: { size: 9, bold: true, color: { argb: xlsArgb(col.fg) } }, alignment: { horizontal: 'center', vertical: 'middle', shrinkToFit: true } });
            cell.note = here.map(x => `${tripSite(x.siteId).name} ${x.start} ~ ${x.end}`).join('\n');
          });
          ws.getCell(r, 16).value = mine.length || null;
          ws.getCell(r, 17).value = mine.reduce((sum, p) => sum + tripDaysInYear(p, year), 0) || null;
          ws.getCell(r, 18).value = mine.filter(p => p.note).map(p => p.note).join(' / ') || null;
          r++;
        });

        // 아래: 우리 팀 출장 인원 + 월별 인력 (합계·월평균)
        const staff = state.tripStaffing.find(s => s.year === year);
        const teamAbroad = MONTHS.map(mo => new Set(plans.filter(p => p.start <= `${year}-${pad2(mo)}-31` && p.end >= `${year}-${pad2(mo)}-01`).map(tripPersonKey)).size);
        const footer = [['우리 팀 출장 인원', teamAbroad], ...TRIP_STAFF_ROWS.map(x => [x.label, staff ? staff.rows[x.key] : MONTHS.map(() => null)])];
        footer.forEach(([label, vals], i) => {
          ws.mergeCells(r, 1, r, 3);
          ws.getCell(r, 1).value = label;
          vals.forEach((v, j) => { ws.getCell(r, 4 + j).value = v === null || v === undefined ? null : v; });
          const nums = vals.filter(v => v !== null && v !== undefined);
          ws.getCell(r, 16).value = nums.length ? nums.reduce((a, b) => a + b, 0) : null;
          ws.getCell(r, 17).value = nums.length ? Math.round(nums.reduce((a, b) => a + b, 0) / nums.length) : null;
          ws.getCell(r, 18).value = i === 0 ? '합계 · 월평균' : null;
          const last = i === footer.length - 1;
          for (let c = 1; c <= 18; c++) {
            const cell = ws.getCell(r, c);
            cell.fill = fill(last ? '#334155' : '#f8fafc');
            cell.font = { bold: c <= 3 || c === 16, color: { argb: last ? 'FFFFFFFF' : 'FF334155' } };
            cell.alignment = { horizontal: c <= 3 || c === 18 ? 'left' : 'center', vertical: 'middle' };
          }
          r++;
        });
        for (let rr = 3; rr < r; rr++) for (let c = 1; c <= 18; c++) ws.getCell(rr, c).border = border;
        for (let rr = 4; rr < r; rr++) {
          for (let c = 1; c <= 3; c++) ws.getCell(rr, c).alignment = { horizontal: c === 1 ? 'left' : 'center', vertical: 'middle' };
          ws.getCell(rr, 16).alignment = ws.getCell(rr, 17).alignment = { horizontal: 'center', vertical: 'middle' };
        }
        ws.columns.forEach((col, i) => { col.width = i === 0 ? 11 : i < 3 ? 8 : i < 15 ? 9.5 : i < 17 ? 8 : 44; });
        ws.getRow(2).height = 22;

        // 둘째 시트: 출장 한 건씩
        const ls = wb.addWorksheet('출장 목록', { views: [{ state: 'frozen', ySplit: 1 }] });
        ls.columns = [
          { header: '이름', key: 'name', width: 12 }, { header: '직급', key: 'role', width: 8 }, { header: '사이트', key: 'site', width: 16 },
          { header: '출발일', key: 'start', width: 12 }, { header: '복귀일', key: 'end', width: 12 }, { header: '일수', key: 'days', width: 7 }, { header: '비고', key: 'note', width: 50 }
        ];
        ls.getRow(1).eachCell(c => { c.font = { bold: true }; c.fill = fill('#f1f5f9'); c.border = border; });
        [...plans].sort((a, b) => a.start.localeCompare(b.start) || tripPersonName(a).localeCompare(tripPersonName(b), 'ko')).forEach(p => {
          const site = tripSite(p.siteId);
          const row = ls.addRow({ name: tripPersonName(p), role: p.memberId ? getMember(p.memberId).role : '기타', site: site.name, start: p.start, end: p.end, days: daysBetween(p.start, p.end), note: p.note });
          row.getCell('site').fill = fill(tripColor(site).bg);
          row.eachCell({ includeEmpty: true }, c => { c.border = border; });
        });

        const buf = await wb.xlsx.writeBuffer();
        downloadBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `출장계획_${year}.xlsx`);
        showToast(`출장계획_${year}.xlsx 파일을 내려받았습니다.`, 'success');
      } catch (err) {
        showToast('엑셀 파일을 만들지 못했습니다: ' + err.message, 'error');
      }
    }

    // --- 사이트 관리: 이름·색을 한 화면에서 고치고 한 번에 저장 ---
    let tripSiteDraft = [];
    function openTripSitesModal() {
      if (!canEditTrips()) return;
      tripSiteDraft = tripSitesSorted().map(s => ({ ...s }));
      openModal('출장 사이트 관리', `
        <div class="space-y-3">
          <div id="trip-site-list" class="space-y-2">${renderTripSiteRows()}</div>
          <button type="button" onclick="addTripSiteRow()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-dashed border-slate-300 hover:bg-slate-50 text-xs font-semibold text-slate-600"><i data-lucide="plus" class="w-3.5 h-3.5"></i>사이트 추가</button>
          <p class="text-[11px] text-slate-400">시간대는 해외 출장 중인 팀원에게 일간보고 알림 메일을 현지 17:30에 보낼 때 씁니다. 위에서부터 범례·선택 목록 순서입니다. 출장이 잡혀 있는 사이트를 지우면 그 막대는 회색 '사이트 없음'으로 보입니다.</p>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">취소</button>
            <button type="button" onclick="saveTripSites()" class="px-4 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">저장</button>
          </div>
        </div>`);
      document.getElementById('modal-box').classList.replace('max-w-xl', 'max-w-3xl');
    }
    function renderTripSiteRows() {
      if (!tripSiteDraft.length) return '<p class="text-xs text-slate-400">사이트가 없습니다.</p>';
      return tripSiteDraft.map((s, i) => {
        const c = tripColor(s);
        const used = state.tripPlans.filter(p => p.siteId === s.id).length;
        return `
        <div class="flex items-center gap-2">
          <span class="w-7 h-7 rounded-md shrink-0 border border-black/10" style="background:${c.bg}"></span>
          <input value="${escapeHtml(s.name)}" maxlength="40" oninput="tripSiteDraft[${i}].name = this.value" placeholder="예: 고객사A(오하이오)" class="flex-1 min-w-0 border border-slate-200 rounded-lg px-3 py-1.5 text-sm" />
          <select onchange="tripSiteDraft[${i}].color = this.value; refreshTripSiteRows()" class="border border-slate-200 rounded-lg px-2 py-1.5 text-xs">
            ${TRIP_COLOR_KEYS.map(k => `<option value="${k}" ${s.color === k ? 'selected' : ''}>${TRIP_COLORS[k].label}</option>`).join('')}
          </select>
          <select onchange="tripSiteDraft[${i}].timeZone = this.value" title="현지 시간대 (알림 메일 시각)" class="w-28 sm:w-40 border border-slate-200 rounded-lg px-2 py-1.5 text-xs">
            ${TIME_ZONES.map(z => `<option value="${z.tz}" ${(s.timeZone || '') === z.tz ? 'selected' : ''}>${z.tz ? '🕒 ' : ''}${escapeHtml(z.label)}</option>`).join('')}
          </select>
          <button type="button" onclick="moveTripSiteRow(${i}, -1)" class="p-1 rounded text-slate-400 hover:bg-slate-100 ${i ? '' : 'invisible'}" title="위로"><i data-lucide="arrow-up" class="w-3.5 h-3.5"></i></button>
          <button type="button" onclick="tripSiteDraft.splice(${i}, 1); refreshTripSiteRows()" class="p-1 rounded text-slate-400 hover:bg-rose-50 hover:text-rose-600" title="${used ? `출장 ${used}건에 쓰는 중` : '삭제'}"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
        </div>`;
      }).join('');
    }
    function refreshTripSiteRows() {
      document.getElementById('trip-site-list').innerHTML = renderTripSiteRows();
      lucide.createIcons();
    }
    function addTripSiteRow() {
      const usedColors = tripSiteDraft.map(s => s.color);
      tripSiteDraft.push({ id: uid('ts'), name: '', color: TRIP_COLOR_KEYS.find(k => !usedColors.includes(k)) || 'gray', order: 0, timeZone: '' });
      refreshTripSiteRows();
      const inputs = document.querySelectorAll('#trip-site-list input');
      inputs[inputs.length - 1].focus();
    }
    function moveTripSiteRow(i, d) {
      const j = i + d;
      if (j < 0 || j >= tripSiteDraft.length) return;
      [tripSiteDraft[i], tripSiteDraft[j]] = [tripSiteDraft[j], tripSiteDraft[i]];
      refreshTripSiteRows();
    }
    function saveTripSites() {
      const list = tripSiteDraft.map((s, i) => ({ ...s, name: s.name.trim(), order: i + 1 }));
      if (list.some(s => !s.name)) return showToast('이름이 빈 사이트가 있습니다.', 'error');
      const names = list.map(s => s.name);
      if (new Set(names).size !== names.length) return showToast('이름이 같은 사이트가 있습니다.', 'error');
      const keep = new Set(list.map(s => s.id));
      const ops = state.tripSites.filter(s => !keep.has(s.id)).map(s => ({ op: 'delete', collection: 'tripSites', id: s.id }));
      list.forEach(s => {
        const prev = state.tripSites.find(x => x.id === s.id);
        if (!prev || prev.name !== s.name || prev.color !== s.color || prev.order !== s.order || (prev.timeZone || '') !== (s.timeZone || '')) ops.push({ op: 'upsert', collection: 'tripSites', item: s, position: 'end' });
      });
      if (ops.length && !commit(ops)) return;
      closeModal();
      renderAll();
      showToast('출장 사이트를 저장했습니다.', 'success');
    }

          return raw === '' ? null : Math.max(0, Math.min(9999, Math.round(Number(raw) || 0)));
        });
      });
      saveItem('tripStaffing', { id: 'y' + year, year, rows }, 'end', `${year}년 월별 인력 현황을 저장했습니다.`);

    // =========================================================================
    // 6-1. 연차 사용 합계 (휴가/부재 일정에서 계산: 주말·공휴일 빼고, 제목에 '반차'면 0.5일)
    // =========================================================================
    function isWorkday(d) {
      const dow = parseYmd(d).getDay();
      return dow !== 0 && dow !== 6 && !KR_HOLIDAYS[d];
    }
    function leaveDaysIn(memberId, from, to) {
      const days = new Map(); // 날짜별 한 번만 (일정이 겹쳐도 두 번 세지 않음)
      state.schedules
        .filter(s => s.category === '휴가/부재' && (s.attendeeIds || []).includes(memberId) && s.date <= to && scheduleEnd(s) >= from)
        .forEach(s => {
          const amount = /반차/.test(s.title) ? 0.5 : 1;
          const end = scheduleEnd(s) > to ? to : scheduleEnd(s);
          for (let d = s.date < from ? from : s.date; d <= end; d = addDays(d, 1)) {
            if (isWorkday(d) && scheduleOn(s, d)) days.set(d, Math.max(days.get(d) || 0, amount));
          }
        });
      return [...days.values()].reduce((a, b) => a + b, 0);
    }
    function monthRange(ym) {
      const [y, m] = ym.split('-').map(Number);
      return [`${ym}-01`, `${ym}-${pad2(new Date(y, m, 0).getDate())}`];
    }
    const fmtDays = n => (n ? (Number.isInteger(n) ? n : n.toFixed(1)) + '일' : '-');

    function openLeaveModal(year) {
      year = Number(year) || parseYmd(TODAY).getFullYear();
      const rows = workMembers().map(m => {
        const months = MONTHS.map(mo => leaveDaysIn(m.id, ...monthRange(`${year}-${pad2(mo)}`)));
        return { m, months, total: months.reduce((a, b) => a + b, 0) };
      });
      openModal(`${year}년 연차 사용 현황`, `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">

              <span class="text-sm font-bold text-slate-800 tabular-nums">${year}년</span>
              <button type="button" onclick="openLeaveModal(${year + 1})" class="p-1 rounded-lg border border-slate-200 hover:bg-slate-50"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
            </div>
            <span class="text-[11px] text-slate-400">단위: 일</span>

                <th class="px-2 py-1.5 text-left whitespace-nowrap">이름</th>
                ${MONTHS.map(mo => `<th class="px-1 py-1.5 font-semibold">${mo}월</th>`).join('')}
                <th class="px-2 py-1.5 font-bold text-indigo-700">합계</th>
              </tr></thead>
              <tbody>${rows.map(r => `
                <tr class="border-t border-slate-100">
                  <td class="px-2 py-1.5 font-semibold text-slate-800 whitespace-nowrap">${escapeHtml(r.m.name)} <span class="text-slate-400 font-normal">${escapeHtml(r.m.role)}</span></td>
                  ${r.months.map(v => `<td class="px-1 py-1.5 text-center tabular-nums ${v ? 'text-slate-800' : 'text-slate-300'}">${v ? (Number.isInteger(v) ? v : v.toFixed(1)) : '·'}</td>`).join('')}
                  <td class="px-2 py-1.5 text-center font-bold text-indigo-700 tabular-nums">${r.total ? (Number.isInteger(r.total) ? r.total : r.total.toFixed(1)) : '0'}</td>

          <ul class="text-[11px] text-slate-400 space-y-0.5 list-disc pl-4">
            <li>팀원 상태의 '휴가'와 일정 관리의 '휴가/부재' 일정을 모아 셉니다. 주말·공휴일은 빼고, 제목에 '반차'가 있으면 0.5일로 셉니다.</li>
            <li>휴가를 상태나 일정에 넣지 않으면 숫자에 들어가지 않습니다.</li>

    // =========================================================================
    // 6-2. 월간 보고 (그 달 주간보고를 사람별로 모음 + 출장·연차·프로젝트)
    // =========================================================================
    function setWeeklyView(v) {
      state.weeklyView = v === 'month' ? 'month' : 'week';
      saveUi();
      renderAll();
    }
    function shiftReportMonth(delta) {
      const [y, m] = state.weeklyMonth.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      state.weeklyMonth = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
      renderAll();
    }
    // 그 달 주차 (주간보고 주차 코드는 그 주 월요일이 속한 달 기준)
    function weeksOfMonth(ym) {
      const [from, to] = monthRange(ym);
      const out = [];
      for (let d = addDays(from, -6); d <= to; d = addDays(d, 1)) {
        const info = getWeekInfo(d);
        if (info.code.startsWith(ym + '-W') && !out.some(w => w.code === info.code)) out.push(info);
      }
      return out;
    }
    function monthlyData(ym) {
      const [from, to] = monthRange(ym);
      const weeks = weeksOfMonth(ym);
      const codes = weeks.map(w => w.code);
      const reports = state.weeklyReports.filter(r => codes.includes(r.week));
      const people = state.members.filter(m => !m.reportExempt || reports.some(r => r.authorId === m.id));
      return {
        ym, from, to, weeks,
        rows: people.map(m => {
          const mine = reports.filter(r => r.authorId === m.id).sort((a, b) => a.week.localeCompare(b.week));
          const weekNo = code => code.split('-W')[1] + '주차';
          const projects = [...new Set(mine.map(r => r.projectId).filter(Boolean))].map(getProject).filter(Boolean);
          const trips = state.tripPlans.filter(p => p.memberId === m.id && p.start <= to && p.end >= from)
            .sort((a, b) => a.start.localeCompare(b.start));
          return {
            m, mine,
            done: mine.filter(r => r.completed.trim()).map(r => ({ week: weekNo(r.week), text: plainText(r.completed.trim()) })),
            issues: mine.filter(r => r.blockers.trim() && !NO_BLOCKER_RE.test(r.blockers)).map(r => ({ week: weekNo(r.week), text: plainText(r.blockers.trim()) })),
            next: mine.length ? plainText(mine[mine.length - 1].nextPlan.trim()) : '',
            projects, trips,
            solved: state.issues.filter(i => i.closedAt && i.closedAt >= from && i.closedAt <= to && i.assigneeIds.includes(m.id)),
            leave: leaveDaysIn(m.id, from, to),
            places: (() => {
              const cnt = {};
              state.dailyReports.filter(d => d.authorId === m.id && d.date >= from && d.date <= to && d.workplace)
                .forEach(d => { const k = dailyWorkplaceLabel(d); cnt[k] = (cnt[k] || 0) + 1; });
              return Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${k} ${n}일`).join(' · ');
            })()
          };
        })
      };
    }

              <button type="button" onclick="exportMonthlyExcel()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold"><i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>엑셀로 내보내기</button>
            </div>

              <tbody>${md.rows.map(r => `
                <tr class="border-t border-slate-100">
                  <td class="pr-3 py-1 font-semibold text-slate-700 whitespace-nowrap">${escapeHtml(r.m.name)}</td>
                  ${md.weeks.map(w => r.mine.some(x => x.week === w.code) ? '<td class="px-2 py-1 text-center text-emerald-600 font-bold">✓</td>' : '<td class="px-2 py-1 text-center text-slate-300">·</td>').join('')}
                  <td class="px-2 py-1 text-center text-slate-600">${r.trips.length ? r.trips.length + '건' : '-'}</td>
                  <td class="px-2 py-1 text-center text-slate-600">${fmtDays(r.leave)}</td>
                  <td class="px-2 py-1 text-center text-slate-600">${r.solved.length ? r.solved.length + '건' : '-'}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
        <div class="space-y-4">
          ${md.rows.map(r => `
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
                <div class="flex items-center gap-3">
                  <span class="w-9 h-9 rounded-xl ${r.m.color} text-white text-xs font-bold flex items-center justify-center">${escapeHtml(r.m.initials)}</span>
                  <div>
                    <p class="text-sm font-bold text-slate-900">${escapeHtml(r.m.name)} <span class="text-xs font-medium text-slate-500">${escapeHtml(r.m.role)}</span></p>
                    <p class="text-[11px] text-slate-500">주간보고 ${r.mine.length}/${md.weeks.length}주 · 연차 ${fmtDays(r.leave)}${r.places ? ' · 근무지 ' + escapeHtml(r.places) : ''}${r.projects.length ? ' · ' + r.projects.map(p => `${escapeHtml(p.title)} ${p.progress}%`).join(', ') : ''}</p>
                  </div>
                </div>
                ${r.trips.length ? `<div class="flex flex-wrap gap-1">${r.trips.map(p => { const s = tripSite(p.siteId); const c = tripColor(s); return `<span class="px-2 py-0.5 rounded-md text-[11px] font-bold" style="background:${c.bg};color:${c.fg}">${escapeHtml(s.name)} ${p.start.slice(5).replace('-', '/')}~${p.end.slice(5).replace('-', '/')}</span>`; }).join('')}</div>` : ''}
              </div>
              ${r.solved.length ? `<div class="flex flex-wrap items-center gap-1.5 text-xs"><span class="font-bold text-emerald-700">이번 달 해결한 이슈</span>${r.solved.map(i => `<button type="button" onclick="openIssueModal('${i.id}')" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-emerald-50 border border-emerald-100 text-emerald-800 hover:border-emerald-300">${issueSiteChip(i.siteId)}${escapeHtml(i.title)}</button>`).join('')}</div>` : ''}
              ${r.mine.length ? `
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${cell('이번 달 한 일', 'text-emerald-700', lines(r.done))}
                ${cell('다음 달 계획 (마지막 주 기준)', 'text-indigo-700', r.next ? `<p class="text-xs text-slate-700 whitespace-pre-line leading-relaxed">${escapeHtml(r.next)}</p>` : '<p class="text-xs text-slate-400">없음</p>')}
                ${cell('이슈 및 지원 요청', 'text-amber-700', lines(r.issues))}
              </div>` : '<p class="text-xs text-slate-400">이 달에 낸 주간보고가 없습니다.</p>'}
            </div>`).join('')}
        </div>`;
    }

    function renderWeeklyViewTabs() {
      const v = state.weeklyView === 'month' ? 'month' : 'week';
      const btn = (id, label, icon) => `<button type="button" onclick="setWeeklyView('${id}')" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold ${v === id ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</button>`;
      return `<div class="inline-flex p-1 rounded-xl bg-slate-100 border border-slate-200">${btn('week', '주간 보기', 'list')}${btn('month', '월간 보기', 'calendar-range')}</div>`;
    }

    function copyMonthlyMarkdown() {
      const md = monthlyData(state.weeklyMonth);
      const [y, mo] = md.ym.split('-').map(Number);
      let out = `# ${y}년 ${mo}월 월간 보고\n`;
      md.rows.forEach(r => {
        out += `\n## ${r.m.name} ${r.m.role} (주간보고 ${r.mine.length}/${md.weeks.length}주, 연차 ${fmtDays(r.leave)})\n`;
        if (r.trips.length) out += `- 출장: ${r.trips.map(p => `${tripSite(p.siteId).name} ${p.start}~${p.end}`).join(', ')}\n`;
        if (r.done.length) out += `### 한 일\n${r.done.map(x => `- [${x.week}] ${x.text.replace(/\n/g, ' / ')}`).join('\n')}\n`;
        if (r.next) out += `### 다음 계획\n- ${r.next.replace(/\n/g, ' / ')}\n`;
        if (r.issues.length) out += `### 이슈\n${r.issues.map(x => `- [${x.week}] ${x.text.replace(/\n/g, ' / ')}`).join('\n')}\n`;
        if (r.solved.length) out += `### 해결한 이슈\n${r.solved.map(i => `- [${issueSiteName(i.siteId)}] ${i.title}`).join('\n')}\n`;
      });
      copyTextToClipboard(out, '월간 보고 요약을 복사했습니다.');
    }

    async function exportMonthlyExcel() {
      const md = monthlyData(state.weeklyMonth);
      const [y, mo] = md.ym.split('-').map(Number);
      showToast('엑셀 파일을 만드는 중입니다...', 'info');
      try {
        await loadScriptOnce(EXCELJS_URL);
        const wb = new window.ExcelJS.Workbook();
        const thin = { style: 'thin', color: { argb: 'FFD0D5DD' } };
        const border = { top: thin, left: thin, bottom: thin, right: thin };
        const head = c => { c.font = { bold: true }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF1F5F9' } }; c.border = border; c.alignment = { vertical: 'middle', horizontal: 'center' }; };
        const wrap = { wrapText: true, vertical: 'top' };

        const ws = wb.addWorksheet(`${y}-${pad2(mo)} 월간 요약`, { views: [{ state: 'frozen', ySplit: 2, xSplit: 2 }] });
        ws.mergeCells(1, 1, 1, 9);
        Object.assign(ws.getCell(1, 1), { value: `${y}년 ${mo}월 월간 보고`, font: { bold: true, size: 14 } });
        ws.getRow(2).values = ['이름', '직급', '주간보고', '연차', '출장', '이번 달 한 일', '다음 달 계획', '이슈 및 지원 요청', '관련 프로젝트', '해결한 이슈', '근무지 (일간보고 기준)'];
        ws.getRow(2).eachCell(head);
        md.rows.forEach(r => {
          const row = ws.addRow([
            r.m.name, r.m.role, `${r.mine.length}/${md.weeks.length}주`, r.leave || 0,
            r.trips.map(p => `${tripSite(p.siteId).name} ${p.start.slice(5)}~${p.end.slice(5)}`).join('\n'),
            r.done.map(x => `[${x.week}] ${x.text}`).join('\n'), r.next,
            r.issues.map(x => `[${x.week}] ${x.text}`).join('\n'),
            r.projects.map(p => `${p.title} (${p.progress}%)`).join('\n'),
            r.solved.map(i => `[${issueSiteName(i.siteId)}] ${i.title}`).join('\n'),
            r.places.replace(/ · /g, '\n')
          ]);
          row.eachCell({ includeEmpty: true }, c => { c.border = border; c.alignment = wrap; });
        });
        [10, 7, 9, 6, 22, 60, 40, 36, 28, 32, 18].forEach((w, i) => { ws.getColumn(i + 1).width = w; });

        const raw = wb.addWorksheet('주간보고 원본', { views: [{ state: 'frozen', ySplit: 1 }] });
        raw.getRow(1).values = ['주차', '이름', '관련 프로젝트', '금주 완료 및 진행', '차주 계획', '이슈 및 지원 요청'];
        raw.getRow(1).eachCell(head);

    // --- 일간보고 미작성 알림 메일 (관리자: 켜기·끄기, 받을 사람 미리보기) ---
    const reminder = { enabled: null, loading: false };

    async function fetchReminderStatus(at) {
      const api = getApiEndpoint();

      if (!res || !res.ok) {
        if (res && handleAuthError(res)) throw new Error('로그인이 필요합니다.');

    async function openReminderPreview(at) {

              <button type="button" onclick="openReminderPreview(reminderPreviewAt('Asia/Seoul', 11, 5, true))" class="px-2 py-1 rounded-lg border border-slate-200 hover:bg-slate-50">이번 주 목 한국 11:05</button>
              ${[...new Set(res.plan.map(r => r.tz).filter(tz => tz !== 'Asia/Seoul'))].map(tz => `<button type="button" onclick="openReminderPreview(reminderPreviewAt('${tz}'))" class="px-2 py-1 rounded-lg border border-slate-200 hover:bg-slate-50">오늘 ${escapeHtml(tzLabel(tz))} 17:35</button><button type="button" onclick="openReminderPreview(reminderPreviewAt('${tz}', 11, 5, true))" class="px-2 py-1 rounded-lg border border-slate-200 hover:bg-slate-50">이번 주 목 ${escapeHtml(tzLabel(tz))} 11:05</button>`).join('')}

              <li>해외 출장 시간대는 팀원 상태의 행선지와 [출장 계획 › 사이트 관리]의 시간대를 맞춰 정합니다. 시간대를 모르면 한국 시간으로 보냅니다.</li>

        document.getElementById('modal-box').classList.replace('max-w-xl', 'max-w-3xl');
      } catch (err) {
        document.getElementById('modal-body').innerHTML = `<p class="text-sm text-rose-600 py-6 text-center">${escapeHtml(err.message)}</p>`;

    }
    // 그 시간대의 오늘(thursday면 이번 주 목요일) hh:mm 을 UTC 시각 문자열로
    function reminderPreviewAt(tz, hh = 17, mm = 35, thursday = false) {
      const p = timePartsIn(tz, new Date());
      const dow = new Date(Date.UTC(p.y, p.mo - 1, p.d)).getUTCDay(); // 0=일
      const shift = thursday ? 4 - ((dow + 6) % 7 + 1) : 0;          // 월=1 … 일=7 기준으로 목(4)까지
      const guess = Date.UTC(p.y, p.mo - 1, p.d + shift, hh, mm);
      const q = timePartsIn(tz, new Date(guess));
      const offsetMin = (Date.UTC(q.y, q.mo - 1, q.d, q.h, q.mi) - guess) / 60000;
      return new Date(guess - offsetMin * 60000).toISOString();
    }

    // --- 주간보고 엑셀 내보내기: 주차마다 한 시트, 사람별 한 줄 (미제출도 표시) ---
    async function exportWeeklyExcel() {
      const allWeeks = Array.from(new Set(state.weeklyReports.map(w => w.week))).sort().reverse();
      const weeks = state.weeklyFilterWeek === '전체' ? allWeeks : [state.weeklyFilterWeek];
      if (!weeks.length) return showToast('내보낼 주간보고가 없습니다.', 'info');
      const onlyMember = state.weeklyFilterMember === '전체' ? '' : state.weeklyFilterMember;
      showToast('엑셀 파일을 만드는 중입니다...', 'info');
      try {
        await loadScriptOnce(EXCELJS_URL);
        const wb = new window.ExcelJS.Workbook();
        const thin = { style: 'thin', color: { argb: 'FFD0D5DD' } };
        const border = { top: thin, left: thin, bottom: thin, right: thin };
        const solid = hex => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: xlsArgb(hex) } });
        const head = c => { c.font = { bold: true }; c.fill = solid('#f1f5f9'); c.border = border; c.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true }; };
        const labelOf = wk => (state.weeklyReports.find(r => r.week === wk) || {}).weekLabel || (wk === CURRENT_WEEK.code ? CURRENT_WEEK.label : wk);
        const peopleFor = reports => state.members.filter(m => (!onlyMember || m.id === onlyMember) && (!m.reportExempt || reports.some(r => r.authorId === m.id)));

        // 여러 주를 내보낼 때: 맨 앞에 제출 현황표
        if (weeks.length > 1) {
          const sum = wb.addWorksheet('제출 현황', { views: [{ state: 'frozen', xSplit: 2, ySplit: 2 }] });
          const shown = [...weeks].reverse();
          sum.mergeCells(1, 1, 1, shown.length + 3);
          Object.assign(sum.getCell(1, 1), { value: '주간보고 제출 현황', font: { bold: true, size: 14 } });
          sum.getRow(2).values = ['이름', '직급', ...shown.map(labelOf), '제출'];
          sum.getRow(2).eachCell(head);
          sum.getRow(2).height = 32;
          peopleFor(state.weeklyReports).forEach(m => {
            const marks = shown.map(wk => state.weeklyReports.some(r => r.week === wk && r.authorId === m.id) ? '✓' : '');
            const row = sum.addRow([m.name, m.role, ...marks, `${marks.filter(Boolean).length}/${shown.length}`]);
            row.eachCell({ includeEmpty: true }, (c, i) => {
              c.border = border;
              c.alignment = { horizontal: i <= 2 ? 'left' : 'center', vertical: 'middle' };
              if (i > 2 && i <= shown.length + 2) c.font = { bold: true, color: { argb: 'FF059669' } };
            });
          });
          sum.getColumn(1).width = 10; sum.getColumn(2).width = 7;
          shown.forEach((_, i) => { sum.getColumn(i + 3).width = 16; });
          sum.getColumn(shown.length + 3).width = 7;
        }

        weeks.forEach(wk => {
          const reports = state.weeklyReports.filter(r => r.week === wk);
          const name = wk.replace(/^(\d{4})-(\d{2})-W(\d)$/, (_, y, m, n) => `${y.slice(2)}.${m} ${n}주차`);
          const ws = wb.addWorksheet(name, { views: [{ state: 'frozen', xSplit: 1, ySplit: 2 }] });
          ws.mergeCells(1, 1, 1, 7);
          Object.assign(ws.getCell(1, 1), { value: `주간보고 · ${labelOf(wk)}`, font: { bold: true, size: 14 } });
          ws.getRow(2).values = ['이름', '직급', '제출', '관련 프로젝트', '금주 완료 및 진행 사항', '차주 계획', '이슈 및 지원 요청'];
          ws.getRow(2).eachCell(head);
          peopleFor(reports).forEach(m => {
            const mine = reports.filter(r => r.authorId === m.id);
            const proj = mine.map(r => getProject(r.projectId)).filter(Boolean).map(p => `${p.title} (${p.progress}%)`);
            const join = key => mine.map(r => r[key].trim()).filter(Boolean).join('\n\n');
            const issues = mine.map(r => r.blockers.trim()).filter(b => b && !NO_BLOCKER_RE.test(b)).join('\n\n');
            const row = ws.addRow([m.name, m.role, mine.length ? '제출' : '미제출', [...new Set(proj)].join('\n'), join('completed'), join('nextPlan'), issues || (mine.length ? '특이사항 없음' : '')]);
            row.eachCell({ includeEmpty: true }, (c, i) => {
              c.border = border;
              c.alignment = { vertical: 'top', horizontal: i <= 3 ? 'center' : 'left', wrapText: true };
            });
            row.getCell(1).alignment = { vertical: 'top', horizontal: 'left' };
            row.getCell(3).font = { bold: true, color: { argb: mine.length ? 'FF059669' : 'FFE11D48' } };
            if (!mine.length) for (let c = 1; c <= 7; c++) row.getCell(c).fill = solid('#fff1f2');
          });
          [10, 7, 8, 24, 60, 45, 40].forEach((w, i) => { ws.getColumn(i + 1).width = w; });
        });

        const buf = await wb.xlsx.writeBuffer();
        const fileName = weeks.length > 1 ? `주간보고_전체_${TODAY}.xlsx` : `주간보고_${weeks[0]}.xlsx`;
        downloadBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), fileName);
        showToast(`${fileName} 파일을 내려받았습니다.`, 'success');
      } catch (err) {
        showToast('엑셀 파일을 만들지 못했습니다: ' + err.message, 'error');
      }
    }

    // =========================================================================
    // 5-1. 이슈 트래킹 (현장 이슈를 등록하고 처리 기록을 쌓아 끝까지 닫음)
    // =========================================================================
    function issueSiteName(id) { return id ? tripSite(id).name : '사내'; }
    function issueSiteChip(id) {

    }
    const issueOpen = i => !ISSUE_CLOSED.includes(i.status);
    const issueOverdue = i => issueOpen(i) && DATE_RE.test(i.dueDate) && i.dueDate < TODAY;
    function issueBadge(map, key) { return `<span class="px-1.5 py-0.5 rounded-md text-[11px] font-bold whitespace-nowrap ${map[key] || 'bg-slate-100 text-slate-600'}">${escapeHtml(key)}</span>`; }

    function nowIso() { return new Date().toISOString(); }
    function fmtLogTime(iso) {
      const d = new Date(iso);
      return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function setIssueFilter(key, val) {
      state.issueFilter = { ...state.issueFilter, [key]: val };
      renderAll();
      if (key === 'q') { const el = document.getElementById('issue-search'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
    }
    function setIssueView(v) { state.issueView = v; saveUi(); renderAll(); }
    function filteredIssues() {
      const f = state.issueFilter;
      const q = (f.q || '').trim().toLowerCase();
      const me = myMemberId();
      return state.issues.filter(i => {
        if (f.status === '열린 이슈' && !issueOpen(i)) return false;
        if (f.status && f.status !== '열린 이슈' && f.status !== '전체' && i.status !== f.status) return false;
        if (f.site && f.site !== '전체' && (f.site === '사내' ? i.siteId : i.siteId !== f.site)) return false;
        if (f.severity && f.severity !== '전체' && i.severity !== f.severity) return false;
        if (f.member && f.member !== '전체' && !i.assigneeIds.includes(f.member)) return false;
        if (f.quick === 'mine' && !(i.assigneeIds.includes(me) || i.authorId === me)) return false;
        if (f.quick === 'overdue' && !issueOverdue(i)) return false;
        if (f.quick === 'urgent' && !(issueOpen(i) && i.severity === '긴급')) return false;
        if (q && ![i.title, i.content, i.equipment, i.cause, i.action, issueSiteName(i.siteId), ...i.logs.map(l => l.text)].join(' ').toLowerCase().includes(q)) return false;
        return true;
      }).sort((a, b) => ISSUE_SEVERITIES.indexOf(a.severity) - ISSUE_SEVERITIES.indexOf(b.severity) || (b.updatedAt || '').localeCompare(a.updatedAt || ''));
    }

    function renderIssues() {
      const f = state.issueFilter;
      const view = ['list', 'kanban', 'sites'].includes(state.issueView) ? state.issueView : 'list';
      const list = filteredIssues();
      const open = state.issues.filter(issueOpen);
      const sel = (key, options, allLabel) => `<select onchange="setIssueFilter('${key}', this.value)" class="text-xs border border-slate-200 rounded-lg px-2.5 py-1.5 bg-slate-50">
