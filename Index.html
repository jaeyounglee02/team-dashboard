    // ---- 긴 보고 접어 보이기: 정해진 높이를 넘는 보고만 접고 [전체 보기] 버튼을 보여 줌
    const openReportClamps = new Set(); // 펼쳐 둔 보고 id (다시 그려도 유지)
    function reportClampButton(id) {
      return `<button type="button" data-clamp-btn="${id}" onclick="toggleReportClamp('${id}')" class="report-clamp-btn hidden w-full flex items-center justify-center gap-1 py-1.5 rounded-lg text-xs font-semibold text-indigo-600 hover:bg-indigo-50 transition"></button>`;
    }
    function refreshReportClamps() {
      document.querySelectorAll('.report-clamp[data-clamp-id]').forEach(box => {
        const id = box.dataset.clampId;
        const btn = document.querySelector(`[data-clamp-btn="${id}"]`);
        const open = openReportClamps.has(id);
        box.classList.toggle('is-open', open);
        box.classList.remove('is-clamped');
        const limit = parseFloat(getComputedStyle(box).getPropertyValue('--clamp-h')) * parseFloat(getComputedStyle(document.documentElement).fontSize);
        const tooLong = box.scrollHeight > limit + 24; // 조금 넘는 정도는 그냥 다 보여줌
        box.classList.toggle('is-clamped', tooLong);
        if (!btn) return;
        btn.classList.toggle('hidden', !tooLong);
        btn.innerHTML = open ? '접기 <span aria-hidden="true">▴</span>' : '전체 보기 <span aria-hidden="true">▾</span>';
      });
    }
    function toggleReportClamp(id) {
      const wasOpen = openReportClamps.has(id);
      if (wasOpen) openReportClamps.delete(id); else openReportClamps.add(id);
      refreshReportClamps();
      if (wasOpen) { // 접으면 그 보고 위치로 돌아가기
        const box = document.querySelector(`.report-clamp[data-clamp-id="${id}"]`);
        const card = box && box.parentElement;
        if (card && card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
    }
    window.addEventListener('resize', () => { clearTimeout(window.__clampT); window.__clampT = setTimeout(refreshReportClamps, 150); });

    function destroyCharts() {
      Object.values(chartInstances).forEach(ch => {
        if (ch && typeof ch.destroy === 'function') ch.destroy();
      });
      chartInstances = {};
    }

    // =========================================================================
    // 3. OVERVIEW VIEW
    // =========================================================================
    // ---- 팀 현황 기준값 (팀 규칙이 바뀌면 여기만 고치면 됨)
    const DAILY_DEADLINE = '18:00';      // 일간보고 제출 기준: 퇴근(18:00) 전. 이 시각 전에는 '작성 전'으로만 표시
    const LATE_NIGHT_UNTIL = 6;          // 이 시각(시) 전에 쓰면 어제 날짜 보고로 봄 (퇴근 후 집에서 늦게 쓰는 경우)
    const DUE_WARN_DAYS = 7;             // 마감 7일 이내면 '마감 임박'
    const DUE_DANGER_DAYS = 3;           // 3일 이내 또는 지남이면 빨간색
    const WEEKLY_DEADLINE_LABEL = '금 16:00 마감';
    const NO_BLOCKER_RE = /^[\s•\-·]*(없음|없습니다|특이사항\s*없음|해당\s*없음|n\/?a|none)?[\s.]*$/i;

    function daysUntil(dateStr) {
      return Math.round((parseYmd(dateStr) - parseYmd(TODAY)) / 86400000);
    }
    function dDayLabel(diff) {
      return diff < 0 ? `D+${-diff}` : diff === 0 ? 'D-Day' : `D-${diff}`;
    }
    function shortDate(dateStr) {
      const d = parseYmd(dateStr);
      return `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`;
    }
    function shortDateWithDay(dateStr) {
      const d = parseYmd(dateStr);
      return `${d.getMonth() + 1}/${d.getDate()} (${'일월화수목금토'[d.getDay()]})`;
    }
    function nowHHMM() {
      const d = new Date();
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    function memberShortNames(ids) {
      return ids.map(id => getMember(id)).filter(Boolean).map(m => escapeHtml(m.initials || m.name)).join(', ');
    }
    function avatar(m, size = 'w-6 h-6 text-[10px]') {
      return `<span class="${size} rounded-full ${m.color} text-white font-bold flex items-center justify-center shrink-0">${escapeHtml(m.initials)}</span>`;
    }
    // 오늘 기준 상태: 출장·외근·휴가가 아직 시작 전(시작일이 내일 이후)이면 오늘은 업무중으로 봄
    function statusToday(m) {
      return ABSENCE_STATUSES.includes(m.status) && m.tripStart && m.tripStart > TODAY ? '업무중' : m.status;
    }
    function isAway(m) { return AWAY_STATUSES.includes(statusToday(m)); }

    // 팀 현황 계산 (사이드바 '확인 N' 배지와 화면이 같은 기준을 쓰도록 한 곳에서 계산)
    // 일간·주간보고를 써야 하는 팀원 (관리자가 '보고 대상에서 제외'로 표시한 사람은 뺌)
    function reportMembers() {
      return state.members.filter(m => !m.reportExempt);
    }

    function computeOverview() {
      const dueSoon = state.projects
        .filter(p => p.status !== '완료' && DATE_RE.test(p.dueDate) && daysUntil(p.dueDate) <= DUE_WARN_DAYS)
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
      const todayReports = state.dailyReports.filter(d => d.date === TODAY);
      const blockers = todayReports
        .filter(d => !NO_BLOCKER_RE.test(d.blockers || '') || d.condition === '지원 필요')
        .map(d => ({ report: d, member: getMember(d.authorId) }))
        .filter(x => x.member);
      const reportedIds = new Set(todayReports.map(d => d.authorId));
      const dailyMissing = reportMembers().filter(m => statusToday(m) !== '휴가' && !reportedIds.has(m.id));
      const dailyPastDeadline = nowHHMM() >= DAILY_DEADLINE;
      // 긴급 이슈 + 목표일 지난 이슈 (열린 것만)
      const hotIssues = state.issues
        .filter(i => !ISSUE_CLOSED.includes(i.status) && (i.severity === '긴급' || (DATE_RE.test(i.dueDate) && i.dueDate < TODAY)))
        .sort((a, b) => (a.severity === '긴급' ? 0 : 1) - (b.severity === '긴급' ? 0 : 1) || (a.dueDate || '9999').localeCompare(b.dueDate || '9999'));
      // 대여품 반납: 3일 이내·지난 것은 확인 건수에, 7일 이내는 목록에
      const rentDue = partsDueSoon();
      const rentUrgent = rentDue.filter(p => partDueDays(p) <= 3).length;
      const checkCount = dueSoon.length + blockers.length + hotIssues.length + rentUrgent + (dailyPastDeadline && dailyMissing.length ? 1 : 0);
      return { dueSoon, blockers, hotIssues, rentDue, dailyMissing, dailyPastDeadline, checkCount };
    }

    function renderOverview() {
      const ov = computeOverview();
      const away = workMembers().filter(isAway);
      const todaySchedules = state.schedules
        .filter(s => scheduleOn(s, TODAY) && s.auto !== 'absence') // 부재는 출장·외근/팀원 상태 카드에서 보여 줌
        .sort((a, b) => a.time.localeCompare(b.time));
      const upcoming = state.schedules
        .map(s => ({ ...s, occ: nextOccurrence(s, addDays(TODAY, 1)) }))
        .filter(s => s.occ && (s.repeat || s.date > TODAY))
        .sort((a, b) => a.occ.localeCompare(b.occ) || a.time.localeCompare(b.time))
        .slice(0, 6);
      const openProjects = state.projects
        .filter(p => p.status !== '완료')
        .sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999'));
      const doneCount = state.projects.length - openProjects.length;
      const weeklyAuthors = new Set(state.weeklyReports.filter(w => w.week === CURRENT_WEEK.code).map(w => w.authorId));
      const reporters = reportMembers();
      const weeklyDone = reporters.filter(m => weeklyAuthors.has(m.id));
      const weeklyTodo = reporters.filter(m => !weeklyAuthors.has(m.id));
      const weeklyPct = reporters.length ? Math.round(weeklyDone.length / reporters.length * 100) : 0;
      const pinned = state.knowledgePool.filter(k => k.pinned).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
      const weekRange = (CURRENT_WEEK.label.match(/\(([^)]+)\)/) || [])[1] || '';

      const STATUS_STYLE = MEMBER_STATUS_STYLE;
      const PROGRESS_COLOR = { '검토중': 'bg-amber-500', '기획/대기': 'bg-slate-400' };

      // ① 오늘 확인 필요
      const dueHtml = ov.dueSoon.length ? ov.dueSoon.map(p => {
        const diff = daysUntil(p.dueDate);
        const danger = diff <= DUE_DANGER_DAYS;
        return `
          <div onclick="openProjectModal('${p.id}')" class="p-3 rounded-xl cursor-pointer transition ${danger ? 'bg-rose-50 border border-rose-100 hover:border-rose-300' : 'bg-amber-50 border border-amber-100 hover:border-amber-300'}">
            <div class="flex items-center justify-between gap-2">
              <p class="text-sm font-semibold text-slate-900 truncate">${escapeHtml(p.title)}</p>
              <span class="px-2 py-0.5 rounded-md ${danger ? 'bg-rose-600' : 'bg-amber-500'} text-white text-[11px] font-bold shrink-0">${diff < 0 ? '지연 ' : ''}${dDayLabel(diff)}</span>
            </div>
            <p class="text-xs text-slate-500 mt-1 truncate">${escapeHtml(p.status)} · 진행률 ${p.progress}%${p.assigneeIds.length ? ' · ' + memberShortNames(p.assigneeIds) : ''}</p>
          </div>`;
      }).join('') : '<p class="text-xs text-slate-400 py-2">마감 임박 프로젝트 없음</p>';

      const blockerHtml = ov.blockers.length ? ov.blockers.map(({ report, member }) => {
        const condStyle = report.condition === '지원 필요' ? 'bg-rose-100 text-rose-700' : report.condition === '집중 필요' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600';
        const text = NO_BLOCKER_RE.test(report.blockers || '') ? '지원 필요로 표시됨' : report.blockers.replace(/^[\s•\-·]+/, '');
        return `
          <div onclick="openDailyModal('${report.id}')" class="p-3 rounded-xl bg-amber-50 border border-amber-100 hover:border-amber-300 cursor-pointer transition">
            <div class="flex items-center gap-2">
              ${avatar(member)}
              <p class="text-sm font-semibold text-slate-900 truncate">${escapeHtml(member.name)}</p>
              <span class="ml-auto px-2 py-0.5 rounded-full ${condStyle} text-[11px] font-semibold shrink-0">${escapeHtml(report.condition)}</span>
            </div>
            <p class="text-xs text-slate-700 mt-2 whitespace-pre-line line-clamp-3">${escapeHtml(text)}</p>
            <p class="text-[11px] text-slate-400 mt-1">${shortDate(report.date)} 일간보고</p>
          </div>`;
      }).join('') : '<p class="text-xs text-slate-400 py-2">오늘 보고된 블로커 없음</p>';

      // 이름만 쉼표로 (출장·외근 중이면 작은 표시)
      const missingHtml = ov.dailyMissing.length
        ? `<p class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-sm text-slate-700 leading-relaxed">${ov.dailyMissing.map(m => `<span class="whitespace-nowrap">${escapeHtml(m.name)}${isAway(m) ? `<span class="ml-1 px-1 py-px rounded ${STATUS_STYLE[statusToday(m)]} text-[10px] font-bold align-middle">${statusShort(statusToday(m))}</span>` : ''}</span>`).join(', ')}</p>`
        : '<p class="text-xs text-emerald-600 py-2 font-medium">모두 제출했습니다</p>';

      const onLeave = reporters.filter(m => statusToday(m) === '휴가').length;
      const checkTotal = ov.checkCount;

      // ② 출장·외근
      const awayHtml = away.length ? away.map(m => {
        const trip = m.status !== '외근';
        let ret = '';
        if (m.tripReturn) {
          const overdue = m.tripReturn < TODAY;
          const when = m.tripReturn === TODAY ? '오늘' : shortDateWithDay(m.tripReturn);
          ret = `<span class="text-[11px] text-right shrink-0 ${overdue ? 'text-rose-600' : 'text-slate-500'}">${overdue ? '복귀일 지남' : '복귀'}<br><b class="${overdue ? 'text-rose-700' : 'text-slate-700'}">${when}${m.tripReturnTime ? ' ' + escapeHtml(m.tripReturnTime) : ''}</b></span>`;
        }
        return `
          <div onclick="openMemberModal('${m.id}')" class="flex items-center gap-3 p-2.5 rounded-xl cursor-pointer transition ${trip ? 'bg-purple-50/60 border border-purple-100 hover:border-purple-300' : 'bg-teal-50/60 border border-teal-100 hover:border-teal-300'}">
            ${avatar(m, 'w-8 h-8 text-xs')}
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5"><p class="text-sm font-semibold text-slate-900 truncate">${escapeHtml(m.name)}</p><span class="px-1.5 py-0.5 rounded ${STATUS_STYLE[m.status]} text-[10px] font-bold shrink-0">${statusShort(m.status)}</span></div>
              <p class="text-xs text-slate-500 truncate">${m.tripPlace ? escapeHtml(m.tripPlace) : '<span class="text-slate-400">행선지 미입력</span>'}</p>
            </div>
            ${ret}
          </div>`;
      }).join('') : '<p class="text-xs text-slate-400 py-4 text-center">출장·외근 중인 인원 없음</p>';

      const statusRows = MEMBER_STATUSES.map(st => ({ st, list: workMembers().filter(m => statusToday(m) === st) }));
      const statusHtml = statusRows.filter(r => r.list.length).map(r => `
          <div class="flex items-start gap-2"><span class="px-2 py-0.5 rounded-full ${STATUS_STYLE[r.st]} font-semibold w-20 text-center shrink-0 whitespace-nowrap">${statusShort(r.st)} ${r.list.length}</span><span class="text-slate-700">${r.list.map(m => escapeHtml(m.name)).join(', ')}</span></div>
        `).join('') + (() => {
          const zero = statusRows.filter(r => !r.list.length);
          return zero.length ? `<div class="flex flex-wrap gap-1.5 text-slate-400">${zero.map(r => `<span class="px-2 py-0.5 rounded-full bg-slate-100 font-semibold whitespace-nowrap">${statusShort(r.st)} 0</span>`).join('')}</div>` : '';
        })();

      const card = 'bg-white rounded-2xl border border-slate-200 shadow-sm p-5';
      const linkBtn = (tab, label) => `<button type="button" onclick="setActiveTab('${tab}')" class="ml-auto text-xs font-medium text-indigo-600 hover:text-indigo-800 shrink-0">${label} →</button>`;

      return `
        <!-- ① 오늘 확인 필요 -->
        <section class="bg-white rounded-2xl border ${checkTotal ? 'border-rose-200' : 'border-emerald-200'} shadow-sm">
          <div class="px-5 py-3.5 border-b ${checkTotal ? 'border-rose-100 bg-rose-50/60' : 'border-emerald-100 bg-emerald-50/60'} rounded-t-2xl flex flex-wrap items-center gap-2">
            <i data-lucide="${checkTotal ? 'alert-triangle' : 'check-circle-2'}" class="w-4 h-4 ${checkTotal ? 'text-rose-600' : 'text-emerald-600'}"></i>
            <h3 class="text-sm font-bold ${checkTotal ? 'text-rose-900' : 'text-emerald-900'}">오늘 확인 필요 <span class="${checkTotal ? 'text-rose-600' : 'text-emerald-600'}">${checkTotal}건</span></h3>
            <span class="text-xs ${checkTotal ? 'text-rose-700/70' : 'text-emerald-700/70'}">· 해결되면 자동으로 사라집니다</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 divide-y md:divide-y-0 md:divide-x divide-slate-100">
            <div class="p-4 space-y-2.5 min-w-0">
              <p class="text-xs font-bold text-rose-700 flex items-center gap-1.5"><i data-lucide="clock-alert" class="w-3.5 h-3.5"></i>마감 임박 · 지연 프로젝트 <span class="text-slate-400 font-medium">${DUE_WARN_DAYS}일 이내</span></p>
              ${dueHtml}
            </div>
            <div class="p-4 space-y-2.5 min-w-0">
              <p class="text-xs font-bold text-amber-700 flex items-center gap-1.5"><i data-lucide="hand-helping" class="w-3.5 h-3.5"></i>블로커 · 지원 요청</p>
              ${blockerHtml}
            </div>
            <div class="p-4 space-y-2.5 min-w-0">
              <p class="text-xs font-bold text-rose-700 flex items-center gap-1.5"><i data-lucide="bug" class="w-3.5 h-3.5"></i>긴급 · 기한 지난 이슈${ov.hotIssues.length ? ` <button type="button" onclick="state.issueFilter = { status: '열린 이슈' }; setActiveTab('issues')" class="ml-auto text-[11px] font-medium text-indigo-600 hover:text-indigo-800">이슈 트래킹 →</button>` : ''}</p>
              ${ov.hotIssues.length ? ov.hotIssues.slice(0, 4).map(i => `
                <div onclick="openIssueModal('${i.id}')" class="p-3 rounded-xl ${i.severity === '긴급' ? 'bg-rose-50 border border-rose-100 hover:border-rose-300' : 'bg-amber-50 border border-amber-100 hover:border-amber-300'} cursor-pointer transition">
                  <div class="flex items-center gap-1.5">${issueSiteChip(i.siteId)}<span class="ml-auto px-1.5 py-0.5 rounded-md text-[11px] font-bold ${i.severity === '긴급' ? 'bg-rose-600 text-white' : 'bg-amber-500 text-white'}">${i.severity === '긴급' ? '긴급' : '기한 지남'}</span></div>
                  <p class="text-sm font-semibold text-slate-900 truncate mt-1">${escapeHtml(i.title)}</p>
                  <p class="text-xs text-slate-500 truncate">${escapeHtml(i.status)} · ${escapeHtml(issueAssignees(i))}${i.dueDate ? ` · ~${i.dueDate.slice(5).replace('-', '/')}` : ''}</p>
                </div>`).join('') + (ov.hotIssues.length > 4 ? `<p class="text-[11px] text-slate-400">외 ${ov.hotIssues.length - 4}건</p>` : '') : '<p class="text-xs text-slate-400 py-2">긴급·기한 지난 이슈 없음</p>'}
            </div>
            <div class="p-4 space-y-2.5 min-w-0">
              <p class="text-xs font-bold ${ov.dailyPastDeadline ? 'text-slate-700' : 'text-slate-500'} flex items-center gap-1.5"><i data-lucide="file-x" class="w-3.5 h-3.5"></i>오늘 일간보고 ${ov.dailyPastDeadline ? '미제출' : '미작성'} <span class="text-slate-400 font-medium">${ov.dailyMissing.length} / ${reporters.length - onLeave}명</span></p>
              ${missingHtml}
              <p class="text-[11px] text-slate-400">제출 기준 퇴근(${DAILY_DEADLINE}) 전${ov.dailyPastDeadline ? ' · 지남' : ' (아직 확인 건수에 넣지 않음)'}${onLeave ? ` · 휴가 ${onLeave}명 제외` : ''}</p>
            </div>
          </div>
          ${ov.rentDue.length ? `
          <div class="px-4 py-3 border-t border-slate-100 flex flex-wrap items-center gap-2">
            <p class="text-xs font-bold text-violet-700 flex items-center gap-1.5 shrink-0"><i data-lucide="package" class="w-3.5 h-3.5"></i>대여품 반납</p>
            ${ov.rentDue.map(p => `<button type="button" onclick="openPartModal('${p.id}')" class="inline-flex items-center gap-1.5 px-2 py-1 rounded-lg border border-slate-200 hover:border-violet-300 text-xs"><span class="font-semibold text-slate-800">${escapeHtml(p.name)}</span><span class="text-slate-400">${escapeHtml(p.vendor || '')}</span><span class="px-1.5 py-0.5 rounded-md font-bold ${partDueClass(p)}">${partDueLabel(p)}</span></button>`).join('')}
            <button type="button" onclick="state.partFilter = { quick: 'due' }; setActiveTab('parts')" class="ml-auto text-[11px] font-medium text-indigo-600 hover:text-indigo-800">Parts 관리 →</button>
          </div>` : ''}
        </section>

        <!-- 공지·News (최근 ${OVERVIEW_NOTICE_COUNT}개) -->
        ${renderOverviewNotices()}

        <!-- ② 오늘 -->
        <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
          <div class="${card}">
            <div class="flex items-center gap-2 mb-3"><i data-lucide="calendar-clock" class="w-4 h-4 text-indigo-600"></i><h3 class="text-sm font-bold text-slate-900">오늘 일정</h3>${linkBtn('schedule', '일정 관리')}</div>
            <div class="space-y-2">
              ${todaySchedules.length ? todaySchedules.map(s => `
                <div onclick="openScheduleModal('${s.id}')" class="p-3 rounded-xl bg-indigo-50/60 border border-indigo-100 hover:border-indigo-300 cursor-pointer transition">
                  <div class="flex items-center gap-2 mb-1"><span class="text-sm font-bold text-indigo-700">${escapeHtml(s.time) || '종일'}</span><span class="ml-auto">${renderScheduleBadge(s.category)}</span></div>
                  <p class="text-sm font-semibold text-slate-900 truncate">${escapeHtml(s.title)}</p>
                  ${s.description ? `<p class="text-xs text-slate-500 truncate">${escapeHtml(s.description)}</p>` : ''}
                </div>`).join('') : '<p class="text-xs text-slate-400 py-4 text-center">오늘 일정 없음</p>'}
            </div>
          </div>
          <div class="bg-white rounded-2xl border-2 ${away.length ? 'border-purple-200' : 'border-slate-200'} shadow-sm p-5">
            <div class="flex items-center gap-2 mb-3"><i data-lucide="plane" class="w-4 h-4 text-purple-600"></i><h3 class="text-sm font-bold text-slate-900">출장·외근 중</h3><span class="ml-auto px-2 py-0.5 rounded-full ${away.length ? 'bg-purple-100 text-purple-700' : 'bg-slate-100 text-slate-500'} text-[11px] font-bold">${away.length}명</span></div>
            <div class="space-y-2">${awayHtml}</div>
          </div>
          <div class="${card}">
            <div class="flex items-center gap-2 mb-3"><i data-lucide="calendar-range" class="w-4 h-4 text-indigo-600"></i><h3 class="text-sm font-bold text-slate-900">다가오는 일정</h3>${linkBtn('schedule', '일정 관리')}</div>
            <div class="space-y-2 text-xs">
              ${upcoming.length ? upcoming.map(s => `
                <div onclick="openScheduleModal('${s.id}')" class="px-2 py-1.5 -mx-1 rounded-lg hover:bg-slate-50 cursor-pointer">
                  <div class="flex items-center gap-2">
                    <span class="text-slate-500 font-semibold whitespace-nowrap">${shortDateWithDay(s.occ)}${!s.repeat && scheduleEnd(s) !== s.date ? ` ~ ${shortDateWithDay(scheduleEnd(s))}` : ''}${s.time && s.time !== '종일' ? ' ' + escapeHtml(s.time) : ''}${s.repeat ? ' <span class="text-indigo-500" title="' + escapeHtml(repeatLabel(s)) + '">🔁</span>' : ''}</span>
                    <span class="ml-auto shrink-0">${renderScheduleBadge(s.category)}</span>
                  </div>
                  <p class="text-sm text-slate-800 truncate mt-0.5">${escapeHtml(s.title)}</p>
                </div>`).join('') : '<p class="text-slate-400 py-4 text-center">예정된 일정 없음</p>'}
            </div>
          </div>
        </section>

        <!-- ③ 프로젝트 진행 현황 -->
        <section class="${card}">
          <div class="flex items-center gap-2 mb-4">
            <i data-lucide="kanban" class="w-4 h-4 text-indigo-600"></i>
            <h3 class="text-sm font-bold text-slate-900">프로젝트 진행 현황</h3>
            <span class="text-xs text-slate-400">· 마감이 가까운 순</span>
            ${linkBtn('projects', '프로젝트 관리')}
          </div>
          <div class="space-y-1">
            <div class="hidden sm:grid grid-cols-12 items-center gap-3 text-[11px] font-semibold text-slate-400 px-2 pb-1">
              <span class="col-span-4">프로젝트</span><span class="col-span-2">상태</span><span class="col-span-4">진행률</span><span class="col-span-2 text-right">마감</span>
            </div>
            ${openProjects.length ? openProjects.map(p => {
              const diff = p.dueDate ? daysUntil(p.dueDate) : null;
              const dColor = diff === null ? 'text-slate-400' : diff <= DUE_DANGER_DAYS ? 'text-rose-600' : diff <= DUE_WARN_DAYS ? 'text-amber-600' : 'text-slate-600';
              return `
                <div onclick="openProjectModal('${p.id}')" class="grid grid-cols-12 items-center gap-x-3 gap-y-1 px-2 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer">
                  <span class="col-span-8 sm:col-span-4 text-sm font-semibold text-slate-900 truncate">${escapeHtml(p.title)}</span>
                  <span class="col-span-4 sm:col-span-2 text-right sm:text-left">${renderStatusBadge(p.status)}</span>
                  <div class="col-span-8 sm:col-span-4 flex items-center gap-2"><div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${PROGRESS_COLOR[p.status] || 'bg-indigo-600'} rounded-full" style="width:${p.progress}%"></div></div><span class="text-xs font-semibold w-9 text-right">${p.progress}%</span></div>
                  <span class="col-span-4 sm:col-span-2 text-right text-xs">${p.dueDate ? `<span class="text-slate-400">${shortDate(p.dueDate)}</span> <b class="${dColor}">${dDayLabel(diff)}</b>` : '<span class="text-slate-400">마감 미정</span>'}</span>
                </div>`;
            }).join('') : '<p class="text-xs text-slate-400 py-4 text-center">진행 중인 프로젝트 없음</p>'}
            ${doneCount ? `<p class="text-[11px] text-slate-400 px-2 pt-1">완료된 프로젝트 ${doneCount}건은 숨김</p>` : ''}
          </div>
        </section>

        <!-- ④ 이번 주 -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <div class="${card}">
            <div class="flex flex-wrap items-center gap-2 mb-3"><i data-lucide="file-bar-chart-2" class="w-4 h-4 text-indigo-600"></i><h3 class="text-sm font-bold text-slate-900">이번 주 주간보고</h3><span class="text-xs text-slate-400">${escapeHtml(weekRange)} · ${WEEKLY_DEADLINE_LABEL}</span>${linkBtn('weekly', '주간보고')}</div>
            <div class="flex items-center gap-3 mb-3">
              <div class="flex-1 h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-indigo-600 rounded-full" style="width:${weeklyPct}%"></div></div>
              <span class="text-sm font-bold text-slate-900">${weeklyDone.length} / ${reporters.length}명</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="p-2.5 rounded-lg bg-emerald-50 text-emerald-800"><b>제출</b> · ${weeklyDone.length ? weeklyDone.map(m => escapeHtml(m.name)).join(', ') : '-'}</div>
              <div class="p-2.5 rounded-lg bg-slate-50 text-slate-600"><b>미제출</b> · ${weeklyTodo.length ? weeklyTodo.map(m => escapeHtml(m.name)).join(', ') : '-'}</div>
            </div>
          </div>
          <div class="${card}">
            <div class="flex items-center gap-2 mb-3"><i data-lucide="users" class="w-4 h-4 text-sky-600"></i><h3 class="text-sm font-bold text-slate-900">오늘 팀원 상태</h3>${linkBtn('members', `${workMembers().length}명`)}</div>
            <div class="space-y-2 text-xs">${workMembers().length ? statusHtml : '<p class="text-slate-400">등록된 팀원 없음</p>'}</div>
          </div>
        </section>

        <!-- ⑤ 고정 문서 -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
          <div class="flex flex-wrap items-center gap-2">
            <i data-lucide="pin" class="w-4 h-4 text-amber-500"></i>
            <h3 class="text-sm font-bold text-slate-900 mr-1">고정 문서</h3>
            ${pinned.length ? pinned.map(k => `
              <button type="button" onclick="openPoolDetailModal('${k.id}')" class="px-2.5 py-1 rounded-lg bg-slate-50 hover:bg-indigo-50 border border-slate-100 hover:border-indigo-200 text-xs text-slate-700 max-w-full truncate transition">${escapeHtml(k.title)}</button>
            `).join('') : '<span class="text-xs text-slate-400">고정된 문서 없음 (업무 Pool에서 ★로 고정)</span>'}
            ${linkBtn('pool', '업무 Pool')}
          </div>
        </section>
      `;
    }

    // =========================================================================
    // 4. PROJECT MANAGEMENT VIEW
    // =========================================================================
    const PROJECT_STATUSES = ['기획/대기', '진행중', '검토중', '완료'];
    const PROJECT_CATEGORIES = ['신규 설비', '개조·추가', '성능 개선', '유지보수·AS', '내부 개발', '기타'];
    const PRIORITIES = ['긴급', '높음', '보통', '낮음'];

    function renderPriorityBadge(priority) {
      const map = {
        '긴급': 'bg-rose-100 text-rose-700',
        '높음': 'bg-amber-100 text-amber-700',
        '보통': 'bg-sky-100 text-sky-700',
        '낮음': 'bg-slate-100 text-slate-600'
      };
      return `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${map[priority] || 'bg-slate-100 text-slate-600'}">${escapeHtml(priority)}</span>`;
    }

    function renderStatusBadge(status) {
      const map = {
        '기획/대기': 'bg-slate-100 text-slate-700',
        '진행중': 'bg-indigo-100 text-indigo-700',
        '검토중': 'bg-amber-100 text-amber-700',
        '완료': 'bg-emerald-100 text-emerald-700'
      };
      return `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold whitespace-nowrap shrink-0 ${map[status] || 'bg-slate-100 text-slate-700'}">${escapeHtml(status)}</span>`;
    }

    function setProjectViewMode(mode) {
      state.projectViewMode = mode;
      saveUi();
      renderAll();
    }

    function setProjectFilter(type, val) {
      if (type === 'status') state.projectFilterStatus = val;
      if (type === 'priority') state.projectFilterPriority = val;
      if (type === 'category') state.projectFilterCategory = val;
      saveUi();
      renderAll();
    }

    // 분류 목록 + 예전에 직접 적어 둔 분류(목록에 없는 것)도 고를 수 있게 뒤에 붙임
    function projectCategoryOptions(keep) {
      const extra = [...new Set(state.projects.map(p => p.category).concat(keep ? [keep] : []))]
        .filter(c => c && !PROJECT_CATEGORIES.includes(c));
      return [...PROJECT_CATEGORIES, ...extra];
    }

    function renderProjects() {
      const filtered = state.projects.filter(p => {
        const matchStatus = state.projectFilterStatus === '전체' || p.status === state.projectFilterStatus;
        const matchPriority = state.projectFilterPriority === '전체' || p.priority === state.projectFilterPriority;
        const matchCategory = !state.projectFilterCategory || state.projectFilterCategory === '전체' || p.category === state.projectFilterCategory;
        return matchStatus && matchPriority && matchCategory;
      });

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
          <div class="flex flex-wrap items-center gap-2">
            <select onchange="setProjectFilter('status', this.value)" class="text-xs sm:text-sm border border-slate-200 rounded-lg px-3 py-1.5 bg-slate-50 focus:bg-white outline-none">
              <option value="전체" ${state.projectFilterStatus === '전체' ? 'selected' : ''}>상태: 전체</option>
              ${PROJECT_STATUSES.map(s => `<option value="${s}" ${state.projectFilterStatus === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
            <select onchange="setProjectFilter('priority', this.value)" class="text-xs sm:text-sm border border-slate-200 rounded-lg px-3 py-1.5 bg-slate-50 focus:bg-white outline-none">
              <option value="전체" ${state.projectFilterPriority === '전체' ? 'selected' : ''}>우선순위: 전체</option>
              ${PRIORITIES.map(pr => `<option value="${pr}" ${state.projectFilterPriority === pr ? 'selected' : ''}>${pr}</option>`).join('')}
            </select>
            <select onchange="setProjectFilter('category', this.value)" class="text-xs sm:text-sm border border-slate-200 rounded-lg px-3 py-1.5 bg-slate-50 focus:bg-white outline-none">
              <option value="전체" ${(state.projectFilterCategory || '전체') === '전체' ? 'selected' : ''}>분류: 전체</option>
              ${projectCategoryOptions().map(c => `<option value="${escapeHtml(c)}" ${state.projectFilterCategory === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
            </select>
          </div>
          <div class="flex items-center gap-2">
            <div class="inline-flex rounded-lg bg-slate-100 p-0.5">
              <button type="button" onclick="setProjectViewMode('kanban')" class="px-3 py-1 rounded-md text-xs font-semibold transition ${state.projectViewMode === 'kanban' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}">칸반 보드</button>
              <button type="button" onclick="setProjectViewMode('table')" class="px-3 py-1 rounded-md text-xs font-semibold transition ${state.projectViewMode === 'table' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}">테이블</button>
            </div>
            <button type="button" onclick="openProjectModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold transition">
              <i data-lucide="plus" class="w-4 h-4"></i> 새 프로젝트
            </button>
          </div>
        </div>

        ${state.projectViewMode === 'kanban' ? renderProjectKanban(filtered) : renderProjectTable(filtered)}
      `;
    }

    function renderProjectKanban(projects) {
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          ${PROJECT_STATUSES.map(status => {
            const items = projects.filter(p => p.status === status);
            return `
              <div class="bg-slate-100/80 rounded-2xl p-3 border border-slate-200/80 flex flex-col min-h-[260px]">
                <div class="flex items-center justify-between px-1 mb-3">
                  <div class="flex items-center gap-2">
                    ${renderStatusBadge(status)}
                    <span class="text-xs font-bold text-slate-500">${items.length}</span>
                  </div>
                </div>
                <div class="space-y-3 flex-1">
                  ${items.length ? items.map(p => `
                    <div onclick="openProjectModal('${p.id}')" class="bg-white rounded-xl p-3.5 border border-slate-200 shadow-sm hover:border-indigo-300 hover:shadow transition cursor-pointer space-y-2.5">
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-[11px] font-medium text-slate-400">${escapeHtml(p.category)}</span>
                        ${renderPriorityBadge(p.priority)}
                      </div>
                      <h4 class="text-sm font-bold text-slate-900 leading-snug">${escapeHtml(p.title)}</h4>
                      <p class="text-xs text-slate-500 line-clamp-2">${escapeHtml(p.description)}</p>
                      <div>
                        <div class="flex items-center justify-between text-[11px] mb-1">
                          <span class="text-slate-500">진행률</span>
                          <span class="font-semibold text-slate-700">${p.progress}%</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                          <div class="h-full rounded-full ${p.progress === 100 ? 'bg-emerald-500' : 'bg-indigo-600'}" style="width: ${p.progress}%"></div>
                        </div>
                      </div>
                      <div class="flex items-center justify-between pt-1 border-t border-slate-100">
                        <div class="flex -space-x-1.5">
                          ${(p.assigneeIds || []).map(id => {
                            const m = getMember(id);
                            return `<span title="${escapeHtml(m.name)}" class="w-6 h-6 rounded-full ${m.color} text-white text-[10px] font-bold flex items-center justify-center ring-2 ring-white">${escapeHtml(m.initials)}</span>`;
                          }).join('')}
                        </div>
                        <span class="text-[11px] text-slate-400 flex items-center gap-1">
                          <i data-lucide="calendar" class="w-3 h-3"></i> ${p.dueDate}
                        </span>
                      </div>
                    </div>
                  `).join('') : '<div class="text-xs text-slate-400 text-center py-8 border border-dashed border-slate-300 rounded-xl">해당 프로젝트 없음</div>'}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderProjectTable(projects) {
      return `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
          <table class="w-full text-left border-collapse min-w-[680px]">
            <thead>
              <tr class="border-b border-slate-200 bg-slate-50 text-xs font-semibold text-slate-500">
                <th class="py-3 px-4">프로젝트명</th>
                <th class="py-3 px-4">분류</th>
                <th class="py-3 px-4">상태</th>
                <th class="py-3 px-4">우선순위</th>
                <th class="py-3 px-4">진행률</th>
                <th class="py-3 px-4">담당</th>
                <th class="py-3 px-4">마감일</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 text-sm">
              ${projects.length ? projects.map(p => `
                <tr onclick="openProjectModal('${p.id}')" class="hover:bg-slate-50 cursor-pointer transition">
                  <td class="py-3 px-4 font-semibold text-slate-900">${escapeHtml(p.title)}</td>
                  <td class="py-3 px-4 text-xs text-slate-500">${escapeHtml(p.category)}</td>
                  <td class="py-3 px-4">${renderStatusBadge(p.status)}</td>
                  <td class="py-3 px-4">${renderPriorityBadge(p.priority)}</td>
                  <td class="py-3 px-4 w-36">
                    <div class="flex items-center gap-2">
                      <div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                        <div class="h-full bg-indigo-600 rounded-full" style="width:${p.progress}%"></div>
                      </div>
                      <span class="text-xs font-medium text-slate-600">${p.progress}%</span>
                    </div>
                  </td>
                  <td class="py-3 px-4">
                    <div class="flex -space-x-1.5">
                      ${(p.assigneeIds || []).map(id => {
                        const m = getMember(id);
                        return `<span title="${escapeHtml(m.name)}" class="w-6 h-6 rounded-full ${m.color} text-white text-[10px] font-bold flex items-center justify-center ring-2 ring-white">${escapeHtml(m.initials)}</span>`;
                      }).join('')}
                    </div>
                  </td>
                  <td class="py-3 px-4 text-xs text-slate-500">${p.dueDate}</td>
                </tr>
              `).join('') : '<tr><td colspan="7" class="py-10 text-center text-sm text-slate-400">조건에 맞는 프로젝트가 없습니다.</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    // =========================================================================
    // 5. MEMBERS (인원 관리) VIEW
    // =========================================================================
    function renderMemberStatusBadge(status) {
      const map = MEMBER_STATUS_STYLE;
      return `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold whitespace-nowrap shrink-0 ${map[status] || 'bg-slate-100 text-slate-700'}">${escapeHtml(status)}</span>`;
    }

    function setMemberStatusFilter(status) {
      state.memberFilterStatus = status;
      saveUi();
      renderAll();
    }

    function renderMembers() {
      const statuses = ['전체', ...MEMBER_STATUSES];
      const currentFilter = state.memberFilterStatus || '전체';
      const filteredMembers = currentFilter === '전체'
        ? state.members
        : workMembers().filter(m => m.status === currentFilter);

      return `
        ${renderJoinRequestsPanel()}
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h3 class="text-sm font-bold text-slate-900">팀 인원 및 리소스 현황 (${workMembers().length}명)</h3>
              <p class="text-xs text-slate-500">${canManageMembers() ? '팀원 카드를 눌러 정보·상태·Google 계정을 수정할 수 있습니다.' : '팀원 이름, 역할, 상태(출장·외근 포함)를 확인할 수 있습니다.'}</p>
            </div>
            <div class="flex flex-wrap items-center gap-2 shrink-0">
            <button type="button" onclick="openLeaveModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-semibold transition">
              <i data-lucide="calendar-x" class="w-4 h-4"></i> 연차 사용 현황
            </button>
            ${canManageMembers() ? `<button type="button" onclick="openMemberModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold transition shrink-0">
              <i data-lucide="user-plus" class="w-4 h-4"></i> 팀원 추가
            </button>` : '<span class="inline-flex items-center gap-1 text-[11px] text-slate-400 shrink-0"><i data-lucide="lock" class="w-3.5 h-3.5"></i>팀원 정보는 관리자만 수정 (내 상태는 오른쪽 위 내 이름에서)</span>'}
            </div>
          </div>
          <div class="flex flex-wrap gap-1.5">
            ${statuses.map(st => {
              const cnt = st === '전체' ? state.members.length : workMembers().filter(m => m.status === st).length;
              const active = currentFilter === st;
              return `
                <button type="button" onclick="setMemberStatusFilter('${st}')"
                  class="px-3 py-1 rounded-lg text-xs font-semibold transition ${
                    active ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }">${st} (${cnt})</button>
              `;
            }).join('')}
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          ${filteredMembers.length ? filteredMembers.map(m => {
            const assignedProjects = state.projects.filter(p => (p.assigneeIds || []).includes(m.id) && p.status !== '완료');
            return `
              <div ${canManageMembers() || m.id === myMemberId() ? `onclick="openMemberModal('${m.id}')"` : ''} class="bg-white rounded-2xl border ${m.id === myMemberId() && authOn() ? 'border-indigo-300' : 'border-slate-200'} p-5 shadow-sm ${canManageMembers() || m.id === myMemberId() ? 'hover:border-indigo-300 cursor-pointer' : ''} transition space-y-4">
                <div class="flex items-start justify-between gap-3">
                  <div class="flex items-center gap-3 min-w-0">
                    <div class="w-11 h-11 rounded-xl ${m.color} text-white font-bold text-sm flex items-center justify-center shrink-0">
                      ${escapeHtml(m.initials)}
                    </div>
                    <div class="min-w-0">
                      <h4 class="text-sm font-bold text-slate-900 truncate">${escapeHtml(m.name)}${m.id === myMemberId() && authOn() ? ' <span class="text-[10px] font-bold text-indigo-600">(나)</span>' : ''}${m.reportExempt ? ' <span class="ml-0.5 px-1.5 py-px rounded bg-slate-100 text-slate-500 text-[10px] font-semibold align-middle" title="일간·주간보고 미작성 집계에서 빠집니다">보고 제외</span>' : ''}</h4>
                      <p class="text-xs text-slate-500 truncate">${escapeHtml(m.role)} · ${escapeHtml(m.part)}</p>
                    </div>
                  </div>
                  ${m.executive ? '<span class="shrink-0 px-2 py-0.5 rounded-full bg-indigo-600 text-white text-[11px] font-bold">최상위 관리자</span>' : renderMemberStatusBadge(m.status)}
                </div>
                ${!m.executive && ABSENCE_STATUSES.includes(m.status) && (m.tripPlace || m.tripReturn || m.tripStart) ? `
                  <div class="flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-lg ${m.status === '외근' ? 'bg-teal-50 text-teal-800' : m.status === '휴가' ? 'bg-amber-50 text-amber-800' : 'bg-purple-50 text-purple-800'}">
                    <i data-lucide="${m.status === '휴가' ? 'palmtree' : 'map-pin'}" class="w-3.5 h-3.5 shrink-0"></i>
                    <span class="truncate">${m.tripStart && m.tripStart > TODAY ? `<b>${shortDateWithDay(m.tripStart)}부터</b> · ` : ''}${escapeHtml(m.tripPlace || (m.status === '휴가' ? '휴가' : '행선지 미입력'))}</span>
                    ${m.tripReturn ? `<span class="ml-auto shrink-0 ${m.tripReturn < TODAY ? 'text-rose-600 font-semibold' : ''}">복귀 ${m.tripReturn === TODAY ? '오늘' : shortDateWithDay(m.tripReturn)}${m.tripReturnTime ? ' ' + m.tripReturnTime : ''}</span>` : ''}
                  </div>` : ''}

                <div>
                  <div class="flex items-center justify-between text-xs mb-1.5">
                    <span class="text-slate-500 font-medium">현재 업무 가동률</span>
                    <span class="font-bold ${m.workload >= 90 ? 'text-rose-600' : 'text-slate-800'}">${m.workload}%</span>
                  </div>
                  <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full rounded-full ${m.workload >= 90 ? 'bg-rose-500' : m.workload >= 75 ? 'bg-indigo-600' : 'bg-sky-500'}" style="width:${Math.min(m.workload, 100)}%"></div>
                  </div>
                </div>

                <div class="pt-3 border-t border-slate-100 space-y-1.5">
                  <div class="flex items-center justify-between text-xs">
                    <span class="text-slate-400">담당 프로젝트</span>
                    <span class="font-semibold text-slate-700">${assignedProjects.length}건 진행중</span>
                  </div>
                  <div class="flex flex-wrap gap-1">
                    ${assignedProjects.length ? assignedProjects.map(p => `
                      <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 text-[11px] truncate max-w-[180px]">${escapeHtml(p.title)}</span>
                    `).join('') : '<span class="text-[11px] text-slate-400">진행 중인 프로젝트 없음</span>'}
                  </div>
                  ${m.contact ? `<p class="text-[11px] text-slate-400 pt-1">연락처: ${escapeHtml(m.contact)}</p>` : ''}
                  ${(() => { const y = TODAY.slice(0, 4); const n = leaveDaysIn(m.id, `${y}-01-01`, `${y}-12-31`); return `<p class="text-[11px] text-slate-500 pt-1">올해 연차 사용 <b class="text-slate-700">${n ? (Number.isInteger(n) ? n : n.toFixed(1)) : 0}일</b></p>`; })()}
                  ${m.workEmail ? `<p class="text-[11px] text-slate-500 pt-1 truncate flex items-center gap-1"><i data-lucide="mail" class="w-3 h-3 shrink-0"></i>${escapeHtml(m.workEmail)}</p>` : ''}
                  ${authOn() && canManageMembers() ? (m.email

              <i data-lucide="copy" class="w-4 h-4"></i> 데일리 요약 복사

              <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> 엑셀로 내보내기

            <button type="button" onclick="openDailyModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold transition">

                      <p class="text-sm font-bold text-slate-900">${escapeHtml(author.name)}${authOn() && d.authorId === myMemberId() ? ' <span class="text-[10px] font-bold text-indigo-600">(나)</span>' : ''}</p>

                    <button type="button" onclick="deleteItem('dailyReports', '${d.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50" title="삭제"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : readOnlyNote()}
                  </div>
                </div>
                <div class="report-clamp space-y-2.5 text-xs ${openReportClamps.has(d.id) ? 'is-open' : ''}" data-clamp-id="${d.id}" style="--clamp-h:17rem">
                  ${isLegacyDaily(d) ? `
                  <div>
                    <span class="font-bold text-slate-500 block mb-1">어제 한 일 <span class="font-normal text-slate-400">(예전 형식)</span></span>

                      <div class="bg-slate-50 p-2.5 rounded-lg"><span class="text-[10px] font-bold text-sky-600">오후</span><p class="text-slate-700 whitespace-pre-line leading-relaxed mt-0.5">${richText(d.afternoon || '-')}</p></div>

    // =========================================================================
    // 8. SCHEDULE MANAGEMENT (일정 관리) VIEW
    // =========================================================================
    function renderScheduleBadge(cat) {
      const map = {
        '팀 회의': 'bg-indigo-100 text-indigo-700',
        '마감일': 'bg-rose-100 text-rose-700',
        '배포/릴리스': 'bg-emerald-100 text-emerald-700',
        '출장/외근': 'bg-purple-100 text-purple-700',
        '휴가/부재': 'bg-amber-100 text-amber-700',
        '기타': 'bg-slate-100 text-slate-700'
      };
      return `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold whitespace-nowrap ${map[cat] || 'bg-slate-100 text-slate-700'}">${escapeHtml(cat)}</span>`;
    }

    function changeCalendarMonth(delta) {
      let m = state.calendarMonth + delta;
      let y = state.calendarYear;
      if (m < 0) { m = 11; y--; }
      if (m > 11) { m = 0; y++; }
      state.calendarMonth = m;
      state.calendarYear = y;
      renderAll();
    }

    function selectCalendarDate(dateStr) {
      state.selectedDate = dateStr;
      const d = parseYmd(dateStr);
      state.calendarYear = d.getFullYear();
      state.calendarMonth = d.getMonth();
      renderAll();
    }

    function renderSchedule() {
      const y = state.calendarYear;
      const m = state.calendarMonth; // 0-indexed
      const firstDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const monthStr = `${y}-${String(m + 1).padStart(2, '0')}`;

      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) {
        cells.push(`${monthStr}-${String(d).padStart(2, '0')}`);
      }

      const dayEvents = state.schedules
        .filter(s => scheduleOn(s, state.selectedDate))
        .sort((a, b) => a.time.localeCompare(b.time));

      const monthLast = `${monthStr}-${String(daysInMonth).padStart(2, '0')}`;
      const monthEvents = state.schedules
        .map(s => ({ ...s, occ: s.repeat ? nextOccurrence(s, `${monthStr}-01`) : s.date }))
        .filter(s => s.date && s.occ && s.occ <= monthLast && s.date <= monthLast && scheduleEnd(s) >= `${monthStr}-01`)
        .sort((a, b) => a.occ.localeCompare(b.occ));

      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <!-- Calendar Card -->
          <div class="lg:col-span-2 xl:col-span-3 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-2">
                <h3 class="text-base font-bold text-slate-900">${y}년 ${m + 1}월</h3>
                <button type="button" onclick="changeCalendarMonth(-1)" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-600" aria-label="이전 달"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <button type="button" onclick="changeCalendarMonth(1)" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-600" aria-label="다음 달"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                <button type="button" onclick="selectCalendarDate(TODAY)" class="px-2 py-1 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">오늘</button>
              </div>
              <button type="button" onclick="openScheduleModal('', '${state.selectedDate}')" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold transition">
                <i data-lucide="plus" class="w-4 h-4"></i> 일정 추가
              </button>
            </div>

            <div class="grid grid-cols-7 text-center text-sm font-bold text-slate-500 pb-2 border-b border-slate-100">
              <div class="text-rose-600">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-600">토</div>
            </div>
            <div class="grid grid-cols-7 gap-1 pt-2">
              ${cells.map(dateStr => {
                if (!dateStr) return '<div class="h-20 sm:h-28"></div>';
                const dayNum = parseInt(dateStr.slice(-2), 10);
                const dow = parseYmd(dateStr).getDay(); // 0=일, 6=토
                const holiday = KR_HOLIDAYS[dateStr] || '';
                const red = dow === 0 || !!holiday;
                const dayColor = red ? 'text-rose-600' : dow === 6 ? 'text-blue-600' : 'text-slate-700';
                const cellBg = red ? 'bg-rose-50/50' : dow === 6 ? 'bg-blue-50/50' : 'bg-white';
                const isToday = dateStr === TODAY;
                const isSelected = dateStr === state.selectedDate;
                // 일반 일정 먼저, 출장·외근·휴가는 뒤에
                const evts = state.schedules.filter(s => showInCalendarCell(s, dateStr))
                  .sort((a, b) => (a.auto === 'absence') - (b.auto === 'absence') || a.time.localeCompare(b.time));
                // 긴 출장은 '이름 출발' / '이름 복귀'로 짧게
                const cellLabel = e => {
                  const base = e.auto === 'absence' ? e.title.split(' · ')[0].replace(/\s*(국내|해외)출장$/, '') : e.title;
                  if (!isLongTrip(e)) return e.auto === 'absence' ? e.title.split(' · ')[0] : e.title;
                  return dateStr === e.date ? `${base} 출발` : `${base} 복귀`;
                };
                return `
                  <button type="button" onclick="selectCalendarDate('${dateStr}')"
                    class="h-20 sm:h-28 p-2 rounded-xl border text-left flex flex-col justify-between transition ${
                      isSelected
                        ? 'border-indigo-500 bg-indigo-50/70 ring-1 ring-indigo-500'
                        : 'border-slate-100 hover:border-slate-300 ' + cellBg
                    }">
                    <span class="flex items-center gap-1 min-w-0">
                      <span class="text-sm font-bold shrink-0 ${isToday ? 'inline-flex items-center justify-center w-6 h-6 rounded-full bg-indigo-600 text-white' : dayColor}">${dayNum}</span>
                      ${holiday ? `<span class="text-[10px] font-semibold text-rose-500 truncate">${holiday}</span>` : ''}
                    </span>
                    <div class="space-y-0.5 overflow-hidden">
                      ${evts.slice(0, 3).map(e => `
                        <div title="${escapeHtml(e.title)}${isLongTrip(e) ? ` (${e.date.slice(5).replace('-', '/')} ~ ${scheduleEnd(e).slice(5).replace('-', '/')})` : ''}" class="text-[11px] leading-tight px-1 py-0.5 rounded truncate font-medium ${
                          e.category === '출장/외근' ? 'bg-purple-100 text-purple-800' : e.category === '휴가/부재' ? 'bg-amber-100 text-amber-800' : 'bg-indigo-100/80 text-indigo-800'
                        }">${escapeHtml(cellLabel(e))}</div>
                      `).join('')}
                      ${evts.length > 3 ? `<div class="text-[10px] text-slate-400 px-1">+${evts.length - 3}</div>` : ''}
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Selected Date & Month Events -->
          <div class="space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <div class="flex items-center justify-between mb-3">
                <h4 class="text-sm font-bold text-slate-900">${state.selectedDate} 일정${KR_HOLIDAYS[state.selectedDate] ? ` <span class="text-xs font-semibold text-rose-500 whitespace-nowrap">· ${KR_HOLIDAYS[state.selectedDate]}</span>` : ''}</h4>
                <button type="button" onclick="openScheduleModal('', '${state.selectedDate}')" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 shrink-0 whitespace-nowrap ml-2">+ 추가</button>
              </div>
              <div class="space-y-2.5">
                ${dayEvents.length ? dayEvents.map(s => `
                  <div onclick="openScheduleModal('${s.id}')" class="p-3 rounded-xl bg-slate-50 hover:bg-indigo-50/50 border border-slate-100 hover:border-indigo-200 cursor-pointer transition space-y-1.5">
                    <div class="flex items-center justify-between gap-2">
                      ${renderScheduleBadge(s.category)}
                      <span class="text-[11px] font-medium text-slate-500">${s.repeat ? `<span class="text-indigo-600">🔁 ${escapeHtml(repeatLabel(s))}</span> · ` : s.endDate && s.endDate > s.date ? `${shortDate(s.date)} ~ ${shortDate(s.endDate)} · ` : ''}${escapeHtml(s.time)}</span>
                    </div>
                    <p class="text-sm font-bold text-slate-900">${escapeHtml(s.title)}</p>
                    <p class="text-xs text-slate-500">${escapeHtml(s.description)}</p>
                  </div>
                `).join('') : '<p class="text-xs text-slate-400 py-6 text-center">선택한 날짜에 일정이 없습니다.</p>'}
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <h4 class="text-sm font-bold text-slate-900 mb-3">${m + 1}월 전체 일정 (${monthEvents.length}건)</h4>
              <div class="space-y-2 max-h-60 overflow-y-auto scrollbar-thin">
                ${monthEvents.length ? monthEvents.map(s => `
                  <div onclick="selectCalendarDate('${s.occ}')" class="flex items-center justify-between gap-2 text-xs p-2 rounded-lg hover:bg-slate-50 cursor-pointer">
                    <span class="font-medium text-slate-700 truncate">${s.repeat ? '🔁 ' : ''}${escapeHtml(s.title)}</span>
                    <span class="text-slate-400 shrink-0">${s.repeat ? escapeHtml(repeatLabel(s)) : s.date.slice(5) + (s.endDate && s.endDate > s.date ? '~' + s.endDate.slice(5) : '')}</span>
                  </div>
                `).join('') : '<p class="text-xs text-slate-400">등록된 일정이 없습니다.</p>'}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 9. KNOWLEDGE POOL (업무 관련 내용 Pool) VIEW
    // =========================================================================
    const POOL_CATEGORIES = ['전체', '매뉴얼', '트러블슈팅', '온보딩', '회의록/정책', '기타'];

    function renderPoolCategoryBadge(cat) {
      const map = {
        '매뉴얼': 'bg-indigo-100 text-indigo-700',
        '트러블슈팅': 'bg-rose-100 text-rose-700',
        '온보딩': 'bg-emerald-100 text-emerald-700',
        '회의록/정책': 'bg-violet-100 text-violet-700',
        '기타': 'bg-slate-100 text-slate-700'
      };
      return `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold whitespace-nowrap ${map[cat] || 'bg-slate-100 text-slate-700'}">${escapeHtml(cat)}</span>`;
    }

    function setPoolFilter(cat) {
      state.poolFilterCategory = cat;
      saveUi();
      renderAll();
    }

    function setPoolSearch(q) {
      state.poolSearch = q;
      renderAll();
      // 다시 그린 뒤에도 입력을 이어갈 수 있게 포커스 복원
      const input = document.getElementById('pool-search');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function togglePoolPin(id, e) {
      e.stopPropagation();
      const doc = state.knowledgePool.find(k => k.id === id);
      if (!doc) return;
      if (commit([{ op: 'upsert', collection: 'knowledgePool', item: { ...doc, pinned: !doc.pinned } }])) renderAll();
    }

    function renderPool() {
      const q = (state.poolSearch || '').trim().toLowerCase();
      const filtered = state.knowledgePool.filter(k => {
        const matchCat = state.poolFilterCategory === '전체' || k.category === state.poolFilterCategory;
        const matchQ = !q ||
          k.title.toLowerCase().includes(q) ||
          k.content.toLowerCase().includes(q) ||
          (k.tags || []).some(t => t.toLowerCase().includes(q)) ||
          (k.attachments || []).some(a => a.name.toLowerCase().includes(q));
        return matchCat && matchQ;
      }).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updatedAt.localeCompare(a.updatedAt));

      return `
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex flex-wrap gap-1.5">
              ${POOL_CATEGORIES.map(cat => `
                <button type="button" onclick="setPoolFilter('${cat}')"
                  class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                    state.poolFilterCategory === cat
                      ? 'bg-indigo-600 text-white'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }">${cat}</button>
              `).join('')}
            </div>
            <div class="flex items-center gap-2">
              <div class="relative flex-1 sm:w-56">
                <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input id="pool-search" type="text" value="${escapeHtml(state.poolSearch)}" oninput="setPoolSearch(this.value)" placeholder="제목, 태그, 본문 검색..." class="w-full pl-8 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-lg bg-slate-50 focus:bg-white outline-none" />
              </div>
              <button type="button" onclick="openPoolEditModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold transition shrink-0">
                <i data-lucide="plus" class="w-4 h-4"></i> 문서 등록
              </button>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${filtered.length ? filtered.map(doc => {
            const author = getMember(doc.authorId);
            return `
              <div onclick="openPoolDetailModal('${doc.id}')" class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:border-indigo-300 hover:shadow transition cursor-pointer flex flex-col justify-between gap-3">
                <div class="space-y-2.5">
                  <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                      ${renderPoolCategoryBadge(doc.category)}
                      <span class="text-[11px] text-slate-400">수정: ${doc.updatedAt}</span>
                    </div>
                    <button type="button" onclick="togglePoolPin('${doc.id}', event)" class="p-1 rounded-lg hover:bg-slate-100 ${doc.pinned ? 'text-amber-500' : 'text-slate-300'}" title="상단 고정">
                      <i data-lucide="pin" class="w-4 h-4"></i>
                    </button>
                  </div>
                  <h4 class="text-sm font-bold text-slate-900 leading-snug">${escapeHtml(doc.title)}</h4>
                  <p class="text-xs text-slate-500 line-clamp-3 leading-relaxed">${escapeHtml(doc.content.replace(/#+ /g, ''))}</p>
                </div>
                <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                  <div class="flex flex-wrap gap-1">
                    ${(doc.tags || []).map(t => `<span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 text-[11px]">#${escapeHtml(t)}</span>`).join('')}
                  </div>
                  <span class="flex items-center gap-2 text-[11px] text-slate-400 shrink-0">
                    ${(doc.attachments || []).length ? `<span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-md bg-indigo-50 text-indigo-700 font-semibold" title="첨부 ${doc.attachments.length}개"><i data-lucide="paperclip" class="w-3 h-3"></i>${doc.attachments.length}</span>` : ''}
                    ${escapeHtml(author.name)}
                  </span>
                </div>
              </div>
            `;
          }).join('') : '<div class="col-span-full bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-400">검색 조건에 맞는 문서가 없습니다.</div>'}
        </div>
      `;
    }

    // =========================================================================
    // 9-1. 공지·NEWS
    // =========================================================================
    let noticeFilter = '전체';

    // 중요 글 먼저, 그다음 최신순
    function sortedNotices(list = state.notices) {
      return [...list].sort((a, b) => (b.important ? 1 : 0) - (a.important ? 1 : 0) || (b.date || '').localeCompare(a.date || '') || b.id.localeCompare(a.id));
    }
    function isNewNotice(n) { return !!n.date && n.date <= TODAY && daysUntil(n.date) >= -NOTICE_NEW_DAYS + 1; }
    function noticeBadge(cat) {
      return `<span class="px-2 py-0.5 rounded-md ${NOTICE_STYLE[cat] || NOTICE_STYLE['기타']} text-[11px] font-bold whitespace-nowrap">${escapeHtml(cat)}</span>`;
    }
    function noticeMarks(n) {
      return (n.important ? '<span class="px-1.5 py-0.5 rounded bg-rose-600 text-white text-[10px] font-bold whitespace-nowrap">중요</span>' : '')
        + (isNewNotice(n) ? '<span class="px-1.5 py-0.5 rounded bg-rose-50 text-rose-600 text-[10px] font-extrabold whitespace-nowrap">NEW</span>' : '');
    }
    function setNoticeFilter(cat) { noticeFilter = cat; renderAll(); }

    function renderOverviewNotices() {
      const list = sortedNotices().slice(0, OVERVIEW_NOTICE_COUNT);
      return `
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="megaphone" class="w-4 h-4 text-indigo-600"></i>
            <h3 class="text-sm font-bold text-slate-900">공지·News</h3>
            <span class="text-xs text-slate-400">· 최근 ${OVERVIEW_NOTICE_COUNT}개</span>
            <button type="button" onclick="openNoticeEditModal()" class="ml-auto inline-flex items-center gap-1 px-2 py-1 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100 shrink-0"><i data-lucide="pen-line" class="w-3.5 h-3.5"></i>글쓰기</button>
            <button type="button" onclick="setActiveTab('notices')" class="text-xs font-medium text-indigo-600 hover:text-indigo-800 shrink-0">전체 ${state.notices.length}개 →</button>
          </div>
          <div class="divide-y divide-slate-100">
            ${list.length ? list.map(n => `
              <div onclick="openNoticeModal('${n.id}')" class="flex items-center gap-2.5 px-2 py-2 -mx-2 rounded-lg hover:bg-slate-50 cursor-pointer">
                <span class="shrink-0 w-16 flex">${noticeBadge(n.category)}</span>
                <span class="flex items-center gap-1.5 min-w-0 flex-1">
                  <span class="text-sm ${n.important ? 'font-bold text-slate-900' : 'font-medium text-slate-800'} truncate">${escapeHtml(n.title)}</span>
                  ${noticeMarks(n)}
                </span>
                <span class="hidden sm:inline text-xs text-slate-400 shrink-0">${escapeHtml(getMember(n.authorId).name)}</span>
                <span class="text-xs text-slate-400 shrink-0 w-10 text-right">${n.date ? shortDate(n.date) : ''}</span>
              </div>`).join('') : '<p class="text-xs text-slate-400 py-3 text-center">등록된 공지가 없습니다. [글쓰기]로 첫 공지를 올려 보세요.</p>'}
          </div>
        </section>`;
    }

    function renderNotices() {
      const cats = ['전체', ...NOTICE_CATEGORIES];
      const list = sortedNotices(state.notices.filter(n => noticeFilter === '전체' || n.category === noticeFilter));
      return `
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="flex flex-wrap gap-1.5">
            ${cats.map(c => `<button type="button" onclick="setNoticeFilter('${c}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${noticeFilter === c ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${c}</button>`).join('')}
          </div>
          <button type="button" onclick="openNoticeEditModal()" class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold transition shrink-0">
            <i data-lucide="pen-line" class="w-4 h-4"></i> 글쓰기
          </button>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm divide-y divide-slate-100">
          ${list.length ? list.map(n => `
            <div onclick="openNoticeModal('${n.id}')" class="p-4 sm:px-5 hover:bg-slate-50 cursor-pointer ${n.important ? 'bg-rose-50/40' : ''}">
              <div class="flex items-center gap-2 min-w-0">
                ${noticeBadge(n.category)}
                <h4 class="text-sm ${n.important ? 'font-bold' : 'font-semibold'} text-slate-900 truncate">${escapeHtml(n.title)}</h4>
                ${noticeMarks(n)}
                <span class="ml-auto text-xs text-slate-400 shrink-0 whitespace-nowrap">${escapeHtml(getMember(n.authorId).name)} · ${n.date ? shortDateWithDay(n.date) : ''}</span>
              </div>
              ${n.content ? `<p class="text-xs text-slate-500 mt-1.5 line-clamp-2 whitespace-pre-line">${richText(n.content)}</p>` : ''}
            </div>`).join('') : '<p class="p-10 text-center text-sm text-slate-400">등록된 글이 없습니다.</p>'}
        </div>`;
    }

    function openNoticeModal(id) {
      const n = state.notices.find(x => x.id === id);
      if (!n) return;
      const canEdit = canEditReport(n);
      openModal(n.title, `
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
            <div class="flex flex-wrap items-center gap-2">
              ${noticeBadge(n.category)}${noticeMarks(n)}
              <span class="text-xs text-slate-500">${escapeHtml(getMember(n.authorId).name)}</span>
              <span class="text-xs text-slate-400">· ${n.date ? shortDateWithDay(n.date) : ''}${n.updatedAt && n.updatedAt !== n.date ? ` (수정 ${shortDate(n.updatedAt)})` : ''}</span>
            </div>
            <div class="flex items-center gap-1.5">
              ${canEdit ? `
                <button type="button" onclick="openNoticeEditModal('${n.id}')" class="px-3 py-1 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700">편집</button>
                <button type="button" onclick="deleteItem('notices', '${n.id}')" class="px-3 py-1 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50">삭제</button>` : readOnlyNote()}
            </div>
          </div>
          <div class="text-sm text-slate-800 whitespace-pre-line leading-relaxed">${richText(n.content) || '<span class="text-slate-400">내용 없음</span>'}</div>
        </div>
      `);
    }

    function openNoticeEditModal(id = '') {
      const n = id ? state.notices.find(x => x.id === id) : null;
      if (n && !canEditReport(n)) return showToast('작성자 본인과 관리자만 수정할 수 있습니다.', 'error');
      openModal(n ? '공지·News 수정' : '공지·News 글쓰기', `
        <form onsubmit="saveNotice(event, '${id}')" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">제목 *</label>
            <input required name="title" maxlength="120" value="${n ? escapeHtml(n.title) : ''}" placeholder="예: 12월 정기 회의 일정 안내" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">분류</label>
              <select name="category" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                ${NOTICE_CATEGORIES.map(c => `<option value="${c}" ${n && n.category === c ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
            </div>
            <div>${renderAuthorField(n)}</div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">내용</label>
            <textarea data-rich name="content" rows="7" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm leading-relaxed">${n ? escapeHtml(n.content) : ''}</textarea>
          </div>
          <label class="inline-flex items-center gap-2 text-xs text-slate-700 cursor-pointer">
            <input type="checkbox" name="important" ${n && n.important ? 'checked' : ''} class="rounded text-rose-600" />
            <span>중요 공지 (목록 맨 위에 고정)</span>
          </label>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">취소</button>
            <button type="submit" class="px-4 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">${n ? '저장' : '올리기'}</button>
          </div>
        </form>
      `);
    }

    function saveNotice(e, id) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const prev = id ? state.notices.find(x => x.id === id) : null;
      const data = {
        id: id || uid('n'),
        title: fd.get('title').trim(),
        category: fd.get('category'),
        authorId: fd.get('authorId') || myMemberId(),
        content: (fd.get('content') || '').trim(),
        important: fd.get('important') === 'on',
        date: prev && prev.date ? prev.date : TODAY,
        updatedAt: TODAY
      };
      saveItem('notices', data, 'start', prev ? '글을 수정했습니다.' : '공지를 올렸습니다.');
    }

    // =========================================================================
    // 10. MODALS (CRUD + CONFIRM + SHARE + QUICK ADD)
    // =========================================================================
    let pendingConfirm = null;

    let modalDirty = false; // 창 안에서 무언가 입력했는지 (바깥 클릭으로 닫히지 않게)

    function openModal(title, bodyHtml) {
      pendingConfirm = null;
      modalDirty = false;
      document.getElementById('modal-hint').classList.add('hidden');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      enhanceRichInputs(document.getElementById('modal-body'));
      document.getElementById('modal-box').classList.replace('max-w-3xl', 'max-w-xl'); // 넓은 창을 쓴 뒤 원래 너비로
      const root = document.getElementById('modal-root');
      root.classList.remove('hidden');
      root.classList.add('flex');
      lucide.createIcons();
    }

    // ---- 서식 버튼 (data-rich 가 붙은 입력 칸 위에 붙음)
    function enhanceRichInputs(root) {
      root.querySelectorAll('textarea[data-rich]').forEach(ta => {
        if (ta.previousElementSibling && ta.previousElementSibling.hasAttribute('data-rich-bar')) return;
        const bar = document.createElement('div');
        bar.setAttribute('data-rich-bar', '');
        bar.className = 'flex items-center gap-0.5 mb-1';
        const b = (kind, label, title, cls) => `<button type="button" tabindex="-1" title="${title}" onmousedown="event.preventDefault()" onclick="applyRichFormat(this.parentElement.nextElementSibling, '${kind}')" class="h-6 min-w-[1.5rem] px-1.5 rounded border border-slate-200 bg-white hover:bg-slate-100 text-[11px] leading-none ${cls}">${label}</button>`;
        bar.innerHTML = b('bold', 'B', '굵게 (Ctrl+B)', 'font-black text-slate-800')
          + b('red', 'A', '빨강 강조', 'font-bold text-rose-600')
          + b('mark', '<span class="bg-yellow-200 px-0.5 rounded-sm">형광</span>', '형광펜', 'text-slate-700')
          + b('list', '• 목록', '줄 앞에 • 붙이기/빼기', 'text-slate-600');
        ta.parentNode.insertBefore(bar, ta);
      });
    }
    const RICH_MARK = { bold: '**', red: '!!', mark: '==' };
    function replaceTextareaRange(ta, start, end, text) {
      ta.focus();
      ta.setSelectionRange(start, end);
      let ok = false;
      try { ok = document.execCommand('insertText', false, text); } catch (e) {}
      if (!ok || ta.value.slice(start, start + text.length) !== text) {
        ta.setRangeText(text, start, end, 'end');
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
    function applyRichFormat(ta, kind) {
      if (!ta || ta.tagName !== 'TEXTAREA') return;
      const v = ta.value;
      const s = ta.selectionStart, e = ta.selectionEnd;
      if (kind === 'list') {
        const ls = v.lastIndexOf('\n', s - 1) + 1;
        let le = v.indexOf('\n', Math.max(e - (e > s && v[e - 1] === '\n' ? 1 : 0), s));
        if (le < 0) le = v.length;
        const lines = v.slice(ls, le).split('\n');
        const allOn = lines.every(l => /^\s*[•\-]\s/.test(l) || !l.trim());
        const out = lines.map(l => !l.trim() ? l : allOn ? l.replace(/^(\s*)[•\-]\s/, '$1') : (/^\s*[•\-]\s/.test(l) ? l : '• ' + l)).join('\n');
        replaceTextareaRange(ta, ls, le, out);
        ta.setSelectionRange(ls, ls + out.length);
        return;
      }
      const mk = RICH_MARK[kind];
      if (!mk) return;
      // 이미 감싸져 있으면 풀기
      if (s >= mk.length && v.slice(s - mk.length, s) === mk && v.slice(e, e + mk.length) === mk) {
        const inner = v.slice(s, e);
        replaceTextareaRange(ta, s - mk.length, e + mk.length, inner);
        ta.setSelectionRange(s - mk.length, s - mk.length + inner.length);
        return;
      }
      const sel = v.slice(s, e);
      if (!sel) { // 선택이 없으면 기호만 넣고 그 사이에 커서
        replaceTextareaRange(ta, s, e, mk + mk);
        ta.setSelectionRange(s + mk.length, s + mk.length);
        return;
      }
      // 여러 줄이면 줄마다 따로 감쌈 (앞의 • / 번호는 바깥에 둠)
      const out = sel.split('\n').map(l => {
        if (!l.trim()) return l;
        const m = l.match(/^(\s*(?:[•\-]|\d+[.)])?\s*)(.*?)(\s*)$/);
        return m[2] ? m[1] + mk + m[2] + mk + m[3] : l;
      }).join('\n');
      replaceTextareaRange(ta, s, e, out);
      if (!sel.includes('\n')) {
        const m = sel.match(/^(\s*(?:[•\-]|\d+[.)])?\s*)(.*?)(\s*)$/);
        const a = s + m[1].length + mk.length;
        ta.setSelectionRange(a, a + m[2].length);
      } else ta.setSelectionRange(s, s + out.length);
    }
    document.addEventListener('keydown', e => {
      if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
      const ta = e.target;
      if (!ta || ta.tagName !== 'TEXTAREA' || !ta.hasAttribute('data-rich')) return;
      if (e.key === 'b' || e.key === 'B') { e.preventDefault(); applyRichFormat(ta, 'bold'); }
    });

    function closeModal() {

    // 브라우저 confirm() 대신 사용 (Google Sites 삽입 화면에서는 confirm 창이 막힐 수 있음)
    function askConfirm({ title, message, confirmLabel = '확인', cancelLabel = '취소', danger = true, requireText = '', onConfirm, onCancel }) {
      openModal(title, `
        <div class="space-y-4">
          <p class="text-sm text-slate-700 whitespace-pre-line leading-relaxed">${escapeHtml(message)}</p>
          ${requireText ? `
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">계속하려면 <b>${escapeHtml(requireText)}</b> 를 입력하세요</label>
              <input id="confirm-text" autocomplete="off" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-rose-400" />
            </div>
          ` : ''}
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="resolveConfirm(false)" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">${escapeHtml(cancelLabel)}</button>
            <button type="button" onclick="resolveConfirm(true)" class="px-4 py-2 rounded-lg text-xs font-semibold text-white ${danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-indigo-600 hover:bg-indigo-700'}">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      `);
      pendingConfirm = { onConfirm, onCancel, requireText };
    }

    function resolveConfirm(ok) {
      const p = pendingConfirm;
      if (!p) return closeModal();
      if (ok && p.requireText) {
        const input = document.getElementById('confirm-text');
        if (!input || input.value.trim() !== p.requireText) {
          showToast(`"${p.requireText}"를 정확히 입력하세요.`, 'error');
          return;
        }
      }
      closeModal();
      if (ok && p.onConfirm) p.onConfirm();
      if (!ok && p.onCancel) p.onCancel();
    }

    function dailyDefaultWorkplace(item) {
      if (item && item.workplace) return { workplace: item.workplace, siteId: item.siteId };
      const me = getMember(item ? item.authorId : myMemberId());
      const st = me ? statusToday(me) : '';
      if (st === '해외 출장 중' || st === '국내 출장 중') {
        const place = String(me.tripPlace || '').replace(/\s+/g, '').toLowerCase();
        const site = place && tripSitesSorted().find(x => { const n = x.name.replace(/\s+/g, '').toLowerCase(); const short = n.split('(')[0]; return n === place || n.startsWith(place) || (short && place.includes(short)); });
        if (site) return { workplace: '현장', siteId: site.id };
        return { workplace: st === '국내 출장 중' ? '이동 중' : '현장', siteId: '' };
      }
      if (st === '외근') return { workplace: '이동 중', siteId: '' };
      return { workplace: '사내', siteId: '' };
    }
    function dailyWorkplaceLabel(d) {

      return d.workplace === '현장' && d.siteId ? issueSiteName(d.siteId) : d.workplace;

    function dailyDefaultDate() {
      return new Date().getHours() < LATE_NIGHT_UNTIL ? addDays(TODAY, -1) : TODAY;

    function isLegacyDaily(d) {
      return !d.morning && !d.afternoon && !d.tomorrow && !!(d.yesterday || d.today);
    }

      const t = String(v || '').trim();
      return /^[\s•\-·]*$/.test(t) ? '' : t;
    }

    function saveSchedule(e, id) {
