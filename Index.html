        </select>`;
      const chip = (key, label, n, color) => `<button type="button" onclick="setIssueFilter('quick', '${f.quick === key ? '' : key}')" class="px-2.5 py-1 rounded-lg text-xs font-semibold border ${f.quick === key ? color + ' border-transparent' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">${label} <span class="opacity-70">${n}</span></button>`;
      const viewBtn = (id, label, icon) => `<button type="button" onclick="setIssueView('${id}')" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold ${view === id ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</button>`;
      const sites = tripSitesSorted();
      const body = view === 'kanban' ? renderIssueKanban(list) : view === 'sites' ? renderIssueSites() : renderIssueList(list);
      return `
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="inline-flex p-1 rounded-xl bg-slate-100 border border-slate-200">${viewBtn('list', '목록', 'list')}${viewBtn('kanban', '칸반', 'columns-3')}${viewBtn('sites', '사이트별', 'map-pin')}</div>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="exportIssuesExcel()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold whitespace-nowrap"><i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>엑셀로 내보내기</button>
              <button type="button" onclick="openIssueEditModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold whitespace-nowrap"><i data-lucide="plus" class="w-3.5 h-3.5"></i>이슈 등록</button>
            </div>
          </div>
          ${view === 'sites' ? '' : `
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
            <div class="flex flex-wrap items-center gap-2">
              <div class="relative">
                <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
                <input id="issue-search" value="${escapeHtml(f.q || '')}" oninput="setIssueFilter('q', this.value)" placeholder="제목·내용·장비·기록 검색" class="w-56 pl-8 pr-3 py-1.5 text-xs border border-slate-200 rounded-lg bg-slate-50 focus:bg-white" />
              </div>
              ${view === 'kanban' ? '' : sel('status', [{ v: '열린 이슈', l: '열린 이슈' }, ...ISSUE_STATUSES.map(s => ({ v: s, l: s }))], '상태: 전체')}
              ${sel('site', [{ v: '사내', l: '사내' }, ...sites.map(s => ({ v: s.id, l: s.name }))], '사이트: 전체')}
              ${sel('severity', ISSUE_SEVERITIES.map(s => ({ v: s, l: s })), '심각도: 전체')}
              ${sel('member', workMembers().map(m => ({ v: m.id, l: m.name })), '담당자: 전체')}
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
              ${chip('mine', '내 이슈', state.issues.filter(i => issueOpen(i) && (i.assigneeIds.includes(myMemberId()) || i.authorId === myMemberId())).length, 'bg-indigo-600 text-white')}
              ${chip('urgent', '긴급', open.filter(i => i.severity === '긴급').length, 'bg-rose-600 text-white')}
              ${chip('overdue', '기한 지남', state.issues.filter(issueOverdue).length, 'bg-amber-500 text-white')}
              <span class="text-xs text-slate-400 ml-1">열린 이슈 ${open.length}건 · 표시 ${list.length}건</span>
            </div>
          </div>`}
          ${body}
        </div>`;
    }

    function renderIssueList(list) {
      if (!list.length) return '<div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-400">조건에 맞는 이슈가 없습니다.</div>';
      // 휴대폰: 카드 목록
      const cards = `
        <div class="md:hidden space-y-2">
          ${list.map(i => `
            <div onclick="openIssueModal('${i.id}')" class="bg-white rounded-2xl border ${issueOverdue(i) ? 'border-rose-200' : 'border-slate-200'} p-3.5 shadow-sm active:bg-slate-50 ${issueOpen(i) ? '' : 'opacity-60'}">
              <div class="flex items-center gap-1.5 flex-wrap">${issueBadge(ISSUE_SEVERITY_STYLE, i.severity)}${issueBadge(ISSUE_STATUS_STYLE, i.status)}${issueSiteChip(i.siteId)}</div>
              <p class="text-[15px] font-semibold text-slate-900 mt-1.5 leading-snug">${escapeHtml(i.title)}</p>
              <p class="text-xs text-slate-500 mt-1">${i.equipment ? escapeHtml(i.equipment) + ' · ' : ''}${escapeHtml(issueAssignees(i))}${i.dueDate ? ` · <span class="${issueOverdue(i) ? 'text-rose-600 font-bold' : ''}">~${i.dueDate.slice(5).replace('-', '/')}${issueOverdue(i) ? ' 지남' : ''}</span>` : ''}${i.logs.length ? ` · 💬${i.logs.length}` : ''}${i.attachments.length ? ` · 📎${i.attachments.length}` : ''}</p>
            </div>`).join('')}
        </div>`;
      return cards + `
        <div class="hidden md:block bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
          <table class="w-full min-w-[860px] text-sm border-collapse">
            <thead><tr class="bg-slate-50 text-[11px] font-bold text-slate-500 text-left">
              <th class="px-3 py-2 w-16">심각도</th><th class="px-3 py-2">제목</th><th class="px-3 py-2 w-32">사이트</th><th class="px-3 py-2 w-28">분류</th>
              <th class="px-3 py-2 w-28">상태</th><th class="px-3 py-2 w-28">담당</th><th class="px-3 py-2 w-24">목표일</th><th class="px-3 py-2 w-16 text-center">기록</th>
            </tr></thead>
            <tbody>${list.map(i => `
              <tr onclick="openIssueModal('${i.id}')" class="border-t border-slate-100 hover:bg-indigo-50/40 cursor-pointer ${issueOpen(i) ? '' : 'opacity-60'}">
                <td class="px-3 py-2.5">${issueBadge(ISSUE_SEVERITY_STYLE, i.severity)}</td>
                <td class="px-3 py-2.5 min-w-0">
                  <p class="font-semibold text-slate-900 truncate max-w-[360px]">${escapeHtml(i.title)}</p>
                  <p class="text-[11px] text-slate-500 truncate max-w-[360px]">${i.equipment ? escapeHtml(i.equipment) + ' · ' : ''}${i.openedAt} 발생${i.attachments.length ? ` · 📎${i.attachments.length}` : ''}</p>
                </td>
                <td class="px-3 py-2.5">${issueSiteChip(i.siteId)}</td>
                <td class="px-3 py-2.5 text-xs text-slate-600">${escapeHtml(i.category)}</td>
                <td class="px-3 py-2.5">${issueBadge(ISSUE_STATUS_STYLE, i.status)}</td>
                <td class="px-3 py-2.5 text-xs text-slate-700 truncate max-w-[120px]">${escapeHtml(issueAssignees(i))}</td>
                <td class="px-3 py-2.5 text-xs whitespace-nowrap ${issueOverdue(i) ? 'text-rose-600 font-bold' : 'text-slate-500'}">${i.dueDate ? i.dueDate.slice(5).replace('-', '/') + (issueOverdue(i) ? ' 지남' : '') : '-'}</td>
                <td class="px-3 py-2.5 text-xs text-center text-slate-500">${i.logs.length || ''}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function renderIssueKanban(list) {
      return `
        <div class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-5 gap-3">
          ${ISSUE_STATUSES.map(st => {
            const col = list.filter(i => i.status === st);
            return `
            <div class="bg-slate-100/70 rounded-2xl p-2.5 min-h-[200px]" ondragover="event.preventDefault(); this.classList.add('ring-2','ring-indigo-300')" ondragleave="this.classList.remove('ring-2','ring-indigo-300')" ondrop="this.classList.remove('ring-2','ring-indigo-300'); dropIssue(event, '${st}')">
              <div class="flex items-center justify-between px-1.5 pb-2">${issueBadge(ISSUE_STATUS_STYLE, st)}<span class="text-xs text-slate-500 font-semibold">${col.length}</span></div>
              <div class="space-y-2">
                ${col.map(i => `
                  <div draggable="true" ondragstart="event.dataTransfer.setData('text/plain', '${i.id}')" onclick="openIssueModal('${i.id}')" class="bg-white rounded-xl border ${issueOverdue(i) ? 'border-rose-200' : 'border-slate-200'} p-3 shadow-sm hover:border-indigo-300 cursor-pointer space-y-1.5">
                    <div class="flex items-center gap-1.5 flex-wrap">${issueBadge(ISSUE_SEVERITY_STYLE, i.severity)}${issueSiteChip(i.siteId)}</div>
                    <p class="text-sm font-semibold text-slate-900 leading-snug">${escapeHtml(i.title)}</p>
                    <p class="text-[11px] text-slate-500">${escapeHtml(issueAssignees(i))}${i.dueDate ? ` · <span class="${issueOverdue(i) ? 'text-rose-600 font-bold' : ''}">~${i.dueDate.slice(5).replace('-', '/')}</span>` : ''}${i.logs.length ? ` · 💬${i.logs.length}` : ''}</p>
                  </div>`).join('') || '<p class="text-[11px] text-slate-400 text-center py-4">없음</p>'}
              </div>
            </div>`;
          }).join('')}
        </div>
        <p class="text-[11px] text-slate-400">카드를 다른 열로 끌어 놓으면 상태가 바뀌고 처리 기록에 남습니다.</p>`;
    }

    function dropIssue(e, status) {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      const i = state.issues.find(x => x.id === id);
      if (!i || i.status === status) return;
      saveIssueStatus(i, status, '');
    }

    function renderIssueSites() {
      const groups = [...tripSitesSorted().map(s => ({ id: s.id, name: s.name })), { id: '', name: '사내' }]
        .map(g => ({ ...g, list: state.issues.filter(i => (i.siteId || '') === g.id) }))
        .filter(g => g.list.length);
      if (!groups.length) return '<div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-400">등록된 이슈가 없습니다.</div>';
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          ${groups.map(g => {
            const open = g.list.filter(issueOpen);
            const urgent = open.filter(i => i.severity === '긴급').length;
            const overdue = g.list.filter(issueOverdue).length;
            return `
            <div class="bg-white rounded-2xl border ${urgent ? 'border-rose-200' : 'border-slate-200'} p-4 shadow-sm space-y-3">
              <div class="flex items-center justify-between gap-2">${issueSiteChip(g.id)}<button type="button" onclick="state.issueFilter = { status: '열린 이슈', site: '${g.id || '사내'}' }; setIssueView('list')" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">목록 보기 →</button></div>
              <div class="grid grid-cols-3 gap-2 text-center">
                <div class="rounded-lg bg-slate-50 py-2"><p class="text-lg font-bold text-slate-900">${open.length}</p><p class="text-[11px] text-slate-500">열린 이슈</p></div>
                <div class="rounded-lg ${urgent ? 'bg-rose-50' : 'bg-slate-50'} py-2"><p class="text-lg font-bold ${urgent ? 'text-rose-600' : 'text-slate-400'}">${urgent}</p><p class="text-[11px] text-slate-500">긴급</p></div>
                <div class="rounded-lg ${overdue ? 'bg-amber-50' : 'bg-slate-50'} py-2"><p class="text-lg font-bold ${overdue ? 'text-amber-600' : 'text-slate-400'}">${overdue}</p><p class="text-[11px] text-slate-500">기한 지남</p></div>
              </div>
              <div class="space-y-1.5">
                ${open.slice().sort((a, b) => ISSUE_SEVERITIES.indexOf(a.severity) - ISSUE_SEVERITIES.indexOf(b.severity)).slice(0, 4).map(i => `
                  <div onclick="openIssueModal('${i.id}')" class="flex items-center gap-2 text-xs p-1.5 -mx-1.5 rounded-lg hover:bg-slate-50 cursor-pointer">${issueBadge(ISSUE_SEVERITY_STYLE, i.severity)}<span class="truncate text-slate-800">${escapeHtml(i.title)}</span><span class="ml-auto shrink-0">${issueBadge(ISSUE_STATUS_STYLE, i.status)}</span></div>`).join('') || '<p class="text-xs text-emerald-600">열린 이슈 없음</p>'}
              </div>
              <p class="text-[11px] text-slate-400">전체 ${g.list.length}건 · 해결·종료 ${g.list.length - open.length}건</p>
            </div>`;
          }).join('')}
        </div>`;
    }

    // --- 상세 보기 (처리 기록 남기기) ---
    function openIssueModal(id) {
      const i = state.issues.find(x => x.id === id);
      if (!i) return;
      const author = getMember(i.authorId);
      const canDelete = isAdmin() || (!!myMemberId() && i.authorId === myMemberId());
      const proj = getProject(i.projectId);
      const field = (label, value) => `<div><p class="text-[11px] font-semibold text-slate-400">${label}</p><p class="text-sm text-slate-800 mt-0.5">${value}</p></div>`;
      openModal('이슈', `
        <div class="space-y-4">
          <div class="space-y-2">
            <div class="flex flex-wrap items-center gap-1.5">${issueBadge(ISSUE_SEVERITY_STYLE, i.severity)}${issueBadge(ISSUE_STATUS_STYLE, i.status)}${issueSiteChip(i.siteId)}<span class="text-xs text-slate-500">${escapeHtml(i.category)}</span></div>
            <h3 class="text-lg font-bold text-slate-900 leading-snug">${escapeHtml(i.title)}</h3>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 p-3 rounded-xl bg-slate-50">
            ${field('장비 / 호기', escapeHtml(i.equipment || '-'))}
            ${field('담당', escapeHtml(issueAssignees(i)))}
            ${field('등록', `${escapeHtml(author.name)} · ${i.openedAt} 발생`)}
            ${field('목표일', i.dueDate ? `<span class="${issueOverdue(i) ? 'text-rose-600 font-bold' : ''}">${i.dueDate}${issueOverdue(i) ? ' (지남)' : ''}</span>` : '-')}
            ${field('관련 프로젝트', proj ? escapeHtml(proj.title) : '-')}
            ${field('해결일', i.closedAt || '-')}
          </div>
          ${i.content ? `<div><p class="text-xs font-bold text-slate-600 mb-1">내용</p><p class="text-sm text-slate-700 whitespace-pre-line leading-relaxed">${escapeHtml(i.content)}</p></div>` : ''}
          ${i.cause || i.action ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="p-3 rounded-xl bg-amber-50 border border-amber-100"><p class="text-xs font-bold text-amber-800 mb-1">원인</p><p class="text-sm text-slate-700 whitespace-pre-line">${escapeHtml(i.cause || '-')}</p></div>
            <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-100"><p class="text-xs font-bold text-emerald-800 mb-1">조치</p><p class="text-sm text-slate-700 whitespace-pre-line">${escapeHtml(i.action || '-')}</p></div>
          </div>` : ''}
          ${renderAttachmentList(i.attachments)}
          <div>
            <p class="text-xs font-bold text-slate-600 mb-2 flex items-center gap-1.5"><i data-lucide="history" class="w-3.5 h-3.5"></i>처리 기록 ${i.logs.length}건</p>
            <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
              ${i.logs.length ? i.logs.map(l => { const m = getMember(l.authorId); return `
                <div class="flex gap-2.5">
                  <span class="w-7 h-7 rounded-lg ${m.color} text-white text-[10px] font-bold flex items-center justify-center shrink-0">${escapeHtml(m.initials)}</span>
                  <div class="min-w-0 flex-1 p-2.5 rounded-xl ${l.type === 'status' ? 'bg-indigo-50/70 border border-indigo-100' : 'bg-slate-50'}">
                    <p class="text-[11px] text-slate-500"><b class="text-slate-700">${escapeHtml(m.name)}</b> · ${fmtLogTime(l.at)}</p>
                    <p class="text-sm text-slate-800 whitespace-pre-line mt-0.5">${escapeHtml(l.text)}</p>
                  </div>
                </div>`; }).join('') : '<p class="text-xs text-slate-400">아직 기록이 없습니다.</p>'}
            </div>
          </div>
          <form onsubmit="addIssueLog(event, '${i.id}')" class="space-y-2 p-3 rounded-xl border border-slate-200">
            <textarea name="text" rows="2" placeholder="처리 내용 기록 (예: 조명 각도 조정 → 과검 30% 감소)" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></textarea>
            <div class="flex flex-wrap items-center gap-2">
              <label class="text-xs text-slate-500">상태</label>
              <select name="status" class="text-xs border border-slate-200 rounded-lg px-2 py-1.5">
                ${ISSUE_STATUSES.map(s => `<option value="${s}" ${i.status === s ? 'selected' : ''}>${s}${i.status === s ? ' (그대로)' : ''}</option>`).join('')}
              </select>
              <button type="submit" class="ml-auto px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">기록 남기기</button>
            </div>
          </form>
          <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
            <div class="flex gap-1.5">
              ${canDelete ? `<button type="button" onclick="deleteItem('issues', '${i.id}')" class="px-3 py-2 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50">삭제</button>` : ''}
              ${!issueOpen(i) ? `<button type="button" onclick="issueToPool('${i.id}')" class="px-3 py-2 rounded-lg text-xs font-semibold text-violet-700 hover:bg-violet-50" title="원인·조치를 트러블슈팅 문서로">업무 Pool로 옮기기</button>` : ''}
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">닫기</button>
              <button type="button" onclick="openIssueEditModal('${i.id}')" class="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-white">수정</button>
            </div>
          </div>
        </div>`);
      document.getElementById('modal-box').classList.replace('max-w-xl', 'max-w-3xl');
    }

    function issueStamp(next, prevStatus) {
      next.updatedAt = TODAY;
      if (ISSUE_CLOSED.includes(next.status) && !ISSUE_CLOSED.includes(prevStatus || '')) next.closedAt = TODAY;
      if (!ISSUE_CLOSED.includes(next.status)) next.closedAt = '';
      return next;
    }
    function saveIssueStatus(i, status, text) {
      const next = clone(i);
      const logs = [];
      if (text) logs.push({ id: uid('l'), at: nowIso(), authorId: myMemberId(), type: 'note', text });
      if (status !== i.status) logs.push({ id: uid('l'), at: nowIso(), authorId: myMemberId(), type: 'status', text: `상태 변경: ${i.status} → ${status}` });
      next.status = status;
      next.logs = [...next.logs, ...logs];
      issueStamp(next, i.status);
      if (!commit([{ op: 'upsert', collection: 'issues', item: next, position: 'start' }])) return false;
      renderAll();
      showToast(status !== i.status ? `상태를 '${status}'(으)로 바꿨습니다.` : '처리 기록을 남겼습니다.', 'success');
      return true;
    }
    function addIssueLog(e, id) {
      e.preventDefault();
      const i = state.issues.find(x => x.id === id);
      if (!i) return;
      const fd = new FormData(e.target);
      const text = (fd.get('text') || '').trim().slice(0, 2000);
      const status = ISSUE_STATUSES.includes(fd.get('status')) ? fd.get('status') : i.status;
      if (!text && status === i.status) return showToast('기록할 내용을 쓰거나 상태를 바꿔 주세요.', 'error');
      if (!myMemberId()) return showToast('팀원으로 로그인해야 기록을 남길 수 있습니다.', 'error');
      if (saveIssueStatus(i, status, text)) openIssueModal(id);
    }

    // --- 등록·수정 ---
    function openIssueEditModal(id = '') {
      const i = id ? state.issues.find(x => x.id === id) : null;
      const v = i || { title: '', content: '', siteId: '', equipment: '', category: ISSUE_CATEGORIES[0], severity: '보통', assigneeIds: myMemberId() ? [myMemberId()] : [], status: '접수', openedAt: TODAY, dueDate: '', projectId: '', cause: '', action: '', attachments: [] };
      poolDraft = clone(v.attachments || []);
      const opt = (list, cur) => list.map(x => `<option value="${escapeHtml(x)}" ${cur === x ? 'selected' : ''}>${escapeHtml(x)}</option>`).join('');
      openModal(i ? '이슈 수정' : '이슈 등록', `
        <form onsubmit="saveIssue(event, '${id}')" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">제목 *</label>
            <input required name="title" maxlength="150" value="${escapeHtml(v.title)}" placeholder="예: 3호기 포일 검사 과검출" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="col-span-2">
              <label class="block text-xs font-semibold text-slate-600 mb-1">사이트</label>
              <select name="siteId" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                <option value="" ${!v.siteId ? 'selected' : ''}>사내</option>
                ${tripSitesSorted().map(s => `<option value="${s.id}" ${v.siteId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
              </select>
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-semibold text-slate-600 mb-1">장비 / 호기</label>
              <input name="equipment" maxlength="80" value="${escapeHtml(v.equipment)}" placeholder="예: 2공장 음극 3호기" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-semibold text-slate-600 mb-1">분류</label>
              <select name="category" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">${opt(ISSUE_CATEGORIES, v.category)}</select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">심각도</label>
              <select name="severity" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">${opt(ISSUE_SEVERITIES, v.severity)}</select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">상태</label>
              <select name="status" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">${opt(ISSUE_STATUSES, v.status)}</select>
            </div>
            <div class="col-span-1">
              <label class="block text-xs font-semibold text-slate-600 mb-1">발생일</label>
              <input type="date" name="openedAt" value="${escapeHtml(v.openedAt)}" class="w-full border border-slate-200 rounded-lg px-2 py-2 text-sm" />
            </div>
            <div class="col-span-1">
              <label class="block text-xs font-semibold text-slate-600 mb-1">목표일</label>
              <input type="date" name="dueDate" value="${escapeHtml(v.dueDate)}" class="w-full border border-slate-200 rounded-lg px-2 py-2 text-sm" />
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-semibold text-slate-600 mb-1">관련 프로젝트</label>
              <select name="projectId" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                <option value="">없음</option>
                ${state.projects.map(p => `<option value="${p.id}" ${v.projectId === p.id ? 'selected' : ''}>${escapeHtml(p.title)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">담당자</label>
            <div class="flex flex-wrap gap-1.5">
              ${workMembers(v.assigneeIds).map(m => `
                <label class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border border-slate-200 text-xs cursor-pointer hover:bg-slate-50">
                  <input type="checkbox" name="assigneeIds" value="${m.id}" ${v.assigneeIds.includes(m.id) ? 'checked' : ''} class="rounded text-indigo-600" /><span>${escapeHtml(m.name)}</span>
                </label>`).join('')}
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">내용</label>
            <textarea name="content" rows="4" placeholder="현상, 발생 조건, 고객 요청 사항 등" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">${escapeHtml(v.content)}</textarea>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">원인 <span class="font-normal text-slate-400">(해결할 때)</span></label>
              <textarea name="cause" rows="2" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">${escapeHtml(v.cause)}</textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">조치 <span class="font-normal text-slate-400">(해결할 때)</span></label>
              <textarea name="action" rows="2" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">${escapeHtml(v.action)}</textarea>
            </div>
          </div>
          ${renderAttachmentEditorShell()}
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="${i ? `openIssueModal('${i.id}')` : 'closeModal()'}" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">취소</button>
            <button type="submit" class="px-4 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">저장</button>
          </div>
        </form>`);
      document.getElementById('modal-box').classList.replace('max-w-xl', 'max-w-3xl');
    }

    function saveIssue(e, id) {
      e.preventDefault();
      if (poolDraft.some(a => a.uploading)) return showToast('파일을 올리는 중입니다. 끝난 뒤에 저장해 주세요.', 'error');
      if (!myMemberId() && !id) return showToast('팀원으로 로그인해야 이슈를 등록할 수 있습니다.', 'error');
      const fd = new FormData(e.target);
      const prev = id ? state.issues.find(x => x.id === id) : null;
      const pick = (val, list, fallback) => (list.includes(val) ? val : fallback);
      const data = {
        id: id || uid('i'),
        title: (fd.get('title') || '').trim().slice(0, 150),
        content: (fd.get('content') || '').trim(),
        siteId: idOr(fd.get('siteId')),
        equipment: (fd.get('equipment') || '').trim().slice(0, 80),
        category: pick(fd.get('category'), ISSUE_CATEGORIES, '기타'),
        severity: pick(fd.get('severity'), ISSUE_SEVERITIES, '보통'),
        status: pick(fd.get('status'), ISSUE_STATUSES, '접수'),
        assigneeIds: fd.getAll('assigneeIds').filter(x => ID_RE.test(x)),
        openedAt: DATE_RE.test(fd.get('openedAt') || '') ? fd.get('openedAt') : TODAY,
        dueDate: DATE_RE.test(fd.get('dueDate') || '') ? fd.get('dueDate') : '',
        projectId: idOr(fd.get('projectId')),
        cause: (fd.get('cause') || '').trim(),
        action: (fd.get('action') || '').trim(),
        attachments: attachList(poolDraft),
        authorId: prev ? prev.authorId : myMemberId(),
        createdAt: prev ? prev.createdAt : TODAY,
        closedAt: prev ? prev.closedAt : '',
        logs: prev ? clone(prev.logs) : []
      };
      if (!data.title) return showToast('제목을 넣어 주세요.', 'error');
      if (prev && prev.status !== data.status) data.logs.push({ id: uid('l'), at: nowIso(), authorId: myMemberId(), type: 'status', text: `상태 변경: ${prev.status} → ${data.status}` });
      if (!prev) data.logs.push({ id: uid('l'), at: nowIso(), authorId: myMemberId(), type: 'status', text: `이슈 등록 (${data.status})` });
      issueStamp(data, prev ? prev.status : '');
      if (!commit([{ op: 'upsert', collection: 'issues', item: data, position: 'start' }])) return;
      // 긴급 이슈가 새로 생기면 대화방에 알림
      if (data.severity === '긴급' && issueOpen(data) && (!prev || prev.severity !== '긴급') && chatAvailable()) {
        postAuth({ action: 'chatSend', session: auth.session, text: `🚨 긴급 이슈 ${prev ? '지정' : '등록'}: [${issueSiteName(data.siteId)}] ${data.title}\n담당: ${issueAssignees(data)}${data.dueDate ? ` · 목표 ${data.dueDate}` : ''}`, attachments: [] })
          .then(() => scheduleChatPoll(300)).catch(() => {});
      }
      renderAll();
      openIssueModal(data.id);
      showToast(prev ? '이슈를 저장했습니다.' : '이슈를 등록했습니다.', 'success');
    }

    // 해결된 이슈를 업무 Pool 트러블슈팅 문서로
    function issueToPool(id) {
      const i = state.issues.find(x => x.id === id);
      if (!i) return;
      const content = [
        `## 현상\n${i.content || i.title}`,
        `## 사이트 / 장비\n${issueSiteName(i.siteId)}${i.equipment ? ' · ' + i.equipment : ''}`,
        i.cause ? `## 원인\n${i.cause}` : '',
        i.action ? `## 조치\n${i.action}` : '',
        i.logs.filter(l => l.type !== 'status').length ? `## 처리 기록\n${i.logs.filter(l => l.type !== 'status').map(l => `- ${fmtLogTime(l.at)} ${getMember(l.authorId).name}: ${l.text.replace(/\n/g, ' ')}`).join('\n')}` : ''
      ].filter(Boolean).join('\n\n');
      const doc = {
        id: uid('k'), title: `[트러블슈팅] ${i.title}`, category: '트러블슈팅',
        tags: [issueSiteName(i.siteId), i.category.split('(')[0]].filter(Boolean),
        authorId: myMemberId() || i.authorId, updatedAt: TODAY, pinned: false, content, attachments: clone(i.attachments)
      };
      if (!commit([{ op: 'upsert', collection: 'knowledgePool', item: doc, position: 'start' }])) return;
      closeModal();
      state.activeTab = 'pool';
      renderAll();
      openPoolDetailModal(doc.id);
      showToast('업무 Pool에 트러블슈팅 문서로 옮겼습니다. 필요하면 편집해 주세요.', 'success');
    }

    // --- 엑셀 내보내기 (지금 거른 목록) ---
    async function exportIssuesExcel() {
      const list = state.issueView === 'sites' ? state.issues : filteredIssues();
      if (!list.length) return showToast('내보낼 이슈가 없습니다.', 'info');
      showToast('엑셀 파일을 만드는 중입니다...', 'info');
      try {
        await loadScriptOnce(EXCELJS_URL);
        const wb = new window.ExcelJS.Workbook();
        const thin = { style: 'thin', color: { argb: 'FFD0D5DD' } };
        const border = { top: thin, left: thin, bottom: thin, right: thin };
        const solid = hex => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: xlsArgb(hex) } });
        const ws = wb.addWorksheet('이슈 목록', { views: [{ state: 'frozen', ySplit: 1, xSplit: 3 }] });
        ws.columns = [
          { header: '심각도', width: 7 }, { header: '상태', width: 12 }, { header: '제목', width: 36 }, { header: '사이트', width: 15 }, { header: '장비/호기', width: 18 },
          { header: '분류', width: 18 }, { header: '담당', width: 16 }, { header: '발생일', width: 11 }, { header: '목표일', width: 11 }, { header: '해결일', width: 11 },
          { header: '내용', width: 45 }, { header: '원인', width: 30 }, { header: '조치', width: 30 }, { header: '처리 기록', width: 60 }, { header: '등록', width: 9 }
        ];
        ws.getRow(1).eachCell(c => { c.font = { bold: true }; c.fill = solid('#f1f5f9'); c.border = border; c.alignment = { horizontal: 'center', vertical: 'middle' }; });
        const sevColor = { '긴급': '#fecdd3', '높음': '#fed7aa', '보통': '#e0e7ff', '낮음': '#f1f5f9' };
        list.forEach(i => {
          const row = ws.addRow([
            i.severity, i.status, i.title, issueSiteName(i.siteId), i.equipment, i.category, issueAssignees(i), i.openedAt, i.dueDate, i.closedAt,
            i.content, i.cause, i.action, i.logs.map(l => `${fmtLogTime(l.at)} ${getMember(l.authorId).name}: ${l.text}`).join('\n'), getMember(i.authorId).name
          ]);
          row.eachCell({ includeEmpty: true }, c => { c.border = border; c.alignment = { vertical: 'top', wrapText: true }; });
          row.getCell(1).fill = solid(sevColor[i.severity] || '#ffffff');
          if (i.siteId) row.getCell(4).fill = solid(tripColor(tripSite(i.siteId)).bg);
          if (issueOverdue(i)) row.getCell(9).font = { bold: true, color: { argb: 'FFE11D48' } };
        });
        // 사이트별 요약
        const sum = wb.addWorksheet('사이트별 요약');
        sum.columns = [{ header: '사이트', width: 18 }, { header: '열린 이슈', width: 10 }, { header: '긴급', width: 8 }, { header: '기한 지남', width: 10 }, { header: '해결·종료', width: 10 }, { header: '전체', width: 8 }];
        sum.getRow(1).eachCell(c => { c.font = { bold: true }; c.fill = solid('#f1f5f9'); c.border = border; });
        [...tripSitesSorted().map(s => s.id), ''].forEach(sid => {
          const g = list.filter(i => (i.siteId || '') === sid);
          if (!g.length) return;
          const open = g.filter(issueOpen);
          const row = sum.addRow([issueSiteName(sid), open.length, open.filter(i => i.severity === '긴급').length, g.filter(issueOverdue).length, g.length - open.length, g.length]);
          row.eachCell(c => { c.border = border; });
        });
        const buf = await wb.xlsx.writeBuffer();
        downloadBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `이슈목록_${TODAY}.xlsx`);
        showToast(`이슈목록_${TODAY}.xlsx 파일을 내려받았습니다.`, 'success');
      } catch (err) {
        showToast('엑셀 파일을 만들지 못했습니다: ' + err.message, 'error');
      }
    }

    // =========================================================================
    // 10-2. Parts 관리 (보유품·대여품, 현장 반출, 반납 기한)
    // =========================================================================
    const partRented = p => p.ownership === '대여' && p.status !== '반납 완료' && p.status !== '폐기';
    function partDueDays(p) { return partRented(p) && DATE_RE.test(p.rentEnd) ? daysUntil(p.rentEnd) : null; }
    function partDueLabel(p) {
      const d = partDueDays(p);
      if (d === null) return '';
      return d < 0 ? `반납 ${-d}일 지남` : d === 0 ? '오늘 반납' : `반납 D-${d}`;
    }
    function partDueClass(p) {
      const d = partDueDays(p);
      if (d === null) return 'text-slate-400';
      return d < 0 ? 'bg-rose-600 text-white' : d <= PART_DUE_WARN_DAYS ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-600';
    }
    function partHolder(p) { return p.holderId ? getMember(p.holderId).name : ''; }
    function partWhere(p) {
      if (p.status === '현장 반출') return `${issueSiteName(p.siteId)}${partHolder(p) ? ' · ' + partHolder(p) : ''}${p.backDate ? ` · ~${p.backDate.slice(5).replace('-', '/')} 복귀` : ''}`;
      if (p.status === '사내 사용 중') return `사내${partHolder(p) ? ' · ' + partHolder(p) : ''}`;
      return p.location || '-';
    }
    // 대여 반납이 가까운(또는 지난) 것: 팀 현황에 표시
    function partsDueSoon() {
      return state.parts.filter(p => { const d = partDueDays(p); return d !== null && d <= PART_DUE_WARN_DAYS; })
        .sort((a, b) => a.rentEnd.localeCompare(b.rentEnd));
    }

    function setPartFilter(key, val) {
      state.partFilter = { ...state.partFilter, [key]: val };
      renderAll();
      if (key === 'q') { const el = document.getElementById('part-search'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
    }
    function filteredParts() {
      const f = state.partFilter;
      const q = (f.q || '').trim().toLowerCase();
      return state.parts.filter(p => {
        if (!f.showDone && (p.status === '반납 완료' || p.status === '폐기') && f.quick !== 'done') return false;
        if (f.category && f.category !== '전체' && p.category !== f.category) return false;
        if (f.status && f.status !== '전체' && p.status !== f.status) return false;
        if (f.ownership && f.ownership !== '전체' && p.ownership !== f.ownership) return false;
        if (f.quick === 'rented' && !partRented(p)) return false;
        if (f.quick === 'due' && !(partDueDays(p) !== null && partDueDays(p) <= PART_DUE_WARN_DAYS)) return false;
        if (f.quick === 'out' && p.status !== '현장 반출') return false;
        if (f.quick === 'done' && !(p.status === '반납 완료' || p.status === '폐기')) return false;
        if (q && ![p.name, p.maker, p.serial, p.vendor, p.location, p.note, issueSiteName(p.siteId), partHolder(p)].join(' ').toLowerCase().includes(q)) return false;
        return true;
      }).sort((a, b) => PART_CATEGORIES.indexOf(a.category) - PART_CATEGORIES.indexOf(b.category) || a.name.localeCompare(b.name, 'ko'));
    }

    function renderParts() {
      const f = state.partFilter;
      const list = filteredParts();
      const active = state.parts.filter(p => p.status !== '반납 완료' && p.status !== '폐기');
      const due = partsDueSoon();
      const sel = (key, options, allLabel) => `<select onchange="setPartFilter('${key}', this.value)" class="text-xs border border-slate-200 rounded-lg px-2.5 py-1.5 bg-slate-50">
          <option value="전체" ${!f[key] || f[key] === '전체' ? 'selected' : ''}>${allLabel}</option>
          ${options.map(o => `<option value="${escapeHtml(o)}" ${f[key] === o ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}
        </select>`;
      const chip = (key, label, n, color) => `<button type="button" onclick="setPartFilter('quick', '${f.quick === key ? '' : key}')" class="px-2.5 py-1 rounded-lg text-xs font-semibold border ${f.quick === key ? color + ' border-transparent' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">${label} <span class="opacity-70">${n}</span></button>`;
      const tile = (label, value, tone) => `<div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm"><p class="text-xs text-slate-500">${label}</p><p class="text-2xl font-bold mt-1 ${tone}">${value}</p></div>`;
      const overdue = due.filter(p => partDueDays(p) < 0).length;
      return `
        <div class="space-y-4">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            ${tile('관리 중인 품목', `${active.length}<span class="text-sm font-medium text-slate-400 ml-1">종 · ${active.reduce((s, p) => s + p.qty, 0)}개</span>`, 'text-slate-900')}
            ${tile('현장 반출 중', active.filter(p => p.status === '현장 반출').length, 'text-indigo-600')}
            ${tile('대여 중', active.filter(partRented).length, 'text-violet-600')}
            ${tile(`반납 임박 (${PART_DUE_WARN_DAYS}일 이내)`, `${due.length}${overdue ? `<span class="text-sm font-bold text-rose-600 ml-1">지남 ${overdue}</span>` : ''}`, due.length ? 'text-amber-600' : 'text-slate-300')}
          </div>
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-2">
                <div class="relative">
                  <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
                  <input id="part-search" value="${escapeHtml(f.q || '')}" oninput="setPartFilter('q', this.value)" placeholder="품명·모델·시리얼·대여처 검색" class="w-56 pl-8 pr-3 py-1.5 text-xs border border-slate-200 rounded-lg bg-slate-50 focus:bg-white" />
                </div>
                ${sel('category', PART_CATEGORIES, '분류: 전체')}
                ${sel('status', PART_STATUSES, '상태: 전체')}
                ${sel('ownership', PART_OWNERSHIP, '보유·대여: 전체')}
              </div>
              <div class="flex flex-wrap gap-2">
                <button type="button" onclick="exportPartsExcel()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold whitespace-nowrap"><i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>엑셀로 내보내기</button>
                <button type="button" onclick="openPartEditModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold whitespace-nowrap"><i data-lucide="plus" class="w-3.5 h-3.5"></i>품목 등록</button>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
              ${chip('out', '현장 반출', active.filter(p => p.status === '현장 반출').length, 'bg-indigo-600 text-white')}
              ${chip('rented', '대여품', active.filter(partRented).length, 'bg-violet-600 text-white')}
              ${chip('due', '반납 임박·지남', due.length, 'bg-amber-500 text-white')}
              ${chip('done', '반납 완료·폐기', state.parts.length - active.length, 'bg-slate-600 text-white')}
              <span class="text-xs text-slate-400 ml-1">표시 ${list.length}건</span>
            </div>
          </div>
          ${list.length ? `
          <div class="md:hidden space-y-2">
            ${list.map(p => `
              <div onclick="openPartModal('${p.id}')" class="bg-white rounded-2xl border ${partDueDays(p) !== null && partDueDays(p) < 0 ? 'border-rose-200' : 'border-slate-200'} p-3.5 shadow-sm active:bg-slate-50">
                <div class="flex items-center gap-1.5 flex-wrap"><span class="text-[11px] font-semibold text-slate-500">${escapeHtml(p.category)}</span>${issueBadge(PART_STATUS_STYLE, p.status)}${p.ownership === '대여' ? '<span class="px-1.5 py-0.5 rounded-md bg-violet-100 text-violet-700 text-[11px] font-bold">대여</span>' : ''}${partDueLabel(p) ? `<span class="px-1.5 py-0.5 rounded-md text-[11px] font-bold ${partDueClass(p)}">${partDueLabel(p)}</span>` : ''}</div>
                <p class="text-[15px] font-semibold text-slate-900 mt-1.5">${escapeHtml(p.name)}${p.qty > 1 ? ` <span class="text-xs text-slate-500">×${p.qty}</span>` : ''}</p>
                <p class="text-xs text-slate-500 mt-0.5">${escapeHtml([p.maker, p.serial].filter(Boolean).join(' · ') || '-')}</p>
                <p class="text-xs text-slate-600 mt-1">${escapeHtml(partWhere(p))}${p.ownership === '대여' && p.vendor ? ` · 대여처 ${escapeHtml(p.vendor)}` : ''}</p>
              </div>`).join('')}
          </div>
          <div class="hidden md:block bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
            <table class="w-full min-w-[900px] text-sm border-collapse">
              <thead><tr class="bg-slate-50 text-[11px] font-bold text-slate-500 text-left">
                <th class="px-3 py-2 w-28">분류</th><th class="px-3 py-2">품명 · 모델 · 시리얼</th><th class="px-3 py-2 w-12 text-center">수량</th>
                <th class="px-3 py-2 w-36">보유 · 대여처</th><th class="px-3 py-2 w-24">상태</th><th class="px-3 py-2 w-48">위치 · 사용자</th><th class="px-3 py-2 w-28">반납 기한</th>
              </tr></thead>
              <tbody>${list.map(p => `

    function partLog(text) { return { id: uid('l'), at: nowIso(), authorId: myMemberId(), type: 'status', text }; }

    function changePartStatus(e, id) {
      e.preventDefault();
      const p = state.parts.find(x => x.id === id);
      if (!p) return;
      if (!myMemberId()) return showToast('팀원으로 로그인해야 바꿀 수 있습니다.', 'error');
      const fd = new FormData(e.target);
      const next = clone(p);
      next.status = PART_STATUSES.includes(fd.get('status')) ? fd.get('status') : p.status;
      next.holderId = idOr(fd.get('holderId'));
      const memo = (fd.get('memo') || '').trim().slice(0, 300);
      if (next.status === '현장 반출') {
        next.siteId = idOr(fd.get('siteId'));
        next.backDate = DATE_RE.test(fd.get('backDate') || '') ? fd.get('backDate') : '';
        if (p.status !== '현장 반출') next.outDate = TODAY;
      } else {
        next.siteId = ''; next.backDate = ''; next.outDate = '';
      }
      if (next.status === '반납 완료') next.returnedAt = DATE_RE.test(fd.get('returnedAt') || '') ? fd.get('returnedAt') : TODAY;
      if (next.status === '보관 중' || next.status === '반납 완료' || next.status === '폐기') next.holderId = next.status === '보관 중' ? '' : next.holderId;
      const parts = [];
      if (next.status !== p.status) parts.push(`${p.status} → ${next.status}`);
      if (next.status === '현장 반출') parts.push([issueSiteName(next.siteId), next.holderId ? getMember(next.holderId).name : '', next.backDate ? `~${next.backDate.slice(5).replace('-', '/')} 복귀 예정` : ''].filter(Boolean).join(', '));
      else if (next.holderId !== p.holderId && next.holderId) parts.push(`사용자: ${getMember(next.holderId).name}`);
      if (next.status === '반납 완료') parts.push(`${next.returnedAt} 반납${p.vendor ? ' (' + p.vendor + ')' : ''}`);
      if (memo) parts.push(memo);
      if (!parts.length) return showToast('바뀐 내용이 없습니다.', 'info');
      next.logs = [...next.logs, partLog(parts.join(' · '))];
      next.updatedAt = TODAY;
      if (!commit([{ op: 'upsert', collection: 'parts', item: next, position: 'end' }])) return;
      renderAll();
      openPartModal(id);
      showToast('저장했습니다.', 'success');
    }

    function savePart(e, id) {
      e.preventDefault();
      if (!myMemberId() && !id) return showToast('팀원으로 로그인해야 등록할 수 있습니다.', 'error');
      const fd = new FormData(e.target);
      const prev = id ? state.parts.find(x => x.id === id) : null;
      const ownership = PART_OWNERSHIP.includes(fd.get('ownership')) ? fd.get('ownership') : '보유';
      const rentStart = DATE_RE.test(fd.get('rentStart') || '') ? fd.get('rentStart') : '';
      const rentEnd = DATE_RE.test(fd.get('rentEnd') || '') ? fd.get('rentEnd') : '';
      if (ownership === '대여' && !rentEnd) return showToast('대여품은 반납 기한을 넣어 주세요.', 'error');
      if (rentStart && rentEnd && rentEnd < rentStart) return showToast('반납 기한이 대여 시작일보다 빠릅니다.', 'error');
      const data = {
        ...(prev ? clone(prev) : { status: '보관 중', siteId: '', holderId: '', outDate: '', backDate: '', returnedAt: '', logs: [], authorId: myMemberId(), createdAt: TODAY }),
        id: id || uid('pt'),
        name: (fd.get('name') || '').trim().slice(0, 100),
        category: PART_CATEGORIES.includes(fd.get('category')) ? fd.get('category') : '기타',
        maker: (fd.get('maker') || '').trim().slice(0, 100),
        serial: (fd.get('serial') || '').trim().slice(0, 80),
        qty: clampNum(fd.get('qty'), 1, 9999, 1),
        location: (fd.get('location') || '').trim().slice(0, 80),
        ownership,
        vendor: ownership === '대여' ? (fd.get('vendor') || '').trim().slice(0, 80) : '',
        rentStart: ownership === '대여' ? rentStart : '',
        rentEnd: ownership === '대여' ? rentEnd : '',
        note: (fd.get('note') || '').trim(),
        updatedAt: TODAY
      };
      if (!data.name) return showToast('품명을 넣어 주세요.', 'error');
      if (!prev) data.logs = [partLog(`등록${ownership === '대여' ? ` (대여: ${data.vendor || '대여처 미입력'}, ~${data.rentEnd})` : ''}`)];
      else if (prev.rentEnd !== data.rentEnd && data.rentEnd) data.logs = [...data.logs, partLog(`반납 기한 변경: ${prev.rentEnd || '없음'} → ${data.rentEnd}`)];
      if (!commit([{ op: 'upsert', collection: 'parts', item: data, position: 'end' }])) return;
      renderAll();
      openPartModal(data.id);
      showToast(prev ? '저장했습니다.' : '품목을 등록했습니다.', 'success');
    }

    async function exportPartsExcel() {
      const list = filteredParts();
      if (!list.length) return showToast('내보낼 품목이 없습니다.', 'info');
      showToast('엑셀 파일을 만드는 중입니다...', 'info');
      try {
        await loadScriptOnce(EXCELJS_URL);
        const wb = new window.ExcelJS.Workbook();
        const thin = { style: 'thin', color: { argb: 'FFD0D5DD' } };
        const border = { top: thin, left: thin, bottom: thin, right: thin };
        const solid = hex => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: xlsArgb(hex) } });
        const ws = wb.addWorksheet('Parts 목록', { views: [{ state: 'frozen', ySplit: 1, xSplit: 2 }] });
        ws.columns = [
          { header: '분류', width: 14 }, { header: '품명', width: 26 }, { header: '제조사·모델', width: 24 }, { header: '시리얼·자산번호', width: 18 }, { header: '수량', width: 6 },
          { header: '소유', width: 7 }, { header: '대여처', width: 16 }, { header: '대여 시작', width: 11 }, { header: '반납 기한', width: 11 }, { header: '반납일', width: 11 },
          { header: '상태', width: 11 }, { header: '현장', width: 15 }, { header: '사용자', width: 9 }, { header: '복귀 예정', width: 11 }, { header: '보관 위치', width: 20 }, { header: '메모', width: 36 }
        ];
        ws.getRow(1).eachCell(c => { c.font = { bold: true }; c.fill = solid('#f1f5f9'); c.border = border; c.alignment = { horizontal: 'center' }; });
        list.forEach(p => {
          const row = ws.addRow([p.category, p.name, p.maker, p.serial, p.qty, p.ownership, p.vendor, p.rentStart, p.rentEnd, p.returnedAt, p.status,
            p.status === '현장 반출' ? issueSiteName(p.siteId) : '', partHolder(p), p.backDate, p.location, p.note]);
          row.eachCell({ includeEmpty: true }, c => { c.border = border; c.alignment = { vertical: 'top', wrapText: true }; });
          const d = partDueDays(p);
          if (d !== null && d <= PART_DUE_WARN_DAYS) row.getCell(9).fill = solid(d < 0 ? '#fecdd3' : '#fde68a');
        });
        const buf = await wb.xlsx.writeBuffer();
        downloadBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `Parts목록_${TODAY}.xlsx`);
        showToast(`Parts목록_${TODAY}.xlsx 파일을 내려받았습니다.`, 'success');
      } catch (err) {
        showToast('엑셀 파일을 만들지 못했습니다: ' + err.message, 'error');
      }
    }

    // =========================================================================
    // 7-1. 회의록 (참석자·내용·결정 사항·할 일 → 이슈/공지로 보내기)
    // =========================================================================
    let meetingActionsDraft = [];
    const openActions = m => m.actions.filter(a => !a.done);

    function setMeetingFilter(key, val) {
      state.meetingFilter = { ...state.meetingFilter, [key]: val };
      renderAll();
      if (key === 'q') { const el = document.getElementById('meeting-search'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
    }
    function filteredMeetings() {
      const f = state.meetingFilter;
      const q = (f.q || '').trim().toLowerCase();
      const me = myMemberId();
      return state.meetings.filter(m => {
        if (f.type && f.type !== '전체' && m.type !== f.type) return false;
        if (f.quick === 'mine' && !m.actions.some(a => !a.done && a.assigneeId === me)) return false;
        if (f.quick === 'open' && !openActions(m).length) return false;
        if (q && ![m.title, m.agenda, m.notes, m.decisions, m.externalAttendees, ...m.actions.map(a => a.text)].join(' ').toLowerCase().includes(q)) return false;
        return true;
      }).sort((a, b) => b.date.localeCompare(a.date) || b.time.localeCompare(a.time));
    }

    function renderMeetings() {
      const f = state.meetingFilter;
      const list = filteredMeetings();
      const me = myMemberId();
      const myOpen = state.meetings.flatMap(m => m.actions.filter(a => !a.done && a.assigneeId === me).map(a => ({ m, a })));
      const chip = (key, label, n, color) => `<button type="button" onclick="setMeetingFilter('quick', '${f.quick === key ? '' : key}')" class="px-2.5 py-1 rounded-lg text-xs font-semibold border ${f.quick === key ? color + ' border-transparent' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">${label} <span class="opacity-70">${n}</span></button>`;
      return `
        <div class="space-y-4">
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-2">
                <div class="relative">
                  <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
                  <input id="meeting-search" value="${escapeHtml(f.q || '')}" oninput="setMeetingFilter('q', this.value)" placeholder="제목·내용·결정·할 일 검색" class="w-56 pl-8 pr-3 py-1.5 text-xs border border-slate-200 rounded-lg bg-slate-50 focus:bg-white" />
                </div>
                <select onchange="setMeetingFilter('type', this.value)" class="text-xs border border-slate-200 rounded-lg px-2.5 py-1.5 bg-slate-50">
                  <option value="전체">회의 종류: 전체</option>
                  ${MEETING_TYPES.map(t => `<option value="${t}" ${f.type === t ? 'selected' : ''}>${t}</option>`).join('')}
                </select>
              </div>
              <button type="button" onclick="openMeetingEditModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold whitespace-nowrap"><i data-lucide="plus" class="w-3.5 h-3.5"></i>회의록 작성</button>
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
              ${chip('mine', '내 할 일', myOpen.length, 'bg-indigo-600 text-white')}
              ${chip('open', '할 일 남은 회의', state.meetings.filter(m => openActions(m).length).length, 'bg-amber-500 text-white')}
              <span class="text-xs text-slate-400 ml-1">표시 ${list.length}건</span>
            </div>
          </div>
          ${myOpen.length && f.quick !== 'mine' ? `
          <div class="bg-indigo-50/60 border border-indigo-100 rounded-2xl p-3.5">
            <p class="text-xs font-bold text-indigo-800 mb-2">내 할 일 ${myOpen.length}건</p>
            <div class="space-y-1.5">${myOpen.slice(0, 5).map(({ m, a }) => `
              <label class="flex items-center gap-2 text-sm cursor-pointer">
                <input type="checkbox" onchange="toggleMeetingAction('${m.id}', '${a.id}', this.checked)" class="rounded text-indigo-600" />
                <span class="text-slate-800">${escapeHtml(a.text)}</span>
                <span class="text-[11px] text-slate-500 shrink-0">${a.dueDate ? `<span class="${a.dueDate < TODAY ? 'text-rose-600 font-bold' : ''}">~${a.dueDate.slice(5).replace('-', '/')}</span> · ` : ''}${escapeHtml(m.title)}</span>
              </label>`).join('')}</div>
          </div>` : ''}
          <div class="space-y-3">
            ${list.length ? list.map(m => {
              const open = openActions(m).length;
              const decisions = m.decisions.split('\n').map(x => x.trim()).filter(Boolean);
              return `
              <div onclick="openMeetingModal('${m.id}')" class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm hover:border-indigo-300 cursor-pointer">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="text-sm font-bold text-indigo-700 tabular-nums">${shortDateWithDay(m.date)}${m.time ? ' ' + escapeHtml(m.time) : ''}</span>
                  ${issueBadge(MEETING_TYPE_STYLE, m.type)}
                  ${m.siteId ? issueSiteChip(m.siteId) : ''}
                  <span class="ml-auto text-[11px] text-slate-500">참석 ${m.attendeeIds.length}명${m.externalAttendees ? ' + 외부' : ''}</span>
                </div>
                <p class="text-base font-semibold text-slate-900 mt-1.5">${escapeHtml(m.title)}</p>
                ${decisions.length ? `<p class="text-xs text-slate-600 mt-1 line-clamp-2"><b class="text-emerald-700">결정</b> ${escapeHtml(decisions.slice(0, 2).join(' / '))}${decisions.length > 2 ? ` 외 ${decisions.length - 2}건` : ''}</p>` : ''}
                ${m.actions.length ? `<p class="text-xs mt-1 ${open ? 'text-amber-700' : 'text-emerald-600'}">할 일 ${m.actions.length - open}/${m.actions.length} 완료${open ? ` · 남은 ${open}건` : ''}</p>` : ''}
              </div>`;
            }).join('') : '<div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-400">회의록이 없습니다.</div>'}
          </div>
        </div>`;
    }

    function openMeetingModal(id) {
      const m = state.meetings.find(x => x.id === id);
      if (!m) return;
      const canDelete = isAdmin() || (!!myMemberId() && m.authorId === myMemberId());
      const decisions = m.decisions.split('\n').map(x => x.trim()).filter(Boolean);
      const section = (title, body) => body ? `<div><p class="text-xs font-bold text-slate-600 mb-1">${title}</p>${body}</div>` : '';
      openModal('회의록', `
        <div class="space-y-4">
          <div>
            <div class="flex flex-wrap items-center gap-2">${issueBadge(MEETING_TYPE_STYLE, m.type)}${m.siteId ? issueSiteChip(m.siteId) : ''}<span class="text-xs text-slate-500">${shortDateWithDay(m.date)}${m.time ? ' ' + escapeHtml(m.time) : ''} · 작성 ${escapeHtml(getMember(m.authorId).name)}</span></div>
            <h3 class="text-lg font-bold text-slate-900 mt-1">${escapeHtml(m.title)}</h3>
            <p class="text-xs text-slate-500 mt-1">참석: ${escapeHtml(m.attendeeIds.map(i => getMember(i).name).join(', ') || '-')}${m.externalAttendees ? ` · 외부: ${escapeHtml(m.externalAttendees)}` : ''}</p>
          </div>
          ${section('안건', m.agenda ? `<p class="text-sm text-slate-700 whitespace-pre-line">${richText(m.agenda)}</p>` : '')}
          ${section('회의 내용', m.notes ? `<p class="text-sm text-slate-700 whitespace-pre-line leading-relaxed">${richText(m.notes)}</p>` : '')}
          ${decisions.length ? `
          <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-100">
            <div class="flex items-center justify-between mb-1.5"><p class="text-xs font-bold text-emerald-800">결정 사항 ${decisions.length}건</p><button type="button" onclick="meetingToNotice('${m.id}')" class="text-[11px] font-semibold text-emerald-700 hover:text-emerald-900">공지로 올리기 →</button></div>
            <ul class="list-disc pl-5 text-sm text-slate-800 space-y-0.5">${decisions.map(d => `<li>${richText(d)}</li>`).join('')}</ul>
          </div>` : ''}
          ${m.actions.length ? `
          <div class="p-3 rounded-xl border border-slate-200">
            <p class="text-xs font-bold text-slate-600 mb-2">할 일 ${m.actions.length - openActions(m).length}/${m.actions.length} 완료</p>
            <div class="space-y-1.5">${m.actions.map(a => {
              const issue = a.issueId ? state.issues.find(i => i.id === a.issueId) : null;
              return `
              <div class="flex items-center gap-2 text-sm">
                <input type="checkbox" ${a.done ? 'checked' : ''} onchange="toggleMeetingAction('${m.id}', '${a.id}', this.checked, true)" class="rounded text-indigo-600 shrink-0" />
                <span class="min-w-0 flex-1 ${a.done ? 'line-through text-slate-400' : 'text-slate-800'}">${escapeHtml(a.text)}</span>
                <span class="text-[11px] text-slate-500 shrink-0">${a.assigneeId ? escapeHtml(getMember(a.assigneeId).name) : '미지정'}${a.dueDate ? ` · <span class="${!a.done && a.dueDate < TODAY ? 'text-rose-600 font-bold' : ''}">~${a.dueDate.slice(5).replace('-', '/')}</span>` : ''}</span>
                ${issue ? `<button type="button" onclick="openIssueModal('${issue.id}')" class="text-[11px] font-semibold text-indigo-600 shrink-0">이슈 보기</button>` : a.done ? '' : `<button type="button" onclick="meetingActionToIssue('${m.id}', '${a.id}')" class="text-[11px] font-semibold text-rose-600 hover:text-rose-800 shrink-0" title="이 할 일을 이슈 트래킹에 등록">이슈로</button>`}
              </div>`;
            }).join('')}</div>
          </div>` : ''}
          ${renderAttachmentList(m.attachments)}
          <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
            <div class="flex gap-1.5">
              ${canDelete ? `<button type="button" onclick="deleteItem('meetings', '${m.id}')" class="px-3 py-2 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50">삭제</button>` : ''}
              <button type="button" onclick="copyMeetingText('${m.id}')" class="px-3 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">메일용 복사</button>
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">닫기</button>
              <button type="button" onclick="openMeetingEditModal('${m.id}')" class="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-white">수정</button>
            </div>
          </div>
        </div>`);
      document.getElementById('modal-box').classList.replace('max-w-xl', 'max-w-3xl');
    }

    function saveMeetingItem(next, toast) {
      next.updatedAt = TODAY;
      if (!commit([{ op: 'upsert', collection: 'meetings', item: next, position: 'start' }])) return false;
      if (toast) showToast(toast, 'success');
      return true;
    }
    function toggleMeetingAction(mid, aid, done, reopen) {
      const m = state.meetings.find(x => x.id === mid);
      if (!m) return;
      const next = clone(m);
      const a = next.actions.find(x => x.id === aid);
      if (!a) return;
      a.done = !!done;
      if (!saveMeetingItem(next, done ? '할 일을 완료로 표시했습니다.' : '할 일을 다시 열었습니다.')) return;
      renderAll();
      if (reopen) openMeetingModal(mid);
    }
    function meetingActionToIssue(mid, aid) {
      const m = state.meetings.find(x => x.id === mid);
      const a = m && m.actions.find(x => x.id === aid);
      if (!a) return;
      if (!myMemberId()) return showToast('팀원으로 로그인해야 이슈를 등록할 수 있습니다.', 'error');
      const issue = {
        id: uid('i'), title: a.text.slice(0, 150), content: `회의록 "${m.title}" (${m.date})의 할 일에서 등록`, siteId: m.siteId, equipment: '',
        category: m.type === '고객 회의' ? '고객 요청' : '기타', severity: '보통', status: '접수', assigneeIds: a.assigneeId ? [a.assigneeId] : [],
        openedAt: TODAY, dueDate: a.dueDate, projectId: '', cause: '', action: '', attachments: [], authorId: myMemberId(), createdAt: TODAY, updatedAt: TODAY, closedAt: '',
        logs: [{ id: uid('l'), at: nowIso(), authorId: myMemberId(), type: 'status', text: `회의록에서 등록 (${m.title})` }]
      };
      const next = clone(m);
      next.actions.find(x => x.id === aid).issueId = issue.id;
      next.updatedAt = TODAY;
      if (!commit([{ op: 'upsert', collection: 'issues', item: issue, position: 'start' }, { op: 'upsert', collection: 'meetings', item: next, position: 'start' }])) return;
      renderAll();
      openMeetingModal(mid);
      showToast('이슈 트래킹에 등록했습니다.', 'success');
    }
    function meetingToNotice(mid) {
      const m = state.meetings.find(x => x.id === mid);
      if (!m) return;
      const decisions = m.decisions.split('\n').map(x => x.trim()).filter(Boolean);
      openNoticeEditModal();
      const form = [...document.querySelectorAll('form')].find(f => (f.getAttribute('onsubmit') || '').includes('saveNotice'));
      if (!form) return;
      if (form.title) form.title.value = `[${m.type}] ${m.title} 결정 사항`;
      if (form.content) form.content.value = `${m.date} ${m.type} 결정 사항\n\n${decisions.map(d => '• ' + d).join('\n')}`;
      showToast('공지 작성 창에 결정 사항을 넣었습니다. 확인하고 저장하세요.', 'info');
    }
    function meetingText(m) {
      const decisions = m.decisions.split('\n').map(x => x.trim()).filter(Boolean);
      return [
        `[회의록] ${m.title}`,
        `일시: ${m.date}${m.time ? ' ' + m.time : ''} · ${m.type}${m.siteId ? ' · ' + issueSiteName(m.siteId) : ''}`,
        `참석: ${m.attendeeIds.map(i => getMember(i).name).join(', ')}${m.externalAttendees ? ' / 외부: ' + m.externalAttendees : ''}`,
        m.agenda ? `\n■ 안건\n${m.agenda}` : '',
        m.notes ? `\n■ 회의 내용\n${m.notes}` : '',
        decisions.length ? `\n■ 결정 사항\n${decisions.map(d => '- ' + d).join('\n')}` : '',
        m.actions.length ? `\n■ 할 일\n${m.actions.map(a => `- [${a.done ? '완료' : ' '}] ${a.text} (${a.assigneeId ? getMember(a.assigneeId).name : '미지정'}${a.dueDate ? ', ~' + a.dueDate : ''})`).join('\n')}` : ''
      ].filter(Boolean).map(plainText).join('\n');
    }
    function copyMeetingText(mid) {
      const m = state.meetings.find(x => x.id === mid);
      if (m) copyTextToClipboard(meetingText(m), '회의록을 복사했습니다. 메일에 붙여 넣으세요.');
    }

    // --- 작성·수정 ---
    function renderMeetingActionRows() {
      if (!meetingActionsDraft.length) return '<p class="text-xs text-slate-400">할 일 없음</p>';
      return meetingActionsDraft.map((a, i) => `
        <div class="grid grid-cols-12 gap-1.5 items-center">
          <input value="${escapeHtml(a.text)}" oninput="meetingActionsDraft[${i}].text = this.value" placeholder="할 일" class="col-span-12 sm:col-span-6 border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm bg-white" />
          <select onchange="meetingActionsDraft[${i}].assigneeId = this.value" class="col-span-5 sm:col-span-3 border border-slate-200 rounded-lg px-2 py-1.5 text-xs bg-white">
            <option value="">담당 미지정</option>
            ${workMembers([a.assigneeId]).map(mm => `<option value="${mm.id}" ${a.assigneeId === mm.id ? 'selected' : ''}>${escapeHtml(mm.name)}</option>`).join('')}
          </select>
          <input type="date" value="${escapeHtml(a.dueDate || '')}" onchange="meetingActionsDraft[${i}].dueDate = this.value" class="col-span-5 sm:col-span-2 border border-slate-200 rounded-lg px-2 py-1.5 text-xs bg-white" />
          <button type="button" onclick="meetingActionsDraft.splice(${i}, 1); refreshMeetingActionRows()" class="col-span-2 sm:col-span-1 p-1.5 rounded text-slate-400 hover:text-rose-600 hover:bg-rose-50 justify-self-center" title="빼기"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>`).join('');
    }
    function refreshMeetingActionRows() {
      document.getElementById('meeting-actions').innerHTML = renderMeetingActionRows();
      lucide.createIcons();
    }
    function addMeetingActionRow() {
      meetingActionsDraft.push({ id: uid('a'), text: '', assigneeId: '', dueDate: '', done: false, issueId: '' });
      refreshMeetingActionRows();
      const inputs = document.querySelectorAll('#meeting-actions input:not([type])');
      if (inputs.length) inputs[inputs.length - 1].focus();
    }

    function openMeetingEditModal(id = '') {
      const m = id ? state.meetings.find(x => x.id === id) : null;
      const v = m || { title: '', date: TODAY, time: '', type: MEETING_TYPES[0], siteId: '', attendeeIds: myMemberId() ? [myMemberId()] : [], externalAttendees: '', agenda: '', notes: '', decisions: '', actions: [], attachments: [] };
      meetingActionsDraft = clone(v.actions);
      poolDraft = clone(v.attachments || []);
      openModal(m ? '회의록 수정' : '회의록 작성', `
        <form onsubmit="saveMeeting(event, '${id}')" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">제목 *</label>
            <input required name="title" maxlength="150" value="${escapeHtml(v.title)}" placeholder="예: 11월 4주차 주간 회의 / 고객사A 3호기 셋업 일정 협의" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">날짜</label>
              <input type="date" name="date" value="${escapeHtml(v.date)}" class="w-full border border-slate-200 rounded-lg px-2 py-2 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">시간</label>
              <input name="time" maxlength="20" value="${escapeHtml(v.time)}" placeholder="10:00" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">종류</label>
              <select name="type" class="w-full border border-slate-200 rounded-lg px-2 py-2 text-sm">${MEETING_TYPES.map(t => `<option value="${t}" ${v.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">사이트 (선택)</label>
              <select name="siteId" class="w-full border border-slate-200 rounded-lg px-2 py-2 text-sm">
                <option value="">없음</option>
                ${tripSitesSorted().map(s => `<option value="${s.id}" ${v.siteId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">참석자</label>
            <div class="flex flex-wrap gap-1.5">
              ${state.members.map(mm => `<label class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border border-slate-200 text-xs cursor-pointer hover:bg-slate-50"><input type="checkbox" name="attendeeIds" value="${mm.id}" ${v.attendeeIds.includes(mm.id) ? 'checked' : ''} class="rounded text-indigo-600" /><span>${escapeHtml(mm.name)}</span></label>`).join('')}
            </div>
            <input name="externalAttendees" maxlength="200" value="${escapeHtml(v.externalAttendees)}" placeholder="외부 참석자 (예: 고객사 생산기술팀 2명) — 개인 연락처는 적지 마세요" class="mt-2 w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">안건</label>
            <textarea data-rich name="agenda" rows="2" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">${escapeHtml(v.agenda)}</textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">회의 내용</label>
            <textarea data-rich name="notes" rows="5" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">${escapeHtml(v.notes)}</textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">결정 사항 <span class="font-normal text-slate-400">(한 줄에 하나씩)</span></label>
            <textarea data-rich name="decisions" rows="3" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">${escapeHtml(v.decisions)}</textarea>
          </div>
          <div class="p-3 rounded-xl bg-slate-50 border border-slate-100 space-y-2">
            <div class="flex items-center justify-between"><p class="text-xs font-semibold text-slate-600">할 일</p><button type="button" onclick="addMeetingActionRow()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">+ 할 일 추가</button></div>
            <div id="meeting-actions" class="space-y-1.5">${renderMeetingActionRows()}</div>
          </div>
          ${renderAttachmentEditorShell()}
          <div class="flex justify-end gap-2 pt-1">
            <button type="button" onclick="${m ? `openMeetingModal('${m.id}')` : 'closeModal()'}" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">취소</button>
            <button type="submit" class="px-4 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">저장</button>
          </div>
        </form>`);
      document.getElementById('modal-box').classList.replace('max-w-xl', 'max-w-3xl');

    // --- 일간보고 엑셀 내보내기: 날짜마다 한 시트, 사람별 한 줄 (미제출·휴가도 표시) ---
    async function exportDailyExcel() {
      const allDates = Array.from(new Set(state.dailyReports.map(d => d.date))).sort().reverse();
      const dates = state.dailyFilterDate ? [state.dailyFilterDate] : allDates;
      if (!dates.length) return showToast('내보낼 일간보고가 없습니다.', 'info');
      const onlyMember = state.dailyFilterMember === '전체' ? '' : state.dailyFilterMember;
      showToast('엑셀 파일을 만드는 중입니다...', 'info');
      try {
        await loadScriptOnce(EXCELJS_URL);
        const wb = new window.ExcelJS.Workbook();
        const thin = { style: 'thin', color: { argb: 'FFD0D5DD' } };
        const border = { top: thin, left: thin, bottom: thin, right: thin };
        const solid = hex => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: xlsArgb(hex) } });
        const head = c => { c.font = { bold: true }; c.fill = solid('#f1f5f9'); c.border = border; c.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true }; };
        const dayLabel = d => `${d} (${'일월화수목금토'[parseYmd(d).getDay()]})`;
        const peopleFor = reports => state.members.filter(m => (!onlyMember || m.id === onlyMember) && (!m.reportExempt || reports.some(r => r.authorId === m.id)));
        // 그날 휴가였는지 (휴가/부재 일정 기준)
        const onLeave = (m, d) => leaveDaysIn(m.id, d, d) > 0;

        // 여러 날을 내보낼 때: 맨 앞에 제출 현황표
        if (dates.length > 1) {
          const shown = [...dates].reverse();
          const sum = wb.addWorksheet('제출 현황', { views: [{ state: 'frozen', xSplit: 2, ySplit: 2 }] });
          sum.mergeCells(1, 1, 1, shown.length + 3);
          Object.assign(sum.getCell(1, 1), { value: '일간보고 제출 현황', font: { bold: true, size: 14 } });
          sum.getRow(2).values = ['이름', '직급', ...shown.map(d => d.slice(5).replace('-', '/') + ' ' + '일월화수목금토'[parseYmd(d).getDay()]), '제출'];
          sum.getRow(2).eachCell(head);
          peopleFor(state.dailyReports).forEach(m => {
            const marks = shown.map(d => state.dailyReports.some(r => r.date === d && r.authorId === m.id) ? '✓' : onLeave(m, d) ? '휴가' : '');
            const row = sum.addRow([m.name, m.role, ...marks, `${marks.filter(x => x === '✓').length}/${shown.length}`]);
            row.eachCell({ includeEmpty: true }, (c, i) => {
              c.border = border;
              c.alignment = { horizontal: i <= 2 ? 'left' : 'center', vertical: 'middle' };
              if (c.value === '✓') c.font = { bold: true, color: { argb: 'FF059669' } };
              if (c.value === '휴가') c.font = { color: { argb: 'FF94A3B8' } };
            });
          });
          sum.getColumn(1).width = 10; sum.getColumn(2).width = 7;
          shown.forEach((_, i) => { sum.getColumn(i + 3).width = 9; });
          sum.getColumn(shown.length + 3).width = 7;
        }

        dates.forEach(date => {
          const reports = state.dailyReports.filter(r => r.date === date);
          const ws = wb.addWorksheet(date.slice(2).replace(/-/g, '.'), { views: [{ state: 'frozen', xSplit: 1, ySplit: 2 }] });
          ws.mergeCells(1, 1, 1, 9);
          Object.assign(ws.getCell(1, 1), { value: `일간보고 · ${dayLabel(date)}`, font: { bold: true, size: 14 } });
          ws.getRow(2).values = ['이름', '직급', '제출', '근무지', '진행 상태', '오늘 한 일 (오전)', '오늘 한 일 (오후)', '내일 할 일', '블로커 / 특이사항'];
          ws.getRow(2).eachCell(head);
          peopleFor(reports).forEach(m => {
            const r = reports.find(x => x.authorId === m.id);
            const legacy = r && isLegacyDaily(r);
            const status = r ? '제출' : onLeave(m, date) ? '휴가' : '미제출';
            const row = ws.addRow(r ? [
              m.name, m.role, status, dailyWorkplaceLabel(r), r.condition,
              ...[legacy ? `(예전 형식) 어제 한 일:\n${r.yesterday}` : r.morning, legacy ? '' : r.afternoon, legacy ? r.today : r.tomorrow,
              NO_BLOCKER_RE.test(r.blockers || '') ? '없음' : r.blockers].map(plainText)
            ] : [m.name, m.role, status, '', '', '', '', '', '']);
            row.eachCell({ includeEmpty: true }, (c, i) => {
              c.border = border;
              c.alignment = { vertical: 'top', horizontal: i <= 5 ? 'center' : 'left', wrapText: true };
            });
            row.getCell(1).alignment = { vertical: 'top', horizontal: 'left' };
            row.getCell(3).font = { bold: true, color: { argb: status === '제출' ? 'FF059669' : status === '휴가' ? 'FF94A3B8' : 'FFE11D48' } };
            if (status === '미제출') for (let c = 1; c <= 9; c++) row.getCell(c).fill = solid('#fff1f2');
            if (r && r.condition === '지원 필요') row.getCell(5).font = { bold: true, color: { argb: 'FFE11D48' } };
          });
          [10, 7, 8, 14, 10, 40, 40, 40, 30].forEach((w, i) => { ws.getColumn(i + 1).width = w; });
        });

        const buf = await wb.xlsx.writeBuffer();
        const fileName = dates.length > 1 ? `일간보고_전체_${TODAY}.xlsx` : `일간보고_${dates[0]}.xlsx`;
        downloadBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), fileName);
        showToast(`${fileName} 파일을 내려받았습니다.`, 'success');
      } catch (err) {
        showToast('엑셀 파일을 만들지 못했습니다: ' + err.message, 'error');
      }
    }

    function saveApiEndpointFromModal(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const val = (fd.get('apiUrl') || '').trim();
      if (val && !isAllowedApi(val)) {
        showToast('https:// 로 시작하는 Apps Script 웹 앱 URL을 입력하세요.', 'error');
        return;
      }
      const changedEndpoint = val !== getApiEndpoint();
      try {
        if (val) localStorage.setItem(API_ENDPOINT_KEY, val);
        else localStorage.removeItem(API_ENDPOINT_KEY);
      } catch (err) {}
      if (changedEndpoint) {
        // 다른 서버로 바꾸면 이전 서버로 보내려던 변경은 버림
        sync.pending = [];
        sync.failed = false;
        sync.version = -1;
        sync.ready = !val;

        auth.session = '';

        showToast('API 연결이 해제되었습니다. 이 브라우저에만 저장됩니다.', 'info');

    function renderBackupBox(st) {

      box.innerHTML = `
        <div class="flex flex-wrap items-center gap-2">

          ${st.folderUrl ? `<a href="${escapeHtml(st.folderUrl)}" target="_blank" rel="noopener noreferrer" class="font-semibold text-indigo-700 underline">백업 폴더 열기</a>` : ''}
        </div>
        <div class="flex flex-wrap gap-2 mt-2">
          <button type="button" onclick="backupAction({ enable: ${!st.enabled} })" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${st.enabled ? 'border border-slate-300 bg-white hover:bg-slate-50 text-slate-700' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}">${st.enabled ? '자동 백업 끄기' : '자동 백업 켜기'}</button>
          <button type="button" onclick="backupAction({ now: true })" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-indigo-200 bg-white hover:bg-indigo-50 text-indigo-700">지금 백업</button>
