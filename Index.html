<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>APSI-Vision</title>
  <!-- 휴대폰 홈 화면에 앱처럼 설치 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TeamHub" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    /* 세계시간이 다 안 들어가면 넓은 화면에서도 검색창을 돋보기 버튼으로 접음 */
    header.clocks-tight #header-search-box:not(.header-search-open) { display: none !important; }
    header.clocks-tight #header-search-btn { display: inline-flex !important; }
    /* 좁은 화면에서 돋보기 버튼으로 여는 검색창 */
    #header-search-box.header-search-open {
      display: block;
      position: absolute;
      top: 100%;
      right: 1rem;
      margin-top: 0.5rem;
      background: #fff;
      padding: 0.5rem;
      border-radius: 0.75rem;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.15);
    }
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    /* 긴 보고 접어 보이기 (전체 보기 버튼으로 펼침) */
    .report-clamp { position: relative; }
    .report-clamp.is-clamped:not(.is-open) { max-height: var(--clamp-h, 20rem); overflow: hidden; }
    .report-clamp.is-clamped:not(.is-open)::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3.5rem; pointer-events: none;
      background: linear-gradient(to bottom, rgba(255,255,255,0), var(--clamp-bg, #fff));
    }
    @media print { .report-clamp.is-clamped:not(.is-open) { max-height: none; overflow: visible; } .report-clamp::after, .report-clamp-btn { display: none !important; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-800">
  <div id="app" class="min-h-screen flex flex-col lg:flex-row">
    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/40 z-30 hidden lg:hidden" onclick="toggleMobileSidebar(false)"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 flex flex-col transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200 ease-in-out shrink-0">
      <div class="h-16 px-5 flex items-center justify-between border-b border-slate-200">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center shadow-sm">
            <i data-lucide="layers" class="w-4 h-4"></i>
          </div>
          <div>
            <h1 class="text-sm font-bold text-slate-900 leading-tight">APS Innovation</h1>
            <p class="text-[11px] text-slate-500">비전개발팀 대시보드</p>
          </div>
        </div>
        <button type="button" class="lg:hidden p-1.5 rounded-lg text-slate-500 hover:bg-slate-100" onclick="toggleMobileSidebar(false)" aria-label="사이드바 닫기">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto scrollbar-thin" id="sidebar-nav">
        <!-- Nav items rendered by JS -->
      </nav>

      <div class="p-4 border-t border-slate-200 space-y-2.5 bg-slate-50/70">
        <div class="flex items-center justify-between text-xs text-slate-500">
          <span>저장 상태</span>
          <div class="flex items-center gap-1.5">
            <span id="save-status-badge" class="inline-flex items-center gap-1 text-slate-600 font-medium">
              <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span> 준비 중
            </span>
            <button type="button" onclick="syncFromApi(false)" title="서버에서 최신 데이터 불러오기 / 저장 재시도" class="p-1 rounded hover:bg-slate-200 text-slate-500">
              <i data-lucide="refresh-cw" class="w-3 h-3"></i>
            </button>
          </div>
        </div>
        <button type="button" onclick="openShareModal()" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold transition shadow-sm">
          <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
          팀원에게 공유 / 내보내기
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Top Header -->
      <header class="h-16 bg-white border-b border-slate-200 px-4 sm:px-6 flex items-center justify-between gap-3 sticky top-0 z-20">
        <div class="flex items-center gap-3 min-w-0 xl:shrink-0">
          <button type="button" class="lg:hidden p-2 -ml-2 rounded-lg text-slate-600 hover:bg-slate-100" onclick="toggleMobileSidebar(true)" aria-label="메뉴 열기">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div class="min-w-0">
            <h2 id="page-title" class="text-base sm:text-lg font-bold text-slate-900 truncate">팀 현황</h2>
          </div>
          <div class="hidden sm:flex items-center gap-3 pl-4 border-l border-slate-200 shrink-0">
            <div>
              <p class="text-[10px] font-semibold text-indigo-600 leading-none mb-0.5">한국 (KST)</p>
              <p id="clock-home" class="text-2xl font-bold text-slate-900 tabular-nums leading-none">--:--</p>
            </div>
            <span class="self-end inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-100 text-slate-700 text-base font-semibold">
              <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
              <span id="header-date"></span>
            </span>
          </div>
        </div>

        <!-- 세계시간 (화면이 넓을 때만) -->
        <div id="world-clocks" class="hidden xl:flex items-center gap-2 min-w-0 overflow-hidden ml-auto"></div>

        <div class="flex items-center gap-2 shrink-0">
          <button id="header-search-btn" type="button" onclick="toggleHeaderSearch()" class="hidden md:inline-flex 2xl:hidden p-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600" title="전체 검색" aria-label="전체 검색">
            <i data-lucide="search" class="w-4 h-4"></i>
          </button>
          <div id="header-search-box" class="relative hidden 2xl:block">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input id="global-search" type="text" placeholder="전체 검색 (프로젝트, 문서, 인원...)" class="pl-9 pr-3 py-1.5 w-60 lg:w-72 text-sm bg-slate-100 border border-transparent focus:bg-white focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 rounded-lg outline-none transition" oninput="handleGlobalSearch(this.value)" />
          </div>
          <button type="button" onclick="openQuickAddModal()" title="빠른 등록" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-medium transition shadow-sm">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span class="hidden sm:inline xl:hidden 2xl:inline">빠른 등록</span>
          </button>
          <div id="user-chip" class="hidden relative order-last"></div>
          <a id="open-standalone-btn" href="#" target="_blank" rel="noopener" class="hidden inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-medium transition" title="새 창에서 열기 (사이트 안에서 로그인·내려받기가 막힐 때)">
            <i data-lucide="external-link" class="w-4 h-4 text-indigo-600"></i>
            <span class="hidden sm:inline xl:hidden 2xl:inline">새 창</span>
          </a>
          <button type="button" onclick="openShareModal()" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-medium transition" title="공유 및 데이터 관리">
            <i data-lucide="share-2" class="w-4 h-4 text-indigo-600"></i>
            <span class="hidden sm:inline xl:hidden 2xl:inline">공유</span>
          </button>
        </div>
      </header>

      <!-- Global Search Results Banner (when active) -->
      <div id="global-search-panel" class="hidden bg-indigo-50/80 border-b border-indigo-200 px-4 sm:px-6 py-3">
        <div class="max-w-7xl mx-auto">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-semibold text-indigo-800" id="global-search-summary">검색 결과</span>
            <button type="button" onclick="clearGlobalSearch()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">검색 닫기</button>
          </div>
          <div id="global-search-results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2"></div>
        </div>
      </div>

      <!-- Dynamic View Container -->
      <main id="main-content" class="flex-1 p-4 sm:p-6 pb-24 lg:pb-6 max-w-7xl w-full mx-auto space-y-6">
        <!-- Rendered by JS -->
      </main>
    </div>
  </div>

  <!-- Login Screen (서버 연결 시 로그인 전까지 전체를 덮음) -->
  <div id="login-screen" class="hidden fixed inset-0 z-[60] bg-slate-50 items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 w-full max-w-[360px] text-center">
      <div class="w-11 h-11 mx-auto rounded-xl bg-indigo-600 text-white flex items-center justify-center mb-3"><i data-lucide="layers" class="w-5 h-5"></i></div>
      <h1 class="text-lg font-bold text-slate-900">APS Innovation</h1>
      <p class="text-xs text-slate-500 mb-6">비전개발팀 대시보드</p>
      <div id="login-button" class="flex justify-center min-h-[44px]"></div>
      <div id="login-join" class="hidden mt-5 text-left"></div>
      <div id="login-embed-help" class="hidden mt-5"></div>
      <p class="text-[11px] text-slate-400 mt-5 leading-relaxed">처음이면 Google로 로그인한 뒤 본인 이름을 골라 가입을 요청하세요.<br>관리자가 승인하면 들어올 수 있고, 로그인은 30일 동안 유지됩니다.</p>
      <p id="login-message" class="hidden mt-5 text-xs leading-relaxed text-rose-600"></p>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/50 backdrop-blur-[1px]">
    <div id="modal-box" class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
        <div class="min-w-0 flex items-baseline gap-2 flex-wrap">
          <h3 id="modal-title" class="text-base font-bold text-slate-900">제목</h3>
          <span id="modal-hint" class="hidden text-[11px] font-semibold text-amber-600">닫으려면 X 또는 취소를 누르세요</span>
        </div>
        <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition" aria-label="모달 닫기">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-body" class="p-5 overflow-y-auto scrollbar-thin flex-1"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-40 lg:bottom-24 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- 휴대폰 아래쪽 메뉴 (큰 화면에서는 왼쪽 메뉴를 씀) -->
  <nav id="bottom-nav" class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 grid grid-cols-5" style="padding-bottom: env(safe-area-inset-bottom)"></nav>

  <!-- 팀 대화방 -->
  <button id="chat-fab" type="button" onclick="toggleChat()" class="hidden fixed bottom-20 lg:bottom-5 right-4 lg:right-auto lg:left-[17.25rem] z-40 w-14 h-14 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-600/30 items-center justify-center transition" title="팀 대화방">
    <i data-lucide="message-circle" class="w-6 h-6"></i>
    <span id="chat-badge" class="hidden absolute -top-1 -right-1 min-w-[22px] h-[22px] px-1.5 rounded-full bg-rose-600 text-white text-[11px] font-bold items-center justify-center ring-2 ring-white"></span>
  </button>
  <section id="chat-panel" class="hidden fixed z-40 inset-0 sm:inset-auto sm:bottom-24 sm:right-5 lg:right-auto lg:left-[17.25rem] sm:w-[400px] sm:h-[min(640px,calc(100vh-8rem))] bg-white sm:rounded-2xl shadow-2xl border border-slate-200 flex-col overflow-hidden">
    <div class="px-4 py-3 border-b border-slate-200 flex items-center gap-2 bg-white">
      <span class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center"><i data-lucide="messages-square" class="w-4 h-4"></i></span>
      <div class="min-w-0">
        <h3 class="text-sm font-bold text-slate-900 leading-tight">팀 전체 대화</h3>
        <p id="chat-status" class="text-[11px] text-slate-400 leading-tight"></p>
      </div>
      <button type="button" onclick="toggleChat(false)" class="ml-auto p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" title="닫기"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div id="chat-messages" class="flex-1 overflow-y-auto scrollbar-thin px-3 py-2 bg-slate-50"></div>
    <div class="relative border-t border-slate-200 bg-white">
      <div id="chat-mention-box" class="hidden absolute bottom-full left-2 mb-1 w-56 bg-white border border-slate-200 rounded-xl shadow-lg py-1 z-10"></div>
      <div id="chat-files" class="hidden px-2 pt-2 flex flex-wrap gap-1.5"></div>
      <form onsubmit="sendChat(event)" class="p-2 flex items-end gap-1.5">
        <label class="p-2 rounded-lg hover:bg-slate-100 text-slate-500 cursor-pointer shrink-0" title="파일 첨부 (한 개 20MB까지)">
          <i data-lucide="paperclip" class="w-4 h-4"></i>
          <input type="file" multiple class="hidden" onchange="chatPickFiles(this)" />
        </label>
        <textarea id="chat-input" rows="1" maxlength="2000" placeholder="메시지 입력 · @이름으로 부르기" oninput="chatInputChanged()" onkeydown="chatKeydown(event)" onclick="chatInputChanged()" class="flex-1 min-w-0 resize-none max-h-32 border border-slate-200 rounded-xl px-3 py-2 text-sm leading-snug outline-none focus:border-indigo-400 bg-slate-50 focus:bg-white"></textarea>
        <button id="chat-send" type="submit" class="p-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shrink-0 disabled:opacity-50" title="보내기 (Enter)"><i data-lucide="send-horizontal" class="w-4 h-4"></i></button>
      </form>
      <p class="px-3 pb-2 -mt-1 text-[10px] text-slate-400">Enter 보내기 · Shift+Enter 줄바꿈 · 새 메시지는 몇 초 늦게 보일 수 있습니다</p>
    </div>
  </section>

  <script>
    // =========================================================================
    // 1. CONFIG, DATES & STATE
    //    - 업무 데이터(팀원·프로젝트·보고서 등)는 서버(Google Sheets)와 공유
    //    - 화면 상태(탭·필터·달력 위치)는 각자 브라우저에만 저장
    // =========================================================================
    const LEGACY_STORAGE_KEY = 'teamhub_dashboard_state_v1';
    const DATA_STORAGE_KEY = 'teamhub_data_v2';
    const UI_STORAGE_KEY = 'teamhub_ui_v2';
    const API_ENDPOINT_KEY = 'teamhub_api_endpoint_v1';
    const API_KEY_STORAGE = 'teamhub_api_key_v1';
    const AUTO_REFRESH_MS = 60000;

    const COLLECTIONS = ['members', 'projects', 'weeklyReports', 'dailyReports', 'schedules', 'knowledgePool', 'notices', 'tripPlans', 'tripSites', 'tripStaffing', 'issues', 'parts', 'meetings'];
    const DATA_KEYS = ['teamName', ...COLLECTIONS];
    const UI_PERSIST_KEYS = ['issueView', 'weeklyView', 'activeTab', 'projectViewMode', 'projectFilterStatus', 'projectFilterPriority', 'projectFilterCategory', 'weeklyFilterMember', 'dailyFilterMember', 'memberFilterStatus', 'poolFilterCategory'];
    const MEMBER_STATUSES = ['업무중', '회의중', '국내 출장 중', '해외 출장 중', '외근', '휴가'];
    const AWAY_STATUSES = ['국내 출장 중', '해외 출장 중', '외근'];
    // 일정에 자동으로 올라가는 부재 상태 (출장·외근 + 휴가)
    const ABSENCE_STATUSES = [...AWAY_STATUSES, '휴가'];
    const NOTICE_CATEGORIES = ['공지', 'News', '행사·교육', '기타'];
    // 일간보고 근무지
    const WORKPLACES = ['사내', '현장', '재택', '이동 중'];
    const WORKPLACE_STYLE = { '사내': 'bg-slate-100 text-slate-600', '현장': 'bg-indigo-100 text-indigo-700', '재택': 'bg-teal-100 text-teal-700', '이동 중': 'bg-amber-100 text-amber-700' };
    // 이슈 트래킹
    const ISSUE_STATUSES = ['접수', '진행 중', '고객 확인 대기', '해결', '종료'];
    const ISSUE_CLOSED = ['해결', '종료'];
    const ISSUE_SEVERITIES = ['긴급', '높음', '보통', '낮음'];
    const ISSUE_CATEGORIES = ['검사 성능(과검·미검)', '하드웨어(카메라·조명)', '소프트웨어', '통신·PLC', '고객 요청', '기타'];
    const ISSUE_SEVERITY_STYLE = { '긴급': 'bg-rose-600 text-white', '높음': 'bg-orange-100 text-orange-700', '보통': 'bg-indigo-50 text-indigo-700', '낮음': 'bg-slate-100 text-slate-500' };
    // Parts 관리
    const PART_CATEGORIES = ['카메라', '렌즈', '조명', '조명 컨트롤러', '프레임 그래버·보드', 'PC·노트북', '케이블·커넥터', '센서·엔코더', '지그·브래킷', '계측 장비', 'SW 라이선스·동글', '기타'];
    const PART_STATUSES = ['보관 중', '사내 사용 중', '현장 반출', '수리 중', '반납 완료', '폐기'];
    const PART_OWNERSHIP = ['보유', '대여'];
    const PART_STATUS_STYLE = { '보관 중': 'bg-slate-100 text-slate-600', '사내 사용 중': 'bg-sky-100 text-sky-700', '현장 반출': 'bg-indigo-100 text-indigo-700', '수리 중': 'bg-amber-100 text-amber-700', '반납 완료': 'bg-emerald-100 text-emerald-700', '폐기': 'bg-slate-200 text-slate-400' };
    const PART_DUE_WARN_DAYS = 7;   // 대여품 반납 기한이 이 날 수 안으로 들어오면 표시

      if (!sch.date || d < sch.date || d > scheduleEnd(sch)) return false;

    // ---- 서버에서 받은 데이터 정리 (필요한 필드만, 형식 검사 → 화면에 이상한 값/스크립트가 끼어들지 않게)
    const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
    const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
    const str = v => (v === null || v === undefined ? '' : String(v));
    const idOr = v => (ID_RE.test(str(v)) ? str(v) : '');
    const dateOr = (v, fallback = '') => (DATE_RE.test(str(v)) ? str(v) : fallback);
    const idList = a => (Array.isArray(a) ? a.map(str).filter(x => ID_RE.test(x)) : []);
    const URL_RE = /^https?:\/\/[^\s<>"'`]+$/i;
    const FILE_ID_RE = /^f[0-9a-f]{20}$/;
    // 첨부: 팀 시트에 올린 파일(fileId)과 링크(http(s) 주소만). 예전에 Drive에 올린 파일은 링크처럼 열림
    const attachList = a => (Array.isArray(a) ? a : [])
      .filter(x => x && typeof x === 'object' && (FILE_ID_RE.test(str(x.fileId)) || URL_RE.test(str(x.url).trim())))
      .slice(0, 30)
      .map(x => {
        const stored = FILE_ID_RE.test(str(x.fileId));
        const out = {
          name: str(x.name).trim().slice(0, 150) || str(x.url).trim(), url: stored ? '' : str(x.url).trim(),
          kind: stored || x.kind === 'file' ? 'file' : 'link', mimeType: str(x.mimeType).slice(0, 100), size: clampNum(x.size, 0, 1e10, 0)
        };
        if (stored) { out.fileId = str(x.fileId); out.originalSize = clampNum(x.originalSize, 0, 1e10, 0); }
        return out;
      });
    function clampNum(v, min, max, fallback) {
      const n = Number(v);
      return Number.isFinite(n) ? Math.min(max, Math.max(min, Math.round(n))) : fallback;
    }

            .map(l => ({ id: str(l.id), at: str(l.at).slice(0, 30), authorId: idOr(l.authorId), type: l.type === 'status' ? 'status' : 'note', text: str(l.text).slice(0, 2000) }))
